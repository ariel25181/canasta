<script>
// Garantía permanente: función global de redondeo de importes a 2 decimales
window.r2 = function(n) { return Math.round(((Number(n) || 0) + Number.EPSILON) * 100) / 100; };

// Bloqueo estricto de zoom con los dedos (pinch-to-zoom) y gestos para evitar desenfoque
document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', function(e) {
  if (e.touches && e.touches.length > 1 && !e.target.closest('#map')) {
    e.preventDefault();
  }
}, { passive: false });
let _lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - _lastTouchEnd < 300) {
    if (!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) {
      e.preventDefault();
    }
  }
  _lastTouchEnd = now;
}, { passive: false });
</script>

/* ---------- Inflación Argentina (IPC INDEC) ---------- */
function getIpcData(){
  try{
    const raw=localStorage.getItem('argentina_ipc');
    if(raw)return JSON.parse(raw);
  }catch(e){}
  return {rate:2.1,date:'2026-09-30',t:Date.now(),src:'default'};
}
function getArgentinaInflationRate(){
  const d=getIpcData();
  return Number(d.rate)||2.1;
}
async function fetchInflation(force=false){
  const cur=getIpcData();
  if(!force&&cur&&cur.src!=='default'&&(Date.now()-(cur.t||0)<86400000)){
    return cur;
  }
  if(!window.location.hostname.includes('github.io')){
    try{
      const r=await fetch('/api/canasta/inflation',{signal:AbortSignal.timeout(4000)});
      if(r.ok){
        const j=await r.json();
        if(j.ok&&typeof j.rate==='number'){
          const d={rate:j.rate,date:j.date||today(),t:Date.now(),src:'auto'};
          localStorage.setItem('argentina_ipc',JSON.stringify(d));
          return d;
        }
      }
    }catch(e){}
  }
  try{
    const r=await fetch('https://api.argentinadatos.com/v1/finanzas/indices/inflacion',{signal:AbortSignal.timeout(6000)});
    if(r.ok){
      const list=await r.json();
      if(Array.isArray(list)&&list.length){
        const latest=list[list.length-1];
        if(latest&&typeof latest.valor==='number'){
          const d={rate:latest.valor,date:latest.fecha||today(),t:Date.now(),src:'auto'};
          localStorage.setItem('argentina_ipc',JSON.stringify(d));
          return d;
        }
      }
    }
  }catch(e){}
  return cur;
}
function saveInflationRate(rate){
  const num=Number(rate);
  if(isNaN(num)||num<0)return false;
  const cur=getIpcData();
  const d={rate:num,date:cur.date||today(),t:Date.now(),src:'manual'};
  localStorage.setItem('argentina_ipc',JSON.stringify(d));
  return true;
}
function calcAdjustedPrice(oldPrice,oldDateStr,newDateStr=today()){
  const p=Number(oldPrice)||0;
  if(p<=0||!oldDateStr)return {adjusted:p,diffDays:0,applied:false,rate:getArgentinaInflationRate(),factor:1.0};
  const d1=new Date(oldDateStr.split('T')[0]+'T00:00');
  const d2=new Date(newDateStr.split('T')[0]+'T00:00');
  const diffDays=Math.max(0,Math.round((d2-d1)/86400000));
  if(diffDays<=7){
    return {adjusted:p,diffDays,applied:false,rate:getArgentinaInflationRate(),factor:1.0};
  }
  const monthlyRate=(getArgentinaInflationRate()||2.1)/100;
  const factor=Math.pow(1+monthlyRate,diffDays/30);
  const adjusted=Math.round(p*factor);
  return {adjusted,diffDays,applied:true,rate:getArgentinaInflationRate(),factor};
}

  return `Última actualización: ${fecha} · Origen: ${tipo} (${d.rate}% mensual).`;
}

function getTagsForSubcategory(cat,sub){

function resolveItemHierarchy(p){
  const rawName=p?.product||p?.product_name||p?.name||'';
  const meta=parseDescriptionKeyMeta(p?.description_key);
  const rubro=normalizeStoreCategory(p?.store_category||meta.storeCategory)||inferStoreCategory(p?.store,[p]);
  let sub=nk(p?.subcategory||'');
  if(!sub||sub==='otros')sub=inferSubcategoryFromName(rawName,p?.category)||sub;
  let cat=nk(p?.category||'');
  const mappedCat=findCategoryForSubcategory(sub);
  if(mappedCat&&(!cat||cat==='otros'||!PRODUCT_TAXONOMY[cat]?.includes(sub)))cat=mappedCat;
  if(!cat||!CAT[cat])cat='otros';
  const subTags=getTagsForSubcategory(cat,sub);
  return {rubro,category:cat,subcategory:sub,subTags};

function toDbSizePayload(sizeValue,sizeUnit){

  if(su==='kg')return {size_value:Math.round((sv*1000+Number.EPSILON)*100)/100,size_unit:'g'};

function normalizeStoreCategory(v){
  const s=String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  if(!s)return '';
  if(STORE_CAT_MAP[s])return s;
  if(/super|hiper|carrefour|coto|jumbo|disco|dia|vea|changomas|walmart|makro|vital|diarco/.test(s))return 'supermercado';
  if(/farmac|farmacity|openfarma|dr ahorro|perfumer|droguer/.test(s))return 'farmacia';
  if(/verdul|frut|huerta|organi/.test(s))return 'verduleria';
  if(/restaur|resto|bar\b|cafe|cafet|pizz|parrill|rotis|helader|bodegon|comedor|hamburg|empanad/.test(s))return 'restaurant';
  if(/almacen|despensa|kiosc|minisuper|autoservicio|chino/.test(s))return 'almacen';
  return '';
}
function inferStoreCategory(storeName,items){
  const byName=normalizeStoreCategory(storeName);
  if(byName)return byName;
  const arr=Array.isArray(items)?items:[];
  if(arr.length){
    const valid=arr.filter(i=>i&&i.category!=='descuentos');
    const farmCount=valid.filter(i=>i.category==='farmacia'||/ibuprof|paracet|amox|omepraz|diclofen|jarabe|comprim|medicam|receta/i.test(i.name||'')).length;
    if(farmCount>0&&farmCount>=valid.length/2)return 'farmacia';
    const verdCount=valid.filter(i=>i.category==='verduras'||i.category==='frutas').length;
    if(valid.length&&verdCount/valid.length>=0.65)return 'verduleria';
  }
  return 'supermercado';
}

    const cnt=parseInt(mPack[1],10)||1;
    const perUnit=parseFloat(mPack[2].replace(',','.'))||0;
    const unit=normalizeSizeUnit(mPack[3]);
    return {size_value:r2(cnt*perUnit),size_unit:unit,pack_count:cnt};
  }
  const m=s.match(/(\d+(?:[.,]\d+)?)\s*(kg|kgs|kilos?|g|gr|grs|gramos?|l|lt|lts|litros?|ml|cc|cm3|u|unid|unidades)\b/i);
  if(m){
    const val=parseFloat(m[1].replace(',','.'))||null;
    const unit=normalizeSizeUnit(m[2]);

}

function explainAuth(e){
  const m=String(e?.message||e?.msg||e||""),c=String(e?.code||e?.error_code||"");
  if(/over_email_send_rate_limit|rate limit|security purposes.*seconds/i.test(m+c)){
    const s=m.match(/(\d+)\s*seconds/i)?.[1]||"60";
    return `Límite de correos de Supabase alcanzado. Por seguridad, esperá ${s} segundos antes de volver a intentar.`;
  }
  if(/User already registered|already registered/i.test(m))return "Ya existe una cuenta con este email. Tocá \"Entrar\" para iniciar sesión.";
  if(/Email not confirmed|email_not_confirmed|not confirmed/i.test(m+c))return "Falta confirmar tu email. Si ya abriste el enlace de tu correo, tu cuenta ya está activa: intentá ingresar ahora. Si no te llegó, revisá la carpeta Spam.";
  if(/Invalid login credentials|invalid_credentials/i.test(m+c))return "Email o contraseña incorrectos. Revisá los datos e intentá de nuevo.";
  if(/Password should be at least 6/i.test(m))return "La contraseña debe tener al menos 6 caracteres.";
  if(/NetworkError|Failed to fetch/i.test(m))return "Problema de conexión. Revisá tu internet y volvé a intentar.";
  return m;
}

function rmPage(i){pages.splice(i,1);scanUI()}
async function addFiles(e){
  const cam=e.target.id==='f',files=[...e.target.files];e.target.value='';
  if(!files.length)return;
  const room=MAXP-pages.length,use=files.slice(0,room);
  if(files.length>room)toast(`Máximo ${MAXP} fotos: se usan las primeras ${room}.`);
  let i=0;
  for(const f of use){
    i++;const st=$('#st');if(st)st.textContent=`Procesando ${i} de ${use.length}…`;
    try{
      if(f.type==='application/pdf'){
        if(f.size>10*1024*1024)throw Error('El PDF pesa más de 10 MB.');
        pages.push({b64:await readB64(f),mime:'application/pdf',tips:[]});
      }else if(/^image\//.test(f.type)){
        const r=await resize(f);pages.push({b64:r.b64,mime:'image/jpeg',tips:localTips(r.q)});
      }else throw Error('Elegí fotos o un PDF.');
    }catch(err){toast(err.message)}
  }
  scanUI();
  if(cam&&use.length===1&&pages.length&&pages[pages.length-1].mime!=='application/pdf')editPage(pages.length-1,true);
}
function readPages(){
  if(!pages.length)return;
  if(pages.reduce((t,x)=>t+x.b64.length,0)>18e6)return toast('Los archivos pesan demasiado juntos: sacá menos fotos o usá un PDF más liviano.');
  run(pages);
}

function quality(i){
  const k=Math.min(1,1000/Math.max(i.width,i.height)),w=Math.round(i.width*k),h=Math.round(i.height*k),c=document.createElement('canvas');
  c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(i,0,0,w,h);

function localTips(q){

async function run(parts){
  pendParts=parts;
  app(`<h1>Nuevo comprobante</h1><div class="card" style="text-align:center"><div class="spin"></div><p>Leyendo ${parts.length>1?parts.length+' fotos':'el comprobante'}…</p><p class="mu">Puede tardar unos segundos.</p></div>`);
  try{
    const d=await extract(parts),n=(d.items||[]).length;
    // Si absolutamente no se encontró nada (sin productos, sin nombre de local y sin total), se ofrece reintentar
    if(!n && !d.store && !d.total){
      pendData=d;const tips=((d.quality&&d.quality.issues)||[]).filter(Boolean);
      return retake(tips.length?tips:['No pude identificar productos ni datos en el archivo.'],'');
    }
    // Si hay baja visibilidad o confianza no alta, se continúa igual marcando los campos en rojo
    draft=norm(d);pages=[];renderReceiptForm();
    if(draft.address){
      geocodeAddr(draft.address, true).then(cList=>{
        if(Array.isArray(cList)&&cList.length){
          if(cList.length>1&&(!draft.candidateAddresses||!draft.candidateAddresses.length)){
            draft.candidateAddresses=cList;
            renderReceiptForm();
          }
          if(draft&&draft.lat==null){
            draft.lat=cList[0].lat;draft.lng=cList[0].lng;
            if(mapShown&&lfMap){lfMap.setView([cList[0].lat,cList[0].lng],17);revGeoOSM(cList[0])}
          }
        }
      });
    }

function readFailModal(e){

  else if(st===401||st===403||(st===400&&/API key/i.test(m))||/ACCOUNT_STATE_INVALID|service account|UNAUTHENTICATED/i.test(m)){msg='La clave de Gemini está deshabilitada o no es válida. Cargá una clave activa en Ajustes para leer tickets con IA.';key=true}
  else if(st===402||st===429||/quota|resource_exhausted|prepayment|credits|billing|alcanzo el maximo|limite/i.test(m)){
    isQuota=true;

  modal(`<div class="ic bad">⚠️</div><h2>${esc(t)}</h2><p>${esc(msg)}</p><p class="mu">${isQuota?'Tus fotos se conservan por si querés consultarlas mientras cargás.':'Tus fotos siguen acá: no hace falta volver a sacarlas.'}</p><div class="mact">${actHtml}</div>`);
}
const resize=f=>new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);const clean=()=>{try{URL.revokeObjectURL(u)}catch(e){}};i.onerror=()=>{clean();no(Error('No se pudo abrir la imagen'))};i.onload=()=>{clean();try{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);let q={blur:100,bright:150,min:Math.min(i.width,i.height)};try{q=quality(i)}catch(qe){}ok({b64:c.toDataURL('image/jpeg',.8).split(',')[1],q})}catch(err){no(Error('Error al procesar la imagen'))}};i.src=u});

  const prompt=`${parts.length>1?`Recibís ${parts.length} archivos: son partes del MISMO comprobante, en orden. Unilos en un solo comprobante: no repitas renglones que aparezcan en dos fotos por superposición, y tomá los datos de cabecera (local, fecha, CUIT) y los totales de donde figuren. `:''}Extraé los datos de este comprobante de compra argentino (supermercado, almacén, verdulería, restaurant, farmacia o factura A, B o C, en foto o PDF). Respondé solo JSON: {"doc_type":"ticket|factura","currency":"ARS|USD|BRL","doc_number":string,"store_tax_id":string,"store":string,"store_category":"supermercado|almacen|verduleria|restaurant|farmacia","store_address":string,"candidate_addresses":[string],"total":number,"description":string,"quality":{"legible":boolean,"issues":[string]},"uncertain_fields":[string],"unidentified_amounts":[{"amount":number,"raw_text":string}],"date":"YYYY-MM-DD","items":[{"name":string,"brand":string,"variant":string,"qty":number,"size_value":number,"size_unit":"g|kg|ml|l|u","package_type":"botella|lata|tetra|sachet|paquete|pouch|frasco|caja|suelto","pack_count":number,"total_price":number,"category":"lacteos|carnes|panaderia|verduras|frutas|bebidas|limpieza|almacen|farmacia|descuentos|otros","subcategory":string,"confidence":"alta|baja"}]}. store_category es obligatorio: elegí exactamente uno de supermercado, almacen, verduleria, restaurant o farmacia según el rubro del local. En items, además del nombre legible en name, separá marca en brand (ej: "La Serenísima"), modelo o variante en variant (ej: "Clásica Entera" o "Sin Azúcar"), peso/volumen neto por ítem vendido en size_value + size_unit ("g", "kg", "ml", "l" o "u"), envase en package_type si se deduce (botella, lata, tetra, sachet, paquete, pouch, frasco, caja, suelto), y unidades internas en pack_count (1 si es unidad individual, o 3, 6, etc. si es multipack). total es el importe total general final del ticket. En items, extraé los productos con su precio de lista oficial. En comprobantes de farmacia o supermercado, identificá con precisión los descuentos de Obra Social, Coseguro y prepagas (ej: 'O. SOCIAL', 'OBRA SOCIAL', 'COSEG.', 'COSEGURO', 'DESC. RECETA', 'OSDE', 'SWISS MEDICAL', 'PAMI', 'IOMA', 'GALENO', '2DA UNIDAD 70%', 'DESC. COMUNIDAD', 'BONIF.'): extraelos en items con category 'descuentos' y total_price negativo (ej: -1450), para que el precio de lista original no se altere y el descuento quede registrado por separado. Si en la foto detectás números o importes aislados cuyo concepto no puedas identificar con certeza, agregalos en unidentified_amounts. subcategory es una subcategoría corta del producto, en singular, minúsculas y sin tildes (por ejemplo: citrico, vino tinto, leche, queso, gaseosa, papa, detergente). Los precios son números en pesos (punto decimal, sin símbolo). total_price es el total de la línea. En productos pesables o vendidos al peso (frutas, verduras, carnes, fiambres, etc.), en qty poné el peso en kilogramos con decimales (por ejemplo 1.845 para 1,845 kg) y en total_price el importe total de ese renglón, para que el precio unitario sea exactamente el precio por kilo. En description poné, como texto libre, los comentarios, notas, leyendas o anotaciones manuscritas que aparezcan en el ticket; si no hay, dejalo vacío. En quality.legible poné false si el ticket está borroso, cortado, con reflejos, muy oscuro o ilegible; en issues describí en español qué problema tiene la foto. IMPORTANTE: Si partes del comprobante no están muy visibles o la confianza de detección no es alta, CONTINUÁ IGUAL extrayendo todo lo que alcances a leer; NO te detengas. Listá los campos con dudas o baja visibilidad en uncertain_fields (ej: 'store', 'date', 'address', 'total'). Para cada producto en items, si el nombre o el precio no se distinguen bien asigná confidence: 'baja'; si se leen bien, 'alta'. En store_address poné la dirección del local principal tal como figura impresa en el ticket (calle, número y localidad); si en el ticket figuran varias sucursales o direcciones, incluilas en candidate_addresses. doc_type es factura si el comprobante dice FACTURA (o tiene CAE y letra A, B o C); si no, ticket. doc_number es el número del comprobante. store_tax_id es el CUIT del emisor, solo números y guiones. En una factura con IVA discriminado, el total_price de cada renglón debe incluir el IVA. currency es la moneda del comprobante: ARS (pesos, símbolo $), USD (dólares, U$S o USD) o BRL (reales, R$); si no se indica, ARS.`;
  const models=[{m:'gemini-4-hydrogen',th:{thinkingLevel:'LOW'}},{m:'gemini-2.5-flash',th:{thinkingBudget:0}},{m:'gemini-2.5-flash',th:null}];
  let lastErr=null;
  for(const model of models){
    try{
      const body={contents:[{parts:[{text:prompt},...parts.map(x=>({inline_data:{mime_type:x.mime||'image/jpeg',data:x.b64}}))]}],generationConfig:{responseMimeType:'application/json',temperature:.1,...(model.th?{thinkingConfig:model.th}:{})}};
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model.m}:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(25000),body:JSON.stringify(body)});
      const j=await r.json();
      if(!r.ok){const e=Error(j.error?.message||'Error al leer el comprobante');e.status=r.status;lastErr=e;if(r.status===429||r.status>=500||r.status===404)continue;throw e}
      const c0=j.candidates&&j.candidates[0];
      const part=c0?.content?.parts?.find(p=>p.text&&!p.thought)||c0?.content?.parts?.[c0.content.parts.length-1];
      const tx=part&&part.text;
      if(!tx)throw Error('Respuesta vacía de Gemini');
      const clean=tx.replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/\s*```$/i,'').trim();
      return JSON.parse(clean);
    }catch(err){lastErr=err;if(err.name==='AbortError'||/timeout/i.test(err.message))continue;if(!navigator.onLine)throw err}
  }
  throw lastErr||Error('No se pudo leer el comprobante con Gemini.');
}

function deriveSuggestedTags(name, cat, sub, brand){
  const tags=new Set();
  const raw=`${name||''} ${sub||''} ${brand||''}`.toLowerCase();
  const cleaned=nk(raw);
  const words=cleaned.split(/\s+/).filter(w=>w.length>=3&&!EXPAND_BLACKLIST.has(w));
  words.slice(0,4).forEach(w=>tags.add(w));
  if(cat&&cat!=='otros'&&cat!=='descuentos')tags.add(cat);
  if(sub&&sub.length>=3)tags.add(sub);
  if(brand&&brand.length>=3)tags.add(brand.toLowerCase());
  if(cleaned.includes('supr')||cleaned.includes('pechuga')||cleaned.includes('pollo')){tags.add('pollo');tags.add('suprema');}
  if(cleaned.includes('coca')){tags.add('gaseosa');tags.add('cola');}
  if(cleaned.includes('rumba')){tags.add('galletitas');tags.add('chocolate');}
  if(cleaned.includes('leche')){tags.add('lacteos');}
  if(cleaned.includes('ibuprof')||cleaned.includes('paracet')||cleaned.includes('amoxid')){tags.add('farmacia');tags.add('medicamento');}
  return Array.from(tags).slice(0,5);
}
window.deriveSuggestedTags=deriveSuggestedTags;

const norm=d=>{
  const uFields=new Set(Array.isArray(d.uncertain_fields)?d.uncertain_fields:[]);
  const st=String(d.store||'').trim();
  if(!st) uFields.add('store');
  if(!d.date||!/^\d{4}-\d{2}-\d{2}$/.test(d.date)) uFields.add('date');
  if(d.quality&&d.quality.legible===false){
    const iss=((d.quality.issues||[]).join(' ')).toLowerCase();
    if(/local|super|comercio/i.test(iss)) uFields.add('store');
    if(/fecha/i.test(iss)) uFields.add('date');
    if(/total|precio/i.test(iss)) uFields.add('total');
  }
  const items=(d.items||[]).map(i=>{
    const name=String(i.name||'').trim();
    const isDisc=isDiscountOrObraSocialItem({name,category:i.category,total_price:i.total_price});
    const isUncertain=i.confidence==='baja'||!name||Number(i.total_price)===0;
    const cat=isDisc?'descuentos':(CAT[i.category]?i.category:(/ibuprof|paracet|amoxid|medicam/i.test(name)?'farmacia':'otros'));
    const rawSub=nk(i.subcategory||'');
    const sub=rawSub||inferSubcategoryFromName(name,cat);
    const parsed=parseStructuredProductText(name,{
      name,
      brand:i.brand,
      variant:i.variant,
      size_value:i.size_value,
      size_unit:i.size_unit,
      package_type:i.package_type,
      pack_count:i.pack_count
    });
    const subTags=sub?getTagsForSubcategory(cat,sub):[];
    return {
      name:parsed.name,
      base_name:parsed.base_name,
      brand:parsed.brand,
      variant:parsed.variant,
      qty:Number(i.qty)||1,
      size_value:parsed.size_value,
      size_unit:parsed.size_unit,
      package_type:parsed.package_type,
      pack_count:parsed.pack_count,
      total_price:Number(i.total_price)||0,
      category:cat,
      subcategory:sub,
      tags:Array.isArray(i.tags)&&i.tags.length?i.tags:(subTags.length?subTags.slice(0,5):deriveSuggestedTags(name,cat,sub,parsed.brand)),
      uncertain:isUncertain,
      _expanded:isUncertain
    };
  });
  const unidentAmounts=Array.isArray(d.unidentified_amounts)?d.unidentified_amounts.map(u=>({
    amount:Math.abs(Number(u.amount)||0),
    raw_text:String(u.raw_text||'').trim()
  })).filter(u=>u.amount>0):[];
  const rawStoreCat=normalizeStoreCategory(d.store_category);
  const storeCategory=rawStoreCat||inferStoreCategory(st,items);

  return {
    currency:CUR[d.currency]?d.currency:'ARS',
    docType:d.doc_type==='factura'?'factura':'ticket',
    docNumber:String(d.doc_number||'').trim(),
    taxId:String(d.store_tax_id||'').trim(),
    lat:null,
    lng:null,
    address:String(d.store_address||'').trim(),
    candidateAddresses:Array.isArray(d.candidate_addresses)&&d.candidate_addresses.length>1?d.candidate_addresses.map(a=>({name:String(a).trim()})):[],
    scannedTotal:d.total!=null&&!isNaN(+d.total)&&+d.total>0?+d.total:null,
    description:String(d.description||'').trim(),
    store:st,
    storeCategory,
    _storeCatManual:!!rawStoreCat,
    date:/^\d{4}-\d{2}-\d{2}$/.test(d.date)?d.date:today(),
    uncertainFields:Array.from(uFields),
    unidentified_amounts:unidentAmounts,
    hasLowConfidence:(d.quality&&d.quality.legible===false)||uFields.size>0||items.some(x=>x.uncertain),
    items
  };
};

let sepaSuggTimer=null;
const sepaCache=new Map();

async function searchSepaCatalog(q){
  if(!q||q.trim().length<2)return [];
  const cleanQ=q.replace(/[^\w\s]/gi,' ').trim();
  const cacheKey=cleanQ.toLowerCase();
  if(sepaCache.has(cacheKey))return sepaCache.get(cacheKey);

  const words=cleanQ.split(/\s+/).filter(w=>w.length>=2&&!/^\d+$/.test(w));
  if(!words.length)return [];

  let results=[];
  try{
    const pWord=words[0];
    const {data:direct}=await sb.from('ean_catalog')
      .select('brand,product,variant,size_value,size_unit')
      .or(`product.ilike.*${pWord}*,brand.ilike.*${pWord}*`)
      .limit(15);
    if(Array.isArray(direct)&&direct.length){
      results=direct;
    }
    if(results.length<5&&words.length>=2){
      const [w0,w1]=words;
      const {data:more}=await sb.from('ean_catalog')
        .select('brand,product,variant,size_value,size_unit')
        .or(`and(brand.ilike.*${w0}*,product.ilike.*${w1}*),and(brand.ilike.*${w1}*,product.ilike.*${w0}*),product.ilike.*${w0}*${w1}*`)
        .limit(15);
      if(Array.isArray(more)){
        const seen=new Set(results.map(x=>`${x.brand}|${x.product}|${x.variant}|${x.size_value}${x.size_unit}`));
        more.forEach(x=>{
          const key=`${x.brand}|${x.product}|${x.variant}|${x.size_value}${x.size_unit}`;
          if(!seen.has(key)){seen.add(key);results.push(x)}
        });
      }
    }
  }catch(e){}

  results.sort((a,b)=>{
    const nameA=`${a.brand||''} ${a.product||''} ${a.variant||''}`.toLowerCase();
    const nameB=`${b.brand||''} ${b.product||''} ${b.variant||''}`.toLowerCase();
    const hasA=words.every(w=>nameA.includes(w.toLowerCase()));
    const hasB=words.every(w=>nameB.includes(w.toLowerCase()));
    if(hasA&&!hasB)return -1;
    if(!hasA&&hasB)return 1;
    return 0;
  });

  const sliced=results.slice(0,5);
  sepaCache.set(cacheKey,sliced);
  return sliced;
}
window.searchSepaCatalog=searchSepaCatalog;

  bco:'blanco',bca:'blanca',ng:'negro',nva:'nueva',peq:'pequeno',gde:'grande'
};
const VALID_UNIT_ABBREVS=new Set(['g','gr','grs','kg','kgs','ml','cc','cm3','l','lt','lts','u','un','oz','mg','mcg','x1','x2','x3','x4','x6','x12','x24']);

function findPartialWordsInProductName(name){
  const raw=String(name||'').trim();
  if(!raw)return [];
  const hits=[];
  const seen=new Set();
  const pushHit=(token,suggestion)=>{
    const key=String(token).toLowerCase();
    if(!key||seen.has(key))return;
    seen.add(key);
    hits.push({token,suggestion:suggestion||''});
  };
  const spaceTokens=raw.split(/\s+/).filter(Boolean);
  for(const rawTok of spaceTokens){
    const tokLower=rawTok.toLowerCase();
    // Ignore pure numbers/decimals or numeric weights like 1.5l, 500g, 1.5kg
    if(/^\d+(?:[.,]\d+)?(?:kg|kgs|g|gr|grs|ml|cc|cm3|l|lt|lts|u|un|mg|oz)?$/i.test(tokLower))continue;
    // Detect slash contractions like c/azuc, s/sal, p/horno
    if(/^[csp]\/[a-záéíóúñ]*/i.test(tokLower)){
      const parts=tokLower.split('/');
      const pref=parts[0]==='c'?'con':parts[0]==='s'?'sin':'para';
      const rest=parts[1]||'';
      const restExp=SUPERMARKET_ABBREV_EXPANSIONS[rest.replace(/\./g,'')]||rest;
      pushHit(rawTok,`${pref}${restExp?' '+restExp:''}`.trim());
      continue;
    }
    // Detect dot-joined or dot-ended abbreviations like GALL.CHOC.RUM or LECH.ENT.
    if(/[a-záéíóúñ]\./i.test(rawTok)){
      const cleanDot=tokLower.replace(/\.+$/,'');
      if(VALID_UNIT_ABBREVS.has(cleanDot))continue;
      const dotParts=rawTok.split('.').filter(Boolean);
      for(const dp of dotParts){
        const dpClean=nk(dp);
        if(!dpClean||/^\d+$/.test(dpClean)||VALID_UNIT_ABBREVS.has(dpClean))continue;
        pushHit(dp+'.',SUPERMARKET_ABBREV_EXPANSIONS[dpClean]||'');
      }
      continue;
    }
    const cleanWord=nk(rawTok);
    if(!cleanWord||/^\d+$/.test(cleanWord)||VALID_UNIT_ABBREVS.has(cleanWord))continue;
    if(SUPERMARKET_ABBREV_EXPANSIONS[cleanWord]){
      pushHit(rawTok,SUPERMARKET_ABBREV_EXPANSIONS[cleanWord]);
    }
  }
  return hits;
}

function buildExpandedSuggestionFromPartial(name){
  const raw=String(name||'').trim();
  if(!raw)return '';
  const tokens=raw.split(/\s+/).filter(Boolean);
  const out=[];
  let changed=false;
  for(const tok of tokens){
    const lower=tok.toLowerCase();
    if(/^\d+(?:[.,]\d+)?(?:kg|kgs|g|gr|grs|ml|cc|cm3|l|lt|lts|u|un|mg|oz)?$/i.test(lower)){
      out.push(tok);
      continue;
    }
    if(/^[csp]\/[a-záéíóúñ]*/i.test(lower)){
      const parts=lower.split('/');
      const pref=parts[0]==='c'?'con':parts[0]==='s'?'sin':'para';
      const rest=parts[1]?parts[1].replace(/\./g,''):'';
      const exp=SUPERMARKET_ABBREV_EXPANSIONS[nk(rest)]||rest;
      out.push(pref+(exp?' '+exp:''));
      changed=true;
      continue;
    }
    if(/[a-záéíóúñ]\./i.test(tok)){
      const cleanDot=lower.replace(/\.+$/,'');
      if(VALID_UNIT_ABBREVS.has(cleanDot)){
        out.push(cleanDot);
        continue;
      }
      const parts=tok.split('.').filter(Boolean);
      for(const p of parts){
        const pNorm=nk(p);
        if(SUPERMARKET_ABBREV_EXPANSIONS[pNorm]){
          out.push(SUPERMARKET_ABBREV_EXPANSIONS[pNorm]);
          changed=true;
        }else if(/^\d+$/.test(pNorm)){
          out.push(p);
        }else{
          out.push(p);
          changed=true;
        }
      }
      continue;
    }
    const wNorm=nk(tok);
    if(SUPERMARKET_ABBREV_EXPANSIONS[wNorm]){
      out.push(SUPERMARKET_ABBREV_EXPANSIONS[wNorm]);
      changed=true;
    }else{
      out.push(tok);
    }
  }
  const res=out.join(' ').replace(/\s+/g,' ').trim();
  return changed&&res.toLowerCase()!==raw.toLowerCase()?res.replace(/\b\w/g,c=>c.toUpperCase()):'';
}

function applyPartialWordSuggestion(k){
  if(!draft||!draft.items||!draft.items[k])return;

  }
  draft.items[k].name=sugg;
  const parsed=parseStructuredProductText(sugg,{

    size_unit:draft.items[k].size_unit,
    package_type:draft.items[k].package_type,
    pack_count:draft.items[k].pack_count
  });

  draft.items[k].tags=deriveSuggestedTags(sugg,draft.items[k].category,draft.items[k].subcategory,draft.items[k].brand);
  renderReceiptForm();
  toast(`✓ Palabras completadas: ${sugg}`);

function getPartialWordWarningHtml(k, item){
  if(!item||isDiscountOrObraSocialItem(item))return '';

  if(!hits.length)return '';
  const expSugg=buildExpandedSuggestionFromPartial(item.name);
  const tokensTxt=hits.map(h=>h.suggestion?`"${h.token}" → ${h.suggestion}`:`"${h.token}"`).join(' · ');
  return `<div style="background:#fff7ed;border:1.5px solid #fb923c;border-radius:10px;padding:7px 10px;margin:4px 0;font-size:.75rem;color:#9a3412">

    ${expSugg?`<div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="chip" onclick="applyPartialWordSuggestion(${k})" style="font-size:.73rem;padding:4px 10px;background:#fff;border-color:#fb923c;color:#9a3412">✨ Completar a "${esc(expSugg)}"</button></div>`:''}

}

function onItemNameInput(k,val,inputEl){
  if(!draft||!draft.items||!draft.items[k])return;
  draft.items[k].name=val;
  if(val.trim()&&draft.items[k].total_price>0){
    draft.items[k].uncertain=false;
  }
  const hasPartials=!isDiscountOrObraSocialItem(draft.items[k])?findPartialWordsInProductName(val).length>0:false;
  if(inputEl){
    inputEl.style.border=hasPartials?'2px solid #f97316':'';
    inputEl.style.background=hasPartials?'#fff7ed':'';
  }
  const pwBox=document.getElementById(`item-partial-warn-${k}`);
  if(pwBox)pwBox.innerHTML=getPartialWordWarningHtml(k,draft.items[k]);
  updateItemSummaryEl(k);

  const suggBox=document.getElementById(`sepa-sugg-${k}`);
  if(!suggBox)return;

  if(!val||val.trim().length<2){
    suggBox.innerHTML='';
    suggBox.style.display='none';
    return;
  }

  clearTimeout(sepaSuggTimer);
  sepaSuggTimer=setTimeout(async()=>{
    const list=await searchSepaCatalog(val);
    renderSepaNameDropdown(k,list);
  },250);
}

function applySepaSuggestion(k,idx){
  if(!draft||!draft.items||!draft.items[k])return;
  const suggBox=document.getElementById(`sepa-sugg-${k}`);
  const list=(suggBox&&suggBox._matches)||[];
  const m=list[idx];
  if(!m)return;

  const unit=normalizeSizeUnit(m.size_unit);
  const szStr=m.size_value?` ${m.size_value}${unit||m.size_unit||''}`:'';
  const fullName=`${m.brand?m.brand+' ':''}${m.product||''}${m.variant?' '+m.variant:''}${szStr}`.trim();

  draft.items[k].name=fullName;
  draft.items[k].base_name=String(m.product||'').trim();
  draft.items[k].brand=String(m.brand||'').trim();
  draft.items[k].variant=String(m.variant||'').trim();
  draft.items[k].size_value=m.size_value!=null&&m.size_value!==''?Number(m.size_value):null;
  draft.items[k].size_unit=unit;
  if(!draft.items[k].package_type){
    draft.items[k].package_type=inferPackageType(`${m.product||''} ${m.variant||''}`,unit);
  }
  draft.items[k].ean=null;
  draft.items[k].uncertain=false;
  draft.items[k].tags=deriveSuggestedTags(fullName,draft.items[k].category,draft.items[k].subcategory,draft.items[k].brand);

  if(suggBox){
    suggBox.innerHTML='';
    suggBox.style.display='none';
  }
  renderReceiptForm();
  toast(`✓ Nombre sugerido aplicado: ${fullName}`);
}

function getItemSummaryHtml(i){
  const dispCurCode=(draft&&draft.currency)||'ARS';
  const specParts=[];
  if(i.brand)specParts.push(i.brand);
  if(i.variant)specParts.push(i.variant);
  if(i.size_value&&i.size_unit)specParts.push(`${i.size_value} ${i.size_unit==='l'?'L':i.size_unit}`);
  if(i.package_type&&PACKAGE_LABELS[i.package_type])specParts.push(PACKAGE_LABELS[i.package_type]);
  if(Number(i.pack_count)>1)specParts.push(`Pack x${Number(i.pack_count)}`);
  const comp=computeComparableUnitPrice({
    total_price:i.total_price,
    qty:i.qty,
    size_value:i.size_value,
    size_unit:i.size_unit,
    pack_count:i.pack_count,
    category:i.category,
    product_name:i.name
  });
  const priceParts=[];
  if(comp){
    if(comp.perKgOrL)priceParts.push(`${money(comp.perKgOrL,dispCurCode)} / ${comp.unitLabel}`);
    if(comp.perPackUnit)priceParts.push(`${money(comp.perPackUnit,dispCurCode)} c/u`);
  }
  const specText=specParts.length?esc(specParts.join(' · ')):'Sin marca ni peso detallado';
  const eqText=priceParts.length?` · <b class="num" style="color:var(--gd)">${esc(priceParts.join(' · '))}</b>`:'';
  return `${specText}${eqText}`;
}

function checkEquiv(keyA,keyB){
  const k=[nk(keyA),nk(keyB)].sort().join(':::');
  const cache=getEquivsCache();
  if(cache[k]===1)return 'same';
  if(cache[k]===-1)return 'different';

function normSizeStr(s){
  return String(s||'').replace(/\s+/g,'').replace(/litros?|lts?/ig,'l').replace(/gramos?|grs?/ig,'g').replace(/kilos?|kgs?/ig,'kg').replace(/cc|cm3|mililitros?/ig,'ml');
}
const PRODUCT_EXCLUSIVE_VARIANTS=[
  ['entera','descremada','deslactosada','sin lactosa'],
  ['salvado','integral','lacteado','mesa','blanco','negro','frances','arabe','hamburguesa','pancho','baguette','centeno'],
  ['clasica','regular','light','cero','zero','diet'],
  ['fino','grueso','entrefina'],
  ['con gas','sin gas'],
  ['girasol','oliva','maiz','mezcla'],
  ['con palo','sin palo','despalada','compuesta','saborizada']
];

function isSameExactProduct(a,b){
  if(!a||!b)return false;
  const sA=nk(typeof a==='object'?(a.product||a.product_name||''):a);
  const sB=nk(typeof b==='object'?(b.product||b.product_name||''):b);
  if(!sA||!sB)return false;
  if(sA===sB)return true;
  const eq=checkEquiv(sA,sB);
  if(eq==='different')return false;
  if(eq==='same')return true;
  const multA=extractPackMultiplier(sA), multB=extractPackMultiplier(sB);
  if(multA!==multB)return false;
  const normWeightS=s=>String(s||'').replace(/\b(?:x|por)\s*(kg|kilos?|kgs?)\b/gi,'1kg').replace(/\b(?:x|por)\s*(litros?|lts?|l)\b/gi,'1l').replace(/\b(?:x|por)\s*(unidad|unidades|u|unid)\b/gi,'1u');
  const nwA=normWeightS(sA), nwB=normWeightS(sB);
  const sizeRe=/(\d+(?:[.,]\d+)?)\s*(kg|g|gr|l|lt|litro|litros|ml|cc|cm3|u|unid|unidades)\b/ig;
  const sizesA=(nwA.match(sizeRe)||[]).map(normSizeStr);
  const sizesB=(nwB.match(sizeRe)||[]).map(normSizeStr);
  if(sizesA.length&&sizesB.length&&sizesA[0]!==sizesB[0])return false;
  if(sizesA.length!==sizesB.length)return false;
  for(const grp of PRODUCT_EXCLUSIVE_VARIANTS){
    const hasA=grp.filter(v=>sA.includes(v));
    const hasB=grp.filter(v=>sB.includes(v));
    if(hasA.length&&hasB.length&&hasA[0]!==hasB[0])return false;
  }
  const ignoreWords=new Set(['con','sin','del','las','los','por','para','sabor','de','en','x']);
  const stemWord=w=>w.endsWith('s')&&!w.endsWith('is')&&!w.endsWith('os')?w.slice(0,-1):w;
  const wordsA=nwA.split(' ').filter(w=>w.length>=2&&!ignoreWords.has(w)).map(stemWord);
  const wordsB=nwB.split(' ').filter(w=>w.length>=2&&!ignoreWords.has(w)).map(stemWord);
  if(wordsA.length!==wordsB.length)return false;
  return [...wordsA].sort().join(' ')===[...wordsB].sort().join(' ');
}

function extractPackMultiplier(str){
  const s=nk(typeof str==='object'?(str.product||str.product_name||str.name||''):str);
  if(!s)return 1;
  const mPack=s.match(/\b(?:pack\s*x?\s*|tri\s*pack|tripack|duo\s*pack|duopack|x\s*)(\d+)\b/);
  if(mPack&&parseInt(mPack[1],10)>1)return parseInt(mPack[1],10);
  if(/\b(?:tripack|tri\s*pack|pack\s*x?\s*3|triple)\b/.test(s))return 3;
  if(/\b(?:duopack|duo\s*pack|pack\s*x?\s*2|doble)\b/.test(s))return 2;
  const mUnid=s.match(/\b(\d+)\s*(?:unidades|paquetes|u|unid)\b/);
  if(mUnid&&parseInt(mUnid[1],10)>1)return parseInt(mUnid[1],10);
  return 1;
}
window.extractPackMultiplier=extractPackMultiplier;

function getProductMatchConfidence(a,b){
  const kA=nk(a),kB=nk(b);
  if(kA===kB)return {level:'alta',score:1.0,reason:'Nombre exacto'};
  const eq=checkEquiv(kA,kB);
  if(eq==='same')return {level:'alta',score:0.95,reason:'Confirmado por la comunidad'};
  if(eq==='different')return {level:'rechazado',score:0,reason:'Descartado por usuarios'};
  const multA=extractPackMultiplier(kA), multB=extractPackMultiplier(kB);
  if(multA!==multB){
    return {level:'rechazado',score:0,reason:`Diferente empaque: unidad vs multi-pack (${multA}u vs ${multB}u)`};
  }
  for(const grp of PRODUCT_EXCLUSIVE_VARIANTS){
    const hasA=grp.filter(v=>kA.includes(v));
    const hasB=grp.filter(v=>kB.includes(v));
    if(hasA.length&&hasB.length&&hasA[0]!==hasB[0]){
      return {level:'rechazado',score:0,reason:`Difieren en tipo: ${hasA[0]} vs ${hasB[0]}`};
    }
  }
  const sizeRe=/(\d+(?:[.,]\d+)?)\s*(kg|g|gr|l|lt|litro|litros|ml|cc|cm3)\b/ig;
  const sA=(kA.match(sizeRe)||[]).map(normSizeStr);
  const sB=(kB.match(sizeRe)||[]).map(normSizeStr);
  if(sA.length&&sB.length&&sA[0]!==sB[0]){
    return {level:'baja',score:0.1,reason:`Difieren en tamaño: ${sA[0]} vs ${sB[0]}`};
  }
  const ignoreWords=new Set(['con','sin','del','las','los','por','para','sabor','de','en','x','el','la','un','una']);
  const wA=kA.split(/\s+/).filter(w=>w.length>=2&&!ignoreWords.has(w));
  const wB=kB.split(/\s+/).filter(w=>w.length>=2&&!ignoreWords.has(w));
  const matchWord=(w,bw)=>w===bw||(bw.startsWith(w)&&bw.length-w.length<=2)||(w.startsWith(bw)&&w.length-bw.length<=2);
  const common=wA.filter(w=>wB.some(bw=>matchWord(w,bw)));
  const union=new Set([...wA,...wB]);
  const jaccard=union.size?common.length/union.size:0;
  const allMatched=wA.length>0&&wA.every(qw=>wB.some(bw=>matchWord(qw,bw)));
  const score=allMatched?Math.max(jaccard,0.5+(wA.length/(wB.length+2))):jaccard;
  if(score>=0.5)return {level:'alta',score,reason:allMatched?'Alta coincidencia de producto':'Alta coincidencia de palabras'};
  if(score>=0.2)return {level:'media',score,reason:'Coincidencia parcial (revisar)'};
  return {level:'baja',score,reason:'Pocas palabras en común'};
}

async function matchPreciosClaros(name){
  if(!name||name.trim().length<2)return null;
  const cleanQ=name.replace(/[^\w\s]/gi,' ').trim();
  const words=nk(name).split(/\s+/).filter(w=>w.length>=3&&!/^\d+$/.test(w));
  if(!words.length)return null;

  let data=[];
  let serverRefPrice=null;

  // 1. Try local server endpoint if on same origin or local dev
  if(!window.location.hostname.includes('github.io')){
    try{
      const r=await fetch(`/api/canasta/sepa-match?q=${encodeURIComponent(name)}`,{signal:AbortSignal.timeout(2500)});
      if(r.ok){
        const j=await r.json();
        if(Array.isArray(j.matches)&&j.matches.length){
          data=j.matches;
          if(j.refPriceData)serverRefPrice=j.refPriceData;
        }
      }
    }catch(e){}
  }

  // 2. Client-side query using Supabase client (works on GitHub Pages & local)
  if(!data.length){
    try{
      const pWord = words[0] || cleanQ;
      const { data: prefData } = await T(
        sb.from('ean_catalog')
          .select('ean,brand,product,variant,size_value,size_unit,confidence')
          .or(`product.ilike.${pWord}*,brand.ilike.${pWord}*`)
          .limit(35),
        2500
      );
      if(Array.isArray(prefData) && prefData.length){
        data = prefData;
      }

      if(data.length < 5){
        const orClauses=[];
        if(words.length>=2){
          const [w0,w1]=words;
          orClauses.push(`product.ilike.*${w0}*${w1}*`);
          orClauses.push(`product.ilike.*${w1}*${w0}*`);
          orClauses.push(`and(brand.ilike.*${w0}*,product.ilike.*${w1}*)`);
          orClauses.push(`and(brand.ilike.*${w1}*,product.ilike.*${w0}*)`);
          orClauses.push(`brand.ilike.*${cleanQ}*`);
        }
        words.slice(0,3).forEach(w=>{
          orClauses.push(`product.ilike.*${w}*`);
          orClauses.push(`brand.ilike.*${w}*`);
        });
        const res=await T(sb.from('ean_catalog').select('ean,brand,product,variant,size_value,size_unit,confidence').or(orClauses.join(',')).limit(40),3000);
        if(Array.isArray(res.data)&&res.data.length){
          const seen = new Set(data.map(x => x.ean));
          res.data.forEach(item => {
            if(!seen.has(item.ean)){
              seen.add(item.ean);
              data.push(item);
            }
          });
        }
      }
    }catch(e){}
  }

  if(!data.length)return null;

  let best=null,maxScore=0;
  const nNorm=nk(name);
  for(const item of data){
    const full=`${item.brand||''} ${item.product||''} ${item.variant||''} ${item.size_value||''}${item.size_unit||''}`;
    const conf=getProductMatchConfidence(name,full);
    let s=conf.score||0;
    const pNorm=nk(item.product||''), bNorm=nk(item.brand||'');
    if(pNorm.startsWith(nNorm)||bNorm.startsWith(nNorm)) s+=0.35;
    if(words.length>0&&pNorm.startsWith(words[0])) s+=0.25;
    if(words.includes('leche')&&!nNorm.includes('dulce')&&!nNorm.includes('chocolate')&&!nNorm.includes('alfajor')){
      if(pNorm.includes('dulce')||pNorm.includes('alfajor')||pNorm.includes('chocolate')||pNorm.includes('shampoo')||pNorm.includes('micelar')||pNorm.includes('acondicionador')||pNorm.includes('tonico')){
        s-=0.6;
      }
    }
    if(s>maxScore){
      maxScore=s;
      best={item,conf,score:s};
    }
  }

  if(!best||maxScore<0.2)return null;

  if(serverRefPrice){
    Object.assign(best,serverRefPrice);
  }

  // Retrieve community benchmark prices if not already provided
  if(!best.refPrice){
    try{
      let qb=sb.from('price_points').select('unit_price,store,purchased_at');
      if(best.item.ean){
        qb=qb.or(`ean.eq.${best.item.ean},product_key.ilike.*${cleanQ}*`);
      }else{
        qb=qb.or(`product_key.ilike.*${cleanQ}*,product_name.ilike.*${cleanQ}*`);
      }
      const {data:pj}=await T(qb.order('purchased_at',{ascending:false}).limit(25),3000);
      if(Array.isArray(pj)&&pj.length){
        const validP=pj.map(p=>+p.unit_price).filter(p=>p>0);
        if(validP.length){
          best.refPrice=Math.round(validP.reduce((a,b)=>a+b,0)/validP.length);
          best.minPrice=Math.min(...validP);
          best.maxPrice=Math.max(...validP);
          best.priceCount=validP.length;
          best.sampleStore=pj[0].store;
          best.sampleDate=pj[0].purchased_at;
        }
      }
    }catch(e){}
  }

  return best;
}

async function computeReceiptInsights(r){
  const box=$('#post-insights');if(!box)return;
  try{
    const items=(r.items||[]).filter(i=>i.name&&i.name.trim()&&i.category!=='descuentos'&&+i.total_price>0);
    if(!items.length){box.innerHTML='';return}

    // Ensure inflation data is fresh
    await fetchInflation();

    const names=items.map(i=>i.name.trim().toLowerCase());
    const orFilter=names.slice(0,8).map(n=>`product_name.ilike.*${n.split(' ').slice(0,2).join(' ')}*`).join(',');
    let allPoints=[];
    try{
      const {data}=await sb.from('price_points').select('product_name,product_key,store,store_address,unit_price,purchased_at,receipt_id,currency,brand,variant,size_value,size_unit,description_key').neq('receipt_id',r.rid||'').or(orFilter).order('purchased_at',{ascending:false}).limit(120);
      allPoints=data||[];
    }catch(e){}

    const curEquivs=getEquivsCache();
    const matches=[];
    let idx=0;

    for(const item of items){
      const unitP=item.qty?item.total_price/item.qty:item.total_price;
      const itemFull=[item.name,item.brand,item.variant,item.size_value&&item.size_unit?`${item.size_value}${item.size_unit}`:''].filter(Boolean).join(' ');
      const candidates=[];

      for(const p of allPoints){
        if(!p.unit_price||+p.unit_price<=0)continue;
        const eqKey=[nk(item.name),nk(p.product_name)].sort().join(':::');
        if(curEquivs[eqKey]===-1)continue; // Excluded by user!

        if(curEquivs[eqKey]===1){
          candidates.push({p,conf:{level:'alta',score:1.0,reason:'Confirmado por usuario'}});
        }else{
          const pFull=[p.product_name,p.brand,p.variant,p.size_value&&p.size_unit?`${p.size_value}${p.size_unit}`:''].filter(Boolean).join(' ');
          if(item.brand&&p.brand&&nk(item.brand)!==nk(p.brand))continue;
          const conf=getProductMatchConfidence(itemFull,pFull);
          if(conf.level==='alta'||(conf.level==='media'&&conf.score>=0.35)){
            candidates.push({p,conf});
          }
        }
      }

      if(!candidates.length)continue;

      candidates.sort((a,b)=>(b.conf.score||0)-(a.conf.score||0)||b.p.purchased_at.localeCompare(a.p.purchased_at));
      const topCand=candidates[0];
      const other=topCand.p;

      const adj=calcAdjustedPrice(other.unit_price,other.purchased_at,r.date||today());
      const refP=adj.adjusted;

      const pctDiff=Math.round(((unitP/refP)-1)*100);
      let status='yellow';
      if(pctDiff<-3) status='green';
      else if(pctDiff>3) status='red';

      const itemSaving=(refP-unitP)*(item.qty||1);

      matches.push({
        id:++idx,
        itemName:item.name,
        qty:item.qty||1,
        myUnitP:unitP,
        otherProduct:other.product_name,
        otherStore:other.store,
        otherAddr:other.store_address||'',
        otherDate:other.purchased_at,
        otherNominalPrice:+other.unit_price,
        adjRefPrice:refP,
        appliedInflation:adj.applied,
        diffDays:adj.diffDays,
        ipcRate:adj.rate,
        status,
        pctDiff,
        saving:itemSaving,
        active:true,
        validated:curEquivs[[nk(item.name),nk(other.product_name)].sort().join(':::')]===1?'yes':false
      });
    }

    window._currentReceiptInsights={
      receipt:r,
      matches,
      netSavings:0
    };

    renderPostInsightsHtml();
  }catch(err){
    console.error('Error computing insights:',err);
    if(box)box.innerHTML='';
  }
}

let tourI=0,tourOpen=false,tourNo=true,tourTouched=false;
function isTourOff(){
  if(window._tourOff||localStorage.getItem('tourOff')==='1'||localStorage.getItem('tour_seen')==='1'||sessionStorage.getItem('tourOff')==='1'||user?.user_metadata?.tour_off||user?.user_metadata?.tour_seen){
    window._tourOff=true;
    try{localStorage.setItem('tourOff','1')}catch(_){}
    try{sessionStorage.setItem('tourOff','1')}catch(_){}
    return true;
  }
  return false;
}
function setTourOffPreference(off){
  tourNo=off!==false;
  tourTouched=true;
  if(tourNo){
    window._tourOff=true;
    try{localStorage.setItem('tourOff','1')}catch(_){}
    try{localStorage.setItem('tour_seen','1')}catch(_){}
    try{sessionStorage.setItem('tourOff','1')}catch(_){}
    if(user){
      if(!user.user_metadata)user.user_metadata={};
      user.user_metadata.tour_off=true;
      user.user_metadata.tour_seen=true;
      if(sb&&sb.auth&&typeof sb.auth.updateUser==='function'){
        sb.auth.updateUser({data:{tour_off:true,tour_seen:true}}).catch(()=>{});
      }
      try{
        fetch('/api/canasta/user/set-tour-preference',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({userId:user.id,email:user.email,tourOff:true})
        }).catch(()=>{});
      }catch(_){}
    }
  }else{
    window._tourOff=false;
    try{localStorage.setItem('tourOff','0')}catch(_){}
    try{localStorage.removeItem('tour_seen')}catch(_){}
    try{sessionStorage.setItem('tourOff','0')}catch(_){}
  }
}
window.setTourOffPreference=setTourOffPreference;
window.isTourOff=isTourOff;

function tourStart(manual){
  if(tourOpen)return;
  if(isTourOff()&&!manual)return;
  closeModal();tourOpen=true;tourI=0;tourTouched=false;tourNo=true;
  const r=document.createElement('div');r.id='tour';r.setAttribute('role','dialog');r.setAttribute('aria-modal','true');r.setAttribute('aria-label','Recorrido guiado');
  r.innerHTML='<div class="back" onclick="tourEnd()"></div><div id="tspot"></div><div id="tcard"></div>';
  document.body.appendChild(r);tourShow();
}
function tourShow(){
  const st=TOUR[tourI],first=tourI===0,last=!!st.last;
  if(st.v&&view!==st.v)go(st.v);
  const tgt=st.v?document.querySelector(`#nav button[data-v="${st.v}"]`):null,root=$('#tour');
  if(!root)return;
  root.classList.toggle('center',!tgt);
  const card=$('#tcard');
  card.innerHTML=`${st.icon?`<div style="font-size:2.4rem;line-height:1">${st.icon}</div>`:''}<h2>${esc(st.t)}</h2><p>${esc(st.d)}</p>
  <div class="dots" aria-hidden="true">${TOUR.map((_,i)=>`<i class="${i===tourI?'on':''}"></i>`).join('')}</div>
  <div class="mu" style="font-size:.8rem">${tourI+1} de ${TOUR.length}</div>
  <div class="tnav">${first?'':'<button class="ghost" onclick="tourGo(-1)">Atrás</button>'}<button id="tnext" onclick="${last?'tourEnd()':'tourGo(1)'}">${first?'Comenzar':last?'¡Empezar!':'Siguiente'}</button></div>
  ${last?'<div class="tnav"><button class="ghost" onclick="tourEnd(\'settings\')">Ir a Ajustes</button><button class="ghost" onclick="tourEnd(\'help\')">Ver la guía</button></div>':''}
  <label class="tchk" style="cursor:pointer"><input type="checkbox" id="tnoshow" ${tourNo?'checked':''} onchange="setTourOffPreference(this.checked)"> No volver a mostrar al iniciar la app</label>
  ${last?'':'<button class="tskip" onclick="tourEnd()">Omitir recorrido</button>'}`;
  if(tgt){
    const b=tgt.getBoundingClientRect(),sp=$('#tspot'),pad=6,round=tgt.classList.contains('scan');
    sp.style.left=(b.left-pad)+'px';sp.style.top=(b.top-pad)+'px';sp.style.width=(b.width+pad*2)+'px';sp.style.height=(b.height+pad*2)+'px';sp.style.borderRadius=round?'50%':'20px';
    card.style.top='auto';card.style.bottom=(innerHeight-b.top+pad+14)+'px';
  }else{card.style.top='';card.style.bottom=''}
  const n=$('#tnext');if(n)n.focus();
}
function tourGo(d){tourI=Math.max(0,Math.min(TOUR.length-1,tourI+d));tourShow()}
function tourEnd(dest){
  const r=$('#tour');if(r)r.remove();tourOpen=false;
  setTourOffPreference(tourNo!==false);
  go(dest||'home');
  if(localStorage.getItem('seen_novedades_ver')!=='2026-11-04'){
    setTimeout(checkNovedadesAuto,600);
  }
}
function tourAuto(){
  if(isTourOff()||!user||draft||window._exp||tourOpen)return;
  const ov=$('#ov');if(ov&&!ov.hidden)return;
  tourStart();
}
addEventListener('resize',()=>{if(tourOpen)tourShow()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tourOpen)tourEnd()});

/* ---------- Compartir e instalar ---------- */
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const inviteText=w=>`Te invito a probar Canasta 🧺: registrás tus compras del súper sacándole una foto al ticket, ves en qué gastás y dónde conviene comprar.${w?`\n\nAbrila acá: ${appUrl()}`:''}\n\nCómo instalarla:\n• iPhone: abrí el link en Safari → botón Compartir → "Agregar a pantalla de inicio".\n• Android: abrí el link en Chrome → menú ⋮ → "Instalar app".`;
async function shareApp(){
  try{if(navigator.share){await navigator.share({title:'Canasta',text:inviteText(true),url:appUrl()});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  copyInvite();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function getEdFilterCss(){
  if(!E)return 'none';
  const f=[];
  if(E.filter==='contrast') f.push('grayscale(1) contrast(1.8) brightness(1.1)');
  else if(E.filter==='brighten') f.push('grayscale(1) brightness(1.4) contrast(1.5)');
  else if(E.filter==='ink') f.push('grayscale(1) contrast(2.4) brightness(1.05)');
  else if(E.filter==='clean') f.push('grayscale(1) brightness(1.25) contrast(1.85)');
  else if(E.filter==='binary') f.push('grayscale(1) contrast(4.5) brightness(1.25)');
  else if(E.filter==='invert') f.push('grayscale(1) invert(1) contrast(1.6)');
  if(E.brightness!==1.0) f.push(`brightness(${E.brightness})`);
  if(E.contrast!==1.0) f.push(`contrast(${E.contrast})`);
  return f.length ? f.join(' ') : 'none';
}

function adjustEdLight(delta){

function applyEdCleaning(ctx, w, h){
  if(!E)return;
  const id=ctx.getImageData(0,0,w,h);
  const d=id.data, n=d.length;
  const mode=E.filter, bMult=E.brightness||1.0, cMult=E.contrast||1.0;

  if(mode!=='none' || bMult!==1.0 || cMult!==1.0){
    for(let i=0;i<n;i+=4){
      let gray=0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      if(mode==='contrast'){
        gray=(gray-128)*1.8+138;
      }else if(mode==='brighten'){
        gray=gray>105?Math.min(255,gray*1.38):gray*0.92;
        gray=(gray-120)*1.5+130;
      }else if(mode==='ink'){
        if(gray<145) gray=gray*0.65;
        else gray=Math.min(255,gray*1.25);
        gray=(gray-128)*2.1+130;
      }else if(mode==='clean'){
        if(gray>130) gray=255;
        else if(gray<85) gray=0;
        else gray=(gray-110)*2.2+120;
      }else if(mode==='binary'){
        gray=gray<138?0:255;
      }else if(mode==='invert'){
        gray=255-((gray-128)*1.6+128);
      }
      if(bMult!==1.0 || cMult!==1.0){
        gray=(gray-128)*cMult + 128*bMult;
      }
      gray=gray<0?0:gray>255?255:gray;
      d[i]=d[i+1]=d[i+2]=gray;
    }
    ctx.putImageData(id,0,0);
  }

  if(E.sharp){
    const copy=ctx.getImageData(0,0,w,h);
    const cd=copy.data, outD=id.data;
    for(let y=1;y<h-1;y++){
      for(let x=1;x<w-1;x++){
        const idx=(y*w+x)*4;
        for(let c=0;c<3;c++){
          const val=5*cd[idx+c]
            -cd[((y-1)*w+x)*4+c]
            -cd[((y+1)*w+x)*4+c]
            -cd[(y*w+(x-1))*4+c]
            -cd[(y*w+(x+1))*4+c];
          outD[idx+c]=val<0?0:val>255?255:val;
        }
      }
    }
    ctx.putImageData(id,0,0);
  }
}

function edOpen(b64,o){
  const img=new Image();
  img.onload=()=>{
    E={img,rot:0,filter:'none',brightness:1.0,contrast:1.0,sharp:false,crop:{x:0,y:0,w:1,h:1},o,dw:0,dh:0};
    const r=document.createElement('div');r.id='ed';r.setAttribute('role','dialog');r.setAttribute('aria-modal','true');r.setAttribute('aria-label','Editar foto');
    r.innerHTML=`<div class="edh"><b>Editar foto</b><span class="mu">Arrastrá cualquier barra verde o esquina para recortar</span></div>
    <div class="edv"><div id="edw"><canvas id="edc"></canvas><div id="edb">
      <div class="ed-edge ed-edge-t" data-h="t" title="Arrastrar borde superior"><span></span></div>
      <div class="ed-edge ed-edge-b" data-h="b" title="Arrastrar borde inferior"><span></span></div>
      <div class="ed-edge ed-edge-l" data-h="l" title="Arrastrar borde izquierdo"><span></span></div>

      <button type="button" onclick="edRot(90)">↻ Girar der.</button>

    </div>
    <div id="ed-filters" class="chips">

      <button type="button" class="chip ${E.filter==='contrast'?'on':''}" onclick="setEdFilter('contrast')">🌓 Contraste B&N</button>

      <button type="button" class="chip ${E.filter==='clean'?'on':''}" onclick="setEdFilter('clean')">✨ Quitar manchas</button>
      <button type="button" class="chip ${E.filter==='binary'?'on':''}" onclick="setEdFilter('binary')">🔍 B&N Puro</button>

    </div>
    <div class="ed-adj-bar">

      <button type="button" class="chip" onclick="adjustEdLight(-0.15)">🌑 - Luz</button>
      <button type="button" class="chip" onclick="adjustEdContrast(0.25)">➕ + Contraste</button>
    </div>
    <div class="eda">
      <button type="button" class="ghost" onclick="edClose(false)">${o.fresh?'Descartar':'Cancelar'}</button>
      <button type="button" onclick="edClose(true)">✓ Usar foto</button>
    </div>`;
    document.body.appendChild(r);
    const box=$('#edb');let drag=null;
    box.onpointerdown=e=>{
      let h=e.target.dataset.h;
      if(!h && e.target.parentElement?.dataset?.h) h=e.target.parentElement.dataset.h;
      if(!h){
        const rect=box.getBoundingClientRect();
        const x=e.clientX-rect.left, y=e.clientY-rect.top;
        const pad=26;
        if(y<pad) h='t';
        else if(y>rect.height-pad) h='b';
        else if(x<pad) h='l';
        else if(x>rect.width-pad) h='r';
        else h='move';
      }
      drag={h,sx:e.clientX,sy:e.clientY,c:{...E.crop}};
      try{box.setPointerCapture(e.pointerId)}catch(x){}
      e.preventDefault();
    };
    box.onpointermove=e=>{
      if(!drag||!E)return;
      const dx=(e.clientX-drag.sx)/E.dw,dy=(e.clientY-drag.sy)/E.dh,m=.1;let {x,y,w,h}=drag.c;
      if(drag.h==='move'){x=clamp(x+dx,0,1-w);y=clamp(y+dy,0,1-h)}
      else{
        if(drag.h.includes('l')){const nx=clamp(x+dx,0,x+w-m);w+=x-nx;x=nx}
        if(drag.h.includes('r'))w=clamp(w+dx,m,1-x);
        if(drag.h.includes('t')){const ny=clamp(y+dy,0,y+h-m);h+=y-ny;y=ny}
        if(drag.h.includes('b'))h=clamp(h+dy,m,1-y);
      }
      E.crop={x,y,w,h};edBox();
    };
    box.onpointerup=box.onpointercancel=()=>{drag=null};
    edDraw();
    if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>edDraw());
  };
  img.onerror=()=>{toast('No pude abrir la foto para editarla');if(o.cancel)o.cancel()};
  img.src='data:image/jpeg;base64,'+b64;
}
function edDraw(){
  if(!E)return;
  const img=E.img,r=((E.rot%360)+360)%360,rw=r%180?img.height:img.width,rh=r%180?img.width:img.height;
  const edvEl=document.querySelector?document.querySelector('#ed .edv'):null;
  const availW=Math.max(180,Math.min((edvEl&&edvEl.clientWidth>0?edvEl.clientWidth-32:innerWidth-40),540));
  const availH=Math.max(150,(edvEl&&edvEl.clientHeight>0?edvEl.clientHeight-36:Math.max(160,innerHeight-340)));
  const sc=Math.min(availW/rw,availH/rh),cw=Math.max(1,Math.round(rw*sc)),ch=Math.max(1,Math.round(rh*sc));
  E.dw=cw;E.dh=ch;
  const c=$('#edc');c.width=cw;c.height=ch;const x=c.getContext('2d');
  x.save();x.translate(cw/2,ch/2);x.rotate(r*Math.PI/180);x.drawImage(img,-img.width*sc/2,-img.height*sc/2,img.width*sc,img.height*sc);x.restore();
  c.style.filter=getEdFilterCss();
  const w=$('#edw');w.style.width=cw+'px';w.style.height=ch+'px';
  edBox();
}
function edBox(){const b=$('#edb'),c=E.crop;b.style.left=c.x*E.dw+'px';b.style.top=c.y*E.dh+'px';b.style.width=c.w*E.dw+'px';b.style.height=c.h*E.dh+'px'}
function edRot(d){E.rot+=d;E.crop={x:0,y:0,w:1,h:1};edDraw()}
function edReset(){E.rot=0;E.filter='none';E.brightness=1.0;E.contrast=1.0;E.sharp=false;E.crop={x:0,y:0,w:1,h:1};edDraw()}
function edExport(){
  const img=E.img,r=((E.rot%360)+360)%360,rw=r%180?img.height:img.width,rh=r%180?img.width:img.height;
  const full=document.createElement('canvas');full.width=rw;full.height=rh;
  const fc=full.getContext('2d');fc.translate(rw/2,rh/2);fc.rotate(r*Math.PI/180);fc.drawImage(img,-img.width/2,-img.height/2);
  const f=E.crop,sx=f.x*rw,sy=f.y*rh,sw=f.w*rw,sh=f.h*rh;
  const out=document.createElement('canvas');out.width=Math.max(1,Math.round(sw));out.height=Math.max(1,Math.round(sh));
  const oc=out.getContext('2d');oc.drawImage(full,sx,sy,sw,sh,0,0,out.width,out.height);
  applyEdCleaning(oc, out.width, out.height);
  return out.toDataURL('image/jpeg',.85).split(',')[1];
}
function edClose(ok){
  if(!E)return;
  const o=E.o;let out=null;
  if(ok){try{out=edExport()}catch(err){toast('No pude procesar la imagen');return}}
  const r=$('#ed');if(r)r.remove();E=null;
  if(ok)o.done(out);else if(o.cancel)o.cancel();
}

window.edDraw=edDraw;
window.edBox=edBox;
window.edRot=edRot;

async function captureScreenToJpeg(){
  if(typeof window.html2canvas==='function'){
    try{
      const canvas=await window.html2canvas(document.body,{
        useCORS:true,
        allowTaint:true,
        logging:false,
        scale:Math.min(window.devicePixelRatio||1,1.5)
      });
      if(canvas){
        const maxW=800;
        let finalCanvas=canvas;
        if(canvas.width>maxW){
          const sc=maxW/canvas.width;
          const sw=Math.round(canvas.width*sc);
          const sh=Math.round(canvas.height*sc);
          const down=document.createElement('canvas');
          down.width=sw;down.height=sh;
          const ctx=down.getContext('2d');
          if(ctx){
            ctx.drawImage(canvas,0,0,sw,sh);
            finalCanvas=down;
          }
        }
        return finalCanvas.toDataURL('image/jpeg',0.70);
      }
    }catch(err){
      console.warn('html2canvas error, fallback canvas',err);
    }
  }
  try{
    const fbC=document.createElement('canvas');
    fbC.width=400;fbC.height=700;
    const ctx=fbC.getContext('2d');
    if(ctx){
      ctx.fillStyle='#f5f3ef';ctx.fillRect(0,0,400,700);
      ctx.fillStyle='#2c3e50';ctx.font='bold 20px sans-serif';ctx.fillText('Canasta App',24,50);
      ctx.font='14px sans-serif';ctx.fillStyle='#555';
      ctx.fillText('Pantalla: '+(view||'app'),24,90);
      ctx.fillText('Fecha: '+(new Date()).toLocaleString('es-AR'),24,120);
      ctx.fillText('Resolución: '+(window.innerWidth||0)+'x'+(window.innerHeight||0),24,150);
      return fbC.toDataURL('image/jpeg',0.70);
    }
  }catch(_){}
  return null;
}

function handleManualFeedbackScreenshot(input){
  const files=Array.from(input&&input.files?input.files:[]);
  if(!files.length)return;
  if(!Array.isArray(fbS.attachments))fbS.attachments=[];
  let pending=files.length;
  const doneOne=()=>{pending--;if(pending<=0){fbRender();toast('Archivo adjuntado.');}};
  for(const file of files){
    const isImg=file.type&&file.type.startsWith('image/');
    const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'');
    if(!isImg&&!isPdf){toast('Formato no soportado (usá imagen o PDF): '+(file.name||''));pending--;continue;}
    if(!isImg&&file.size>1.5*1024*1024){toast('El archivo PDF supera 1.5 MB: '+(file.name||''));pending--;continue;}
    const reader=new FileReader();
    reader.onload=e=>{
      if(isImg){
        const img=new Image();
        img.onload=()=>{
          const maxW=800;
          let w=img.width,h=img.height;
          if(w>maxW){h=Math.round(h*(maxW/w));w=maxW;}
          const cv=document.createElement('canvas');
          cv.width=w;cv.height=h;
          const ctx=cv.getContext('2d');
          const outUrl=ctx?(ctx.drawImage(img,0,0,w,h),cv.toDataURL('image/jpeg',0.75)):e.target.result;
          if(!fbS.screenshot){fbS.screenshot=outUrl;}
          else{fbS.attachments.push({name:file.name||'captura.jpg',type:'image/jpeg',dataUrl:outUrl});}
          doneOne();
        };
        img.src=e.target.result;
      }else{
        fbS.attachments.push({name:file.name||'documento.pdf',type:'application/pdf',dataUrl:e.target.result});
        doneOne();
      }
    };
    reader.readAsDataURL(file);
  }
}

let gm=null,gcd=null,Pl=null,AS=null,stok=null,sugs=[],sugT=0,lockUntil=0,mineL=[],nearL=[];
let lfMap=null,revGeoTimer=0,mapReady=false;
const ll=o=>({lat:typeof o.lat==='function'?o.lat():o.lat,lng:typeof o.lng==='function'?o.lng():o.lng});
const shortAddr=a=>String(a||'').split(',').map(x=>x.trim().replace(/^[A-Z]?\d{4}[A-Z]{0,3}\s*/,'')).filter(x=>x&&!/^argentina$/i.test(x)).slice(0,3).join(', ');
const hav=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 12742*Math.asin(Math.sqrt(h))};

async function mapOsm(c,q){
  mapReady=true;

    center={lat:draft.lat,lng:draft.lng};

    const geo=await geocodeAddr(draft.address);
    if(geo){center=geo;draft.lat=geo.lat;draft.lng=geo.lng}
  }
  if(!center){
    center=c||pos||{lat:-34.6037,lng:-58.3816};

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'}).addTo(lfMap);

async function revGeoOSM(loc){
  const my=++revTok,m=$('#mmsg');
  if(!m)return;
  m.innerHTML='<div class="mu" style="margin:8px 0">Leyendo dirección en el pin rojo…</div>';
  clearTimeout(revGeoTimer);
  revGeoTimer=setTimeout(async()=>{
    try{
      const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${loc.lat}&lon=${loc.lng}&accept-language=es`;
      const r=await fetch(url,{signal:AbortSignal.timeout(6000)});
      if(my!==revTok)return;
      if(!r.ok)throw new Error('Error al consultar dirección');
      const j=await r.json();
      if(my!==revTok)return;
      const a=j.address||{};
      const road=a.road||a.pedestrian||a.street||'';
      const num=a.house_number||'';
      const sub=a.suburb||a.neighbourhood||a.city_district||a.city||a.town||'';
      const parts=[num&&road?`${road} ${num}`:(road||j.name),sub].filter(Boolean);
      const addr=parts.join(', ')||shortAddr(j.display_name)||`${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`;
      found={name:j.name||'',addr,loc:{lat:loc.lat,lng:loc.lng}};
      showFound();
    }catch(e){
      if(my!==revTok)return;
      found={name:'',addr:`Ubicación (${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)})`,loc:{lat:loc.lat,lng:loc.lng}};
      showFound();
    }
  },250);
}

async function suggestPhoton(t,c){
  const box=$('#msug');t=String(t||'').trim();
  if(t.length<2){box.innerHTML='';sugs=[];return}
  box.innerHTML='<p class="mu" style="padding:6px 8px">Buscando locales…</p>';
  try{
    const posCoords=c||pos||{lat:-34.6037,lng:-58.3816};
    const url=`https://photon.komoot.io/api/?q=${encodeURIComponent(t)}&lat=${posCoords.lat}&lon=${posCoords.lng}&limit=6`;
    const r=await fetch(url,{signal:AbortSignal.timeout(5000)});
    if(!r.ok)throw new Error('Error al buscar');
    const data=await r.json();
    const feats=(data.features||[]).filter(f=>f.geometry&&f.geometry.coordinates);
    if(!feats.length){box.innerHTML='<p class="mu" style="padding:6px 8px">Sin resultados en OpenStreetMap. Probá con otra calle o nombre.</p>';return}
    sugs=feats.map(f=>{
      const p=f.properties||{};
      const [lng,lat]=f.geometry.coordinates;
      const street=[p.street,p.housenumber].filter(Boolean).join(' ')||p.name||'';
      const locality=p.locality||p.district||p.city||p.county||'';
      const fullAddr=[street,locality].filter(Boolean).join(', ')||p.name||'';
      const name=p.name||t;
      const d=(c||pos)?hav(c||pos,{lat,lng}):null;
      return {name,addr:fullAddr,loc:{lat,lng},d};
    });
    box.innerHTML=sugs.map((x,k)=>`<button type="button" class="opt" onclick="pickPhoton(${k})" style="text-align:left;width:100%;padding:8px 10px;border-bottom:1px solid var(--ln);background:none;border-left:0;border-right:0;border-top:0;cursor:pointer"><b>${esc(x.name)}</b>${x.d!=null?` <span class="mu">· ${fmtD(x.d)}</span>`:''}<br><span class="mu" style="font-size:.85rem">${esc(x.addr)}</span></button>`).join('');
  }catch(e){box.innerHTML=`<p class="mu" style="padding:6px 8px">No se pudo buscar sugerencias (${esc(e.message)}).</p>`}
}

function pickPhoton(k){
  const x=sugs[k];if(!x)return;
  $('#msug').innerHTML='';
  const inp=$('#msearch');if(inp)inp.value=x.name;

function loadMaps(key){return window.google&&google.maps&&google.maps.importLibrary?Promise.resolve():new Promise((ok,no)=>{window.__mi=ok;const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&loading=async&language=es&callback=__mi`;s.onerror=()=>no(Error('No se pudo cargar Google Maps'));document.head.appendChild(s)})}

async function mapJs(key,c,q){
  const m=$('#mmsg');m.textContent='Cargando mapa…';
  try{
    await loadMaps(key);
    const lib=await google.maps.importLibrary('places');
    Pl=lib.Place;AS=lib.AutocompleteSuggestion;stok=new lib.AutocompleteSessionToken();gcd=new google.maps.Geocoder();
    let has=draft.lat!=null,center=has?{lat:draft.lat,lng:draft.lng}:(c||{lat:-34.6037,lng:-58.3816}),start=null;
    if(has)start={addr:draft.address,loc:center};
    else if(draft.address.trim()){try{const r0=await gcd.geocode({address:draft.address,region:'ar',language:'es'});const g=(r0.results||[])[0];if(g){center=ll(g.geometry.location);has=true;start={addr:g.formatted_address,loc:center}}}catch(e){}}
    gm=new google.maps.Map($('#map'),{center,zoom:has||c?17:12,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});
    if(c)new google.maps.Marker({map:gm,position:c,title:'Vos',icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:'#4285F4',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
    gm.addListener('dragstart',()=>{m.textContent='Soltá el mapa donde está el local…'});
    gm.addListener('idle',()=>{if(Date.now()>=lockUntil)revGeo(gm.getCenter())});
    gm.addListener('click',async e=>{if(!e.placeId)return;e.stop();try{const p=new Pl({id:e.placeId,requestedLanguage:'es'});await p.fetchFields({fields:['displayName','formattedAddress','location']});setFound(p.displayName,p.formattedAddress,p.location)}catch(err){m.textContent='No pude leer ese lugar: '+err.message}});
    if(start&&start.addr){found={name:'',addr:shortAddr(start.addr),loc:ll(start.loc)};lockUntil=Date.now()+2500;showFound()}
    const inp=$('#msearch');inp.hidden=false;inp.value=q||'';
    inp.oninput=()=>{clearTimeout(sugT);sugT=setTimeout(()=>suggest(inp.value),250)};
    const pin=$('#mpin');if(pin)pin.style.display='block';
    const gps=$('#mgps');if(gps)gps.style.display='flex';
    setTimeout(()=>{
      if(gm&&window.google){google.maps.event.trigger(gm,'resize');gm.setCenter(center);}
    },100);
    loadChips(c);mapReady=true;
  }catch(err){
    console.warn('Google Maps error, falling back to OpenStreetMap:',err);
    mapOsm(c,q);
  }
}

async function revGeo(c){
  const m=$('#mmsg'),my=++revTok,loc=ll(c);

async function suggest(t){
  const box=$('#msug');t=String(t||'').trim();
  if(t.length<2){box.innerHTML='';sugs=[];return}
  try{
    const o=pos||ll(gm.getCenter()),req={input:t,language:'es',sessionToken:stok,origin:o,locationBias:{center:o,radius:8000}};
    const {suggestions}=await AS.fetchAutocompleteSuggestions(req);
    sugs=(suggestions||[]).filter(x=>x.placePrediction).slice(0,5);
    box.innerHTML=sugs.map((x,k)=>{const p=x.placePrediction;return `<button class="opt" onclick="pickSug(${k})"><b>${esc(p.mainText?p.mainText.text:p.text.text)}</b>${p.distanceMeters!=null?` <span class="mu">· ${fmtD(p.distanceMeters/1000)}</span>`:''}<br><span class="mu">${esc(p.secondaryText?p.secondaryText.text:'')}</span></button>`}).join('')||'<p class="mu">Sin resultados: probá con otro nombre o con la dirección.</p>';
  }catch(e){box.innerHTML=`<p class="mu">No pude buscar: ${esc(e.message)}</p>`}
}

async function pickSug(k){
  const p=sugs[k].placePrediction.toPlace();
  try{
    await p.fetchFields({fields:['displayName','formattedAddress','location']});
    $('#msug').innerHTML='';$('#msearch').value=p.displayName||'';

function cleanTicketAddress(raw){
  let s=String(raw||'').trim();
  s=s.replace(/\b(?:cuit|cuil)[:\s]*\d{2}-?\d{8}-?\d\b/gi,' ');
  s=s.replace(/\b\d{2}-\d{8}-\d\b/g,' ');
  s=s.replace(/^(?:inc\s+s\.?a\.?|coto\s+c\.?i\.?c\.?s\.?a\.?|dia\s+argentina\s+s\.?a\.?|carrefour\s+argentina|jumbo\s+retail\s+argentina\s+s\.?a\.?)\s*[-–—|•/]?\s*/gi,' ');
  s=s.replace(/\b(?:sucursal|suc\.?|tienda)\s*#?\s*\d+/gi,' ');
  s=s.replace(/\b(?:local|loc\.?|piso|depto|dpto|oficina)\s*#?\s*[\da-z-]*\b/gi,' ');
  s=s.replace(/\b(?:pb|pa)\b/gi,' ');
  s=s.replace(/\b(?:pos|terminal|caja|cpr\.?|factura|ticket)\s*#?\s*\d+/gi,' ');
  s=s.replace(/\b[A-Za-z]\d{4}[A-Za-z]{3}\b/g,' ');
  s=s.replace(/\b(?:cp|c\.p\.|codigo\s*postal|código\s*postal)\.?\s*#?\s*\d{4}\b/gi,' ');
  s=s.replace(/\(\s*\d{4}\s*\)/g,' ');
  s=s.replace(/\bavda\.?/gi,'Av.');
  s=s.replace(/\bavenida\b/gi,'Av.');
  s=s.replace(/\bbv\.?|\bbulevar\b/gi,'Bv.');
  s=s.replace(/\b(?:capital federal|caba|ciudad autonoma de buenos aires|ciudad de buenos aires)\b/gi,'Buenos Aires');
  s=s.replace(/\s*[-–—|•/]+\s*/g,', ');
  s=s.replace(/[()[\]{}]/g,' ');
  s=s.replace(/,\s*,+/g,',');
  s=s.replace(/\s+/g,' ');
  s=s.replace(/^[,.\s-]+|[,.\s-]+$/g,'');
  return s;
}

function cleanFiscalText(s){
  if(!s)return '';
  let str=String(s).trim();
  str=str.replace(/\b(?:original|duplicado|triplicado|copia)\s+a\s+consumidor\s+final\b/gi,' ');
  str=str.replace(/\breg\.?\s*transparencia\s*fiscal(?:\s*al\s*consumidor)?(?:\s*ley\s*\d+)?\b/gi,' ');
  str=str.replace(/\bley\s*27743\b/gi,' ');
  str=str.replace(/\botros\s+impuestos\s+nacionales\s+indirectos\b/gi,' ');
  str=str.replace(/\blos\s+impuestos\s+informados\s+son\s+a\s+nivel\s+nacional\b/gi,' ');
  str=str.replace(/\bpor\s+informacion\s+referida\s+a\s+gastos\s+extra[^\n.]*/gi,' ');
  str=str.replace(/\bseguros\s+o\s+adicionales\s+consulte\s+a\s+la\s+emisora[^\n.]*/gi,' ');
  str=str.replace(/\bcae\s*[:#]?\s*\d+\b/gi,' ');
  str=str.replace(/\bvto\.?\s*cae\s*[:#]?\s*\d{2}[/-]\d{2}[/-]\d{4}\b/gi,' ');
  str=str.replace(/\b(?:p\.v\.?|pv|pto\s*vta|punto\s*de\s*venta)\s*[:#]?\s*\d+\b/gi,' ');
  str=str.replace(/\b(?:cuit|cuil)[:\s]*\d{2}-?\d{8}-?\d\b/gi,' ');
  str=str.replace(/\s+/g,' ').trim();
  if(str.length<4||/^(?:original|consumidor|fiscal|ley|afip|arca|iva|cf|final)$/i.test(str))return '';

}

async function geocodeAddr(a, multi=false){
  const q=cleanTicketAddress(a);
  if(q.length<4)return multi?[]:null;
  const candidates=[];
  try{
    const pCoords=(typeof pos!=='undefined'&&pos)?pos:{lat:-34.6037,lng:-58.3816};
    const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${pCoords.lat}&lon=${pCoords.lng}&limit=4`,{signal:AbortSignal.timeout(5000)});
    if(r.ok){
      const data=await r.json();
      for(const f of (data.features||[])){
        if(f&&f.geometry&&f.geometry.coordinates){
          const [lng,lat]=f.geometry.coordinates;
          const p=f.properties||{};
          const name=[p.street,p.housenumber].filter(Boolean).join(' ')||p.name||q;
          const details=[p.city,p.state].filter(Boolean).join(', ');
          if(!candidates.some(c=>c.name===name||(Math.abs(c.lat-lat)<0.001&&Math.abs(c.lng-lng)<0.001))){
            candidates.push({lat,lng,name,details});
          }
        }
      }
    }
  }catch(e){}
  if(!candidates.length){
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&countrycodes=ar&accept-language=es&q='+encodeURIComponent(q),{signal:AbortSignal.timeout(6000)});
      if(r.ok){
        const list=await r.json();
        for(const x of (list||[])){
          candidates.push({lat:+x.lat,lng:+x.lon,name:x.display_name,details:''});
        }
      }
    }catch(e){}
  }
  if(multi)return candidates;
  return candidates[0]||null;
}

function levenshteinDistance(a,b){
  if(a===b)return 0;
  if(!a.length)return b.length;
  if(!b.length)return a.length;
  const v0=new Array(b.length+1);
  const v1=new Array(b.length+1);
  for(let i=0;i<=b.length;i++)v0[i]=i;
  for(let i=0;i<a.length;i++){
    v1[0]=i+1;
    for(let j=0;j<b.length;j++){
      const cost=a[i]===b[j]?0:1;
      v1[j+1]=Math.min(v1[j]+1,v0[j+1]+1,v0[j]+cost);
    }
    for(let j=0;j<=b.length;j++)v0[j]=v1[j];
  }
  return v1[b.length];
}

async function persistSearchRule(payload){
  try{
    const sess=sb?.auth?.getSession?await sb.auth.getSession():null;
    const token=sess?.data?.session?.access_token;
    if(token){
      const r=await fetch('/api/canasta/admin/search-rules',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify(payload)
      });
      if(r.ok)return await r.json();
    }
  }catch(_){}
  try{
    if(user&&sb&&payload.action==='archive'&&payload.ruleId){
      await sb.from('feedback').update({status:'archived'}).eq('id',payload.ruleId);
    }else if(user&&sb&&payload.action!=='archive'){
      await sb.from('feedback').insert({
        user_id:user.id,
        ticket:'RULE-'+Date.now().toString(36).toUpperCase(),
        type:'mejora',
        screen:'search_rule',
        status:'activo',
        app_version:typeof APP_VER!=='undefined'?APP_VER:'2026-11-14',
        message:`${payload.kind}: ${payload.from} -> ${payload.to||payload.normalizedName||payload.tags||payload.category||''}`,
        diagnostics:{
          kind:payload.kind,
          from:payload.from,
          to:payload.to,
          normalizedName:payload.normalizedName,
          tags:payload.tags,
          category:payload.category,
          subcategory:payload.subcategory,
          storeCategory:payload.storeCategory,
          ean:payload.ean,
          brand:payload.brand,
          variant:payload.variant,
          size_value:payload.size_value,
          size_unit:payload.size_unit,
          package_type:payload.package_type,
          homologated:payload.homologated
        }
      });
    }
  }catch(_){}
  return {ok:true};
}

async function loadSharedSearchRules(){
  let rules=[];
  try{
    const r=await fetch('/api/canasta/search-rules');
    if(r.ok){
      const j=await r.json();
      if(Array.isArray(j.rules))rules=j.rules;
    }
  }catch(_){}
  if(!rules.length&&sb&&user){
    try{
      const {data}=await sb.from('feedback').select('id,ticket,status,message,diagnostics,created_at').eq('screen','search_rule').neq('status','archived').order('created_at',{ascending:true}).limit(300);
      if(Array.isArray(data))rules=data;
    }catch(_){}
  }
  if(!rules.length)return;
  const eq=getAdminEquivsMap(), ac=getAdminAcronymsMap(), ex=getAdminExclusionsMap(), al=getAdminProductAliases();
  const subTagsMap=getAdminSubcategoryTagsMap(), subCatsMap=getAdminSubcategoryCatsMap();
  for(const row of rules){
    const d=row?.diagnostics||{};
    const f=nk(d.from||''), t=nk(d.to||'');
    if(d.kind==='synonym'&&f&&t){
      if(!eq[f])eq[f]=[];
      if(!eq[f].includes(t))eq[f].push(t);
    }else if(d.kind==='acronym'&&f&&t){
      if(!ac[f])ac[f]=[];
      if(!ac[f].includes(t))ac[f].push(t);
    }else if(d.kind==='exclude'&&f&&t){
      if(!ex[f])ex[f]=[];
      if(!ex[f].includes(t))ex[f].push(t);
    }else if(d.kind==='subcat_tags'&&f){
      const arr=String(d.to||d.tags||'').split(/[,;|]+/).map(nk).filter(Boolean);
      subTagsMap[f]=[...new Set(arr)];
      if(d.category)subCatsMap[f]=nk(d.category);
    }else if(d.kind==='normalize'&&f){
      al[f]={
        raw:d.from,
        normalizedName:d.normalizedName||'',
        tags:d.tags||'',
        category:d.category||'',
        subcategory:d.subcategory||'',
        storeCategory:d.storeCategory||'',
        ean:d.ean||'',
        brand:d.brand||'',
        variant:d.variant||'',
        size_value:d.size_value??null,
        size_unit:d.size_unit||'',
        package_type:d.package_type||'',
        homologated:d.homologated!==undefined?!!d.homologated:!!(d.normalizedName||d.ean),
        ruleId:row.id
      };
    }
  }
  saveAdminEquivsMap(eq);
  saveAdminAcronymsMap(ac);
  saveAdminExclusionsMap(ex);
  saveAdminProductAliases(al);
  saveAdminSubcategoryTagsMap(subTagsMap);
  saveAdminSubcategoryCatsMap(subCatsMap);
}
window.loadSharedSearchRules=loadSharedSearchRules;
