<style>

.tnav{display:flex;gap:8px;margin-top:12px}.tnav button{flex:1}

.tchk input{width:auto}

details.hq summary::-webkit-details-marker{display:none}
details.hq summary::after{content:'›';font-size:1.4rem;color:var(--g);transform:rotate(90deg);transition:transform .2s}
details.hq[open] summary::after{transform:rotate(-90deg)}
details.hq p,details.hq ul,details.hq ol{margin:8px 0 0;color:#3b4a41}details.hq ul,details.hq ol{padding-left:20px}details.hq li{margin:4px 0}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9;max-width:90%}
@media(min-width:900px){nav{max-width:420px;left:50%;transform:translateX(-50%);border-radius:20px 20px 0 0}}
</style>

<body>
<div id="toast"></div>
<div id="ov" hidden role="dialog" aria-modal="true"><div class="mdl" id="mdl"></div></div>
<main id="app"></main>
<nav id="nav" hidden>
  <button data-v="home">🏠<span>Inicio</span></button>
  <button data-v="prices">🔎<span>Precios</span></button>
  <button class="scan" data-v="scan" aria-label="Escanear ticket">📷</button>
  <button data-v="history">🧾<span>Compras</span></button>
  <button data-v="settings">⚙️<span>Ajustes</span></button>
</nav>
<script>
// 1) Pegá acá los datos de tu proyecto de Supabase (Settings > API)
const SB_URL='https://ddzklkweeftwqqbaozty.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkemtsa3dlZWZ0d3FxYmFvenR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMjA0OTEsImV4cCI6MjEwNjg5NjQ5MX0.Ma79cMLtflb7cA2nCbj_NwwFDmLR2QC-2ElunLy9D6E';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CUR={ARS:{flag:'🇦🇷',name:'Pesos'},USD:{flag:'🇺🇸',name:'Dólares'},BRL:{flag:'🇧🇷',name:'Reales'}};
const money=(n,c)=>{c=CUR[c]?c:'ARS';const d=c==='ARS'?0:2;return new Intl.NumberFormat('es-AR',{style:'currency',currency:c,minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0)};
const fxr=()=>{try{return JSON.parse(localStorage.getItem('fx')||'null')}catch(e){return null}};
const rate=c=>c==='ARS'?1:((fxr()||{})[c]||null);
const conv=(n,from,to)=>{from=from||'ARS';if(from===to)return n;const a=rate(from),b=rate(to);return a&&b?n*a/b:null};
const dispCur=()=>{const v=localStorage.getItem('disp');return CUR[v]?v:'ARS'};
async function fetchFx(force){
  const cur=fxr();if(cur&&cur.src==='manual'&&!force)return cur;
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/USD',{signal:AbortSignal.timeout(7000)});
    const j=await r.json();
    if(j.result==='success'&&j.rates&&+j.rates.ARS>0&&+j.rates.BRL>0){
      const fx={USD:+j.rates.ARS,BRL:+j.rates.ARS/+j.rates.BRL,t:Date.now(),src:'auto'};
      localStorage.setItem('fx',JSON.stringify(fx));lastH.home=null;return fx;
    }
  }catch(e){}
  return null;
}
function autoFx(){const f=fxr();if(!f||(f.src!=='manual'&&Date.now()-f.t>43200000))fetchFx()}
function saveFx(){
  const u=+$('#fxu').value,b=+$('#fxb').value;
  if(!(u>0)||!(b>0))return toast('Cargá los dos tipos de cambio (números mayores a 0).');
  localStorage.setItem('fx',JSON.stringify({USD:u,BRL:b,t:Date.now(),src:'manual'}));lastH.home=null;toast('Tipos de cambio guardados');settings();
}
async function autoFxBtn(){
  toast('Buscando cotización…');const f=await fetchFx(true);
  if(!f)return toast('No pude obtener la cotización. Cargala a mano.');
  settings();toast('Cotización actualizada');
}
const CAT={lacteos:'🥛',carnes:'🥩',panaderia:'🍞',verduras:'🥬',frutas:'🍎',bebidas:'🥤',limpieza:'🧴',almacen:'🥫',otros:'🛒'};
const today=()=>new Date().toISOString().slice(0,10);
let user=null,view='home',draft=null,pendB64='',pendData=null,mapShown=false,pos=null,found=null,lastH={},curH=null,prAI='off',prTerms=[],prCat=false,revTok=0,pendingReload=false,psort='price',pTok=0,prRows=[];

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function app(h){curH=null;$('#app').innerHTML=h}
function show(k,h,silent){
  lastH[k]=h;
  if(view!==k||draft)return;
  if(silent&&k==='history'&&[...document.querySelectorAll('#app [id^="d"]')].some(e=>e.innerHTML))return;
  if(curH===h)return;
  const y=scrollY;app(h);curH=h;if(silent)scrollTo(0,y);
}
const safe=()=>!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));

/* ---------- Auth ---------- */
function login(){
  $('#nav').hidden=true;
  app(`<h1>🧺 Canasta</h1><div class="card"><p>Registrá tus compras del súper y mirá cómo cambian los precios.</p>
  <div class="fields"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Contraseña (mín. 6)" autocomplete="current-password"></div>
  <button onclick="auth('in')">Entrar</button> <button class="ghost" onclick="auth('up')">Crear cuenta</button></div>`);
}
async function auth(k){
  const email=$('#em').value.trim(),password=$('#pw').value;
  const {error}=k==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
  if(error)return toast(error.message);
  boot();
}
async function boot(){
  const {data}=await sb.auth.getSession();
  user=data.session?.user||null;
  if(!user)return login();
  $('#nav').hidden=false;const g=sessionStorage.getItem('goto');sessionStorage.removeItem('goto');window._manualOut=false;go(g||'home');fixCoords();fixSubcats();autoFx();offerRestore();setTimeout(tourAuto,900);
}

/* ---------- Navigation ---------- */
function go(v){
  draft=null;mapShown=false;found=null;
  if(pendingReload&&v!=='scan'&&safe()){sessionStorage.setItem('goto',v);location.reload();return}
  view=v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ({home,prices,scan,history,settings,help})[v]();
}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){clearBk();go(b.dataset.v)}};

/* ---------- Home ---------- */
let hm=0;
const COL={lacteos:'#4F9DDE',carnes:'#D9534F',panaderia:'#E5A93D',verduras:'#3E8E5A',frutas:'#F28C38',bebidas:'#8E6BBF',limpieza:'#2BB3B1',almacen:'#B5835A',otros:'#9AA5A0'};
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function hmGo(d){hm=Math.min(0,hm+d);lastH.home=null;home()}
function donut(sl,total,disp){
  const r=62,C=2*Math.PI*r;let off=0;
  const arcs=sl.map(x=>{const part=x.v/total*C,len=Math.max(0,part-(sl.length>1?2:0));const a=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${COL[x.k]||'#9AA5A0'}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=part;return a}).join('');
  return `<svg viewBox="0 0 160 160" width="176" height="176" role="img" aria-label="Gasto por categoría"><circle cx="80" cy="80" r="${r}" fill="none" stroke="#f1ede2" stroke-width="26"/>${arcs}<text x="80" y="76" text-anchor="middle" font-size="11" fill="#6b7a70">Total</text><text x="80" y="96" text-anchor="middle" font-size="${total>=1e7?13:16}" font-weight="800" fill="#23312A">${money(total,disp)}</text></svg>`;
}
async function home(silent){
  if(!silent){if(lastH.home){app(lastH.home);curH=lastH.home}else app('<p class="mu">Cargando…</p>')}
  const n=new Date(),base=new Date(n.getFullYear(),n.getMonth()+hm,1),nxt=new Date(n.getFullYear(),n.getMonth()+hm+1,1),prv=new Date(n.getFullYear(),n.getMonth()+hm-1,1);
  const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  const {data:rs=[],error}=await sb.from('receipts').select('*').gte('purchased_at',ymd(prv)).lt('purchased_at',ymd(nxt)).order('purchased_at',{ascending:false});
  if(error)return silent?0:app(`<div class="card">No se pudo cargar: ${esc(error.message)}</div>`);
  const cur=rs.filter(r=>r.purchased_at>=ymd(base)),prev=rs.filter(r=>r.purchased_at<ymd(base));
  const disp=dispCur(),cc=r=>r.currency||'ARS';
  const sumC=(a,u)=>a.reduce((s,r)=>{const v=conv(Number(r.total),cc(r),disp);if(v===null){if(u)u[cc(r)]=(u[cc(r)]||0)+Number(r.total);return s}return s+v},0);
  const unconv={},c=sumC(cur,unconv),p=sumC(prev),d=p?((c-p)/p*100):null;
  const nConv=cur.filter(r=>conv(1,cc(r),disp)!==null).length,hasConv=cur.some(r=>cc(r)!==disp&&conv(1,cc(r),disp)!==null);
  const curC={};cur.forEach(r=>{curC[r.id]=cc(r)});
  let its=[];
  for(let i=0;i<cur.length;i+=60){const {data=[]}=await sb.from('receipt_items').select('name,total_price,category,receipt_id').in('receipt_id',cur.slice(i,i+60).map(r=>r.id));its=its.concat(data)}
  const cats={},agg={};

function quality(i){

  const items=draft.items.filter(i=>i.name.trim());
  const total=items.reduce((s,i)=>s+i.total_price,0),edit=!!draft.id;
  if(draft.address.trim()&&draft.lat==null){const g=await geocodeAddr(draft.address);if(g){draft.lat=g.lat;draft.lng=g.lng}}
  const rid=draft.id||draft.rid||(draft.rid=crypto.randomUUID());
  const row={id:rid,store:draft.store.trim(),purchased_at:draft.date,description:draft.description.trim()||null,store_address:draft.address.trim()||null,store_lat:draft.lat,store_lng:draft.lng,currency:draft.currency||'ARS',doc_type:draft.docType==='factura'?'factura':'ticket',doc_number:(draft.docNumber||'').trim()||null,store_tax_id:String(draft.taxId||'').replace(/[^0-9-]/g,'')||null,total};
  const {error}=await sb.from('receipts').upsert(row);

  const oldP=((await sb.from('price_points').select('id').eq('receipt_id',rid)).data||[]).map(x=>x.id);
  const {error:e2}=await sb.from('receipt_items').insert(items.map(i=>({receipt_id:rid,name:i.name.trim(),qty:i.qty||1,unit_price:i.total_price/(i.qty||1),total_price:i.total_price,category:i.category,subcategory:nk(i.subcategory)||null})));
  if(e2){if(!edit&&!oldI.length)await sb.from('receipts').delete().eq('id',rid);throw e2}
  if(oldI.length)await sb.from('receipt_items').delete().in('id',oldI);
  let warn=null;
  if(localStorage.getItem('share')!=='0'){
    const pp=items.filter(i=>i.total_price>0).map(i=>({receipt_id:rid,currency:draft.currency||'ARS',store:draft.store.trim(),store_address:draft.address.trim()||null,lat:draft.lat,lng:draft.lng,product_name:i.name.trim(),product_key:nk(i.name),category:i.category,subcategory:nk(i.subcategory)||null,description:draft.description.trim()||null,description_key:nk(draft.description)||null,qty:i.qty||1,unit_price:i.total_price/(i.qty||1),total_price:i.total_price,purchased_at:draft.date}));
    if(pp.length){const {error:e3}=await sb.from('price_points').insert(pp);if(e3)warn='La compra se guardó, pero no se pudieron compartir los precios.';else if(draft.lat==null)warn='Tus precios se compartieron sin la ubicación del local: no van a aparecer en búsquedas por zona hasta que lo ubiques en el mapa.'}
  }
  if(oldP.length)await sb.from('price_points').delete().in('id',oldP);
  draft.id=rid;draft.saved=true;clearBk();lastH.home=lastH.history=null;
  return{edit,cur:draft.currency||'ARS',fact:draft.docType==='factura',store:draft.store.trim(),n:items.length,total,warn};
}

async function fbSend(){
  fbSync();const x=fbS;

  const m=x.msg.trim();
  if(m.length<5)return fbRender('Escribí al menos unas palabras (mínimo 5 caracteres).');
  x.sending=true;
  modal('<div class="spin"></div><h2>Enviando…</h2><p class="mu">Un momento.</p>',{lock:true});
  const diag=x.diag?{view,ver:APP_VER,ua:navigator.userAgent,vp:innerWidth+'x'+innerHeight,online:navigator.onLine,err:lastErr||null,disp:dispCur()}:null;
  try{
    const {data,error}=await T(sb.from('feedback').insert({type:x.type,rating:x.rating||null,message:m,screen:view,app_version:APP_VER,diagnostics:diag}).select('ticket').single(),20000);

  }

  await getPos();pLoc();
  const r=rad(),useR=r>0&&!!pos;
  const rpcQ=(t,c)=>sb.rpc('search_prices',{q:t,user_lat:pos?pos.lat:null,user_lng:pos?pos.lng:null,radius_km:useR?r:null,cat:c||null});
  const cat=catOf(q),was=prCat;prCat=!!cat;if(prCat!==was)psort=prCat?(pos?'near':'recent'):'price';
  const aiOn=!cat&&!!localStorage.getItem('gk')&&localStorage.getItem('ai')!=='0';
  prAI=aiOn?'loading':(cat||localStorage.getItem('gk')?'off':'nokey');prTerms=[];
  const exP=aiOn?expand(q).catch(()=>[]):null;
  const {data,error}=await rpcQ(stemQ(q),cat);
  if(tok!==pTok)return;
  if(error){b.innerHTML=`<div class="card">No se pudo buscar: ${esc(error.message)}</div>`;return}
  prRows=data||[];
  if(save&&prRows.length)localStorage.setItem('rs',JSON.stringify([q,...recents().filter(x=>x!==q)].slice(0,6)));
  pRender(q,r,useR);
  if(!exP)return;
  const terms=await exP;
  if(tok!==pTok)return;
  if(!terms.length){prAI='done';pRender(q,r,useR);return}
  const res=await Promise.all(terms.map(t=>rpcQ(stemQ(t)).then(x=>({t,rows:(x.data||[]).filter(y=>y.is_exact)}),()=>({t,rows:[]}))));
  if(tok!==pTok)return;
  const seen=new Set(prRows.map(pk));
  res.forEach(({t,rows})=>{let hit=false;rows.forEach(x=>{const k=pk(x);if(seen.has(k))return;seen.add(k);hit=true;prRows.push({...x,is_exact:false,rel:t})});if(hit)prTerms.push(t)});
  prAI='done';pRender(q,r,useR);
}
const prCard=(min,anyExact)=>x=>{
  const disp=dispCur(),cu=x.currency||'ARS',pv=x._p,best=!prCat&&pv!=null&&pv===min&&(x.is_exact||!anyExact),diff=!prCat&&pv!=null&&min>0?Math.round((pv/min-1)*100):0,
    tr=x.prev_price?Math.round((+x.unit_price/+x.prev_price-1)*100):0,
    dest=x.lat!=null?`${x.lat},${x.lng}`:encodeURIComponent(x.store_address||x.store),
    dt=new Date(x.purchased_at+'T00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'});
  return `<div class="card"><div class="row" style="border:0;align-items:flex-start;padding-top:0"><div><b>${esc(x.store)}</b><div class="mu">${esc(x.store_address||'Sin dirección')}</div></div><div class="pp"><div class="p2">${money(+x.unit_price,cu)}</div><div class="mu">${cu!==disp?(pv!=null?`≈ ${money(pv,disp)}`:'sin tipo de cambio'):'por unidad'}</div></div></div>
  <div class="mu">${x.category&&CAT[x.category]?CAT[x.category]+' ':''}${esc(x.product)}${x.subcategory?` · ${esc(x.subcategory)}`:''}${x.rel?`<span class="sim" style="background:#e3f2e8">✨ relacionado: ${esc(x.rel)}</span>`:x.is_exact?'':'<span class="sim">similar</span>'}</div>
  <div class="tags">${best?'<span class="tag best">Más barato</span>':diff>0?`<span class="tag">+${diff}% vs. el más barato</span>`:''}${x.distance_km!=null?`<span class="tag">📍 ${fmtD(x.distance_km)}</span>`:''}<span class="tag">🕒 ${ago(x.purchased_at)} · ${dt}</span>${x.desc_match&&x.description?`<span class="tag">📝 ${esc(x.description)}</span>`:''}${tr?`<span class="tag ${tr>0?'up':'dn'}">${tr>0?'▲':'▼'} ${Math.abs(tr)}% vs. antes</span>`:''}${days(x.purchased_at)>30?'<span class="tag">⚠️ puede haber cambiado</span>':''}${x.reports>1?`<span class="tag">${x.reports} registros</span>`:''}</div>
  <a class="btn sm" href="https://www.google.com/maps/dir/?api=1&destination=${dest}" target="_blank" rel="noopener">Cómo llegar</a></div>`;
};
function pRender(q,r,useR){
  const b=$('#pbody');
  if(!prRows.length){
    if(prAI==='loading'){b.innerHTML='<p class="mu">✨ Buscando productos relacionados…</p>';return}
    const nx=r===0?null:RADS[RADS.indexOf(r)+1];
    b.innerHTML=`<div class="empty">Todavía no hay precios de "${esc(q)}" ${useR?`a menos de ${r} km`:'registrados'}.<br><br>${nx!=null?`<button onclick="setRad(${nx})">Ampliar a ${nx?nx+' km':'todos los locales'}</button>`:'Podés ser el primero: escaneá un ticket con ese producto.'}</div>`;
    return;
  }
  const disp=dispCur(),rows=[...prRows];rows.forEach(x=>{x._p=conv(+x.unit_price,x.currency||'ARS',disp)});
  const ex=rows.some(x=>x.is_exact),cand=rows.filter(x=>(!ex||x.is_exact)&&x._p!=null).map(x=>x._p),min=cand.length?Math.min(...cand):0;
  rows.sort({price:(a,c)=>(c.is_exact-a.is_exact)||((a._p??1e18)-(c._p??1e18)),near:(a,c)=>(a.distance_km??1e9)-(c.distance_km??1e9),recent:(a,c)=>c.purchased_at.localeCompare(a.purchased_at)}[psort]);
  const n=new Set(rows.map(x=>x.store.toLowerCase()+'|'+(x.store_address||''))).size;
  b.innerHTML=`<div class="mu" style="margin:4px 0 8px">${n} local${n===1?'':'es'}${useR?` a menos de ${r} km`:''} ${prCat||!min?'':` · desde <b class="num">${money(min,disp)}</b>`}</div>${prNote()}
  <div class="chips">${[['price','Más barato'],['near','Más cerca'],['recent','Más reciente']].map(([k,l])=>`<button class="chip ${psort===k?'on':''}" onclick="psort='${k}';pRender('${q}',${r},${useR})">${l}</button>`).join('')}</div>${rows.map(prCard(min,ex)).join('')}`;
}

/* ---------- History ---------- */
async function history(silent){
  if(!silent){if(lastH.history){app(lastH.history);curH=lastH.history}else app('<p class="mu">Cargando…</p>')}
  const {data:rs=[],error}=await sb.from('receipts').select('*').order('purchased_at',{ascending:false}).limit(100);
  if(error)return silent?0:app(`<div class="card">${esc(error.message)}</div>`);
  show('history',`<h1>Mis compras</h1>${rs.length?rs.map(r=>`<div class="card" id="r${r.id}"><div class="row" style="border:0;cursor:pointer" onclick="detail('${r.id}','${r.currency||'ARS'}')"><span><b>${esc(r.store)}</b>${r.doc_type==='factura'?` <span class="tag">📄 Factura${r.doc_number?' '+esc(r.doc_number):''}</span>`:''}${r.store_address?`<br><span class="mu">${esc(r.store_address)}</span>`:''}<br><span class="mu">${r.purchased_at}</span>${r.description?`<br><span class="mu">${esc(r.description)}</span>`:''}</span><span style="display:flex;align-items:center;gap:6px"><a href="https://www.google.com/maps/search/?api=1&query=${(r.store_lat!=null?r.store_lat+','+r.store_lng:encodeURIComponent(r.store_address?r.store+' '+r.store_address:r.store))}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="Ver ubicación en Google Maps" title="Ver en Google Maps" style="font-size:1.4rem;text-decoration:none;padding:4px">📍</a><b class="num">${money(r.total,r.currency)}</b></span></div><div id="d${r.id}"></div></div>`).join(''):'<div class="empty">Acá van a aparecer tus compras.</div>'}`,silent);
}
async function detail(id,cur){
  const box=$('#d'+id);
  if(box.innerHTML){box.innerHTML='';return}
  const {data:its=[]}=await sb.from('receipt_items').select('*').eq('receipt_id',id);
  box.innerHTML=its.map(i=>`<div class="row"><span>${CAT[i.category]||'🛒'} ${esc(i.name)} <span class="mu">×${i.qty}</span></span><span class="num">${money(i.total_price,cur)}</span></div>`).join('')+`<p><button class="ghost" onclick="editR('${id}')">✏️ Editar compra</button> <button class="x" onclick="del('${id}')">Eliminar compra</button></p>`;
}
async function editR(id){
  const [{data:r},{data:its=[]},{data:pp=[]}]=await Promise.all([sb.from('receipts').select('*').eq('id',id).single(),sb.from('receipt_items').select('*').eq('receipt_id',id),sb.from('price_points').select('lat,lng').eq('receipt_id',id).limit(1)]);
  if(!r)return toast('No se pudo cargar la compra');
  mapShown=!!r.store_address;
  draft={id,currency:r.currency||'ARS',docType:r.doc_type==='factura'?'factura':'ticket',docNumber:r.doc_number||'',taxId:r.store_tax_id||'',store:r.store,date:r.purchased_at,description:r.description||'',address:r.store_address||'',lat:r.store_lat!=null?r.store_lat:(pp[0]?pp[0].lat:null),lng:r.store_lat!=null?r.store_lng:(pp[0]?pp[0].lng:null),items:its.map(i=>({name:i.name,qty:Number(i.qty),total_price:Number(i.total_price),category:i.category||'otros',subcategory:i.subcategory||''}))};
  form();
}
async function del(id){
  if(!confirm('¿Eliminar esta compra?'))return;
  const {error}=await sb.from('receipts').delete().eq('id',id);
  if(error)return toast(error.message);
  lastH.home=lastH.history=null;history();
}

/* ---------- Settings ---------- */
function settings(){
  app(`<h1>Ajustes</h1><div class="card"><h2 style="margin-top:0">Lectura de tickets</h2>
  <p class="mu">Clave de Gemini (se guarda solo en este dispositivo).</p>
  <input id="gk" type="password" placeholder="Clave de Gemini" value="${esc(localStorage.getItem('gk')||'')}"><p><button onclick="localStorage.setItem('gk',$('#gk').value.trim());toast('Clave guardada')">Guardar clave</button></p></div>
  <div class="card"><h2 style="margin-top:0">Monedas</h2><p class="mu" style="margin-top:0">Mostrar los totales en:</p><div class="chips">${Object.keys(CUR).map(c=>`<button class="chip ${dispCur()===c?'on':''}" onclick="localStorage.setItem('disp','${c}');lastH.home=null;settings()">${CUR[c].flag} ${CUR[c].name}</button>`).join('')}</div>
  <p class="mu">Tipos de cambio (cuántos pesos vale cada moneda). Sirven para sumar compras hechas en distintas monedas.</p>
  <div class="fields"><input id="fxu" type="number" step="any" inputmode="decimal" placeholder="1 US$ = ? pesos" value="${(fxr()||{}).USD||''}"><input id="fxb" type="number" step="any" inputmode="decimal" placeholder="1 R$ = ? pesos" value="${(fxr()||{}).BRL||''}"></div>
  <p><button onclick="saveFx()">Guardar</button> <button class="ghost" onclick="autoFxBtn()">Buscar cotización oficial</button></p>
  <p class="mu">${fxr()?`Última actualización: ${new Date(fxr().t).toLocaleString('es-AR')} (${fxr().src==='manual'?'manual':'automática, tipo de cambio oficial'}).`:'Sin tipos de cambio cargados.'} Si usás otro dólar (blue, MEP), cargalo a mano.</p></div>
  <div class="card"><h2 style="margin-top:0">Búsqueda inteligente</h2><label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" style="width:auto;margin-top:4px" ${localStorage.getItem('ai')!=='0'?'checked':''} onchange="localStorage.setItem('ai',this.checked?'1':'0')"><span>Usar IA para encontrar productos relacionados (por ejemplo, buscar "malbec" también muestra Nicasia). <span class="mu">Usa tu clave de Gemini y envía solo el texto que buscás.</span></span></label></div>
  <div class="card"><h2 style="margin-top:0">Precios compartidos</h2><label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" style="width:auto;margin-top:4px" ${localStorage.getItem('share')!=='0'?'checked':''} onchange="localStorage.setItem('share',this.checked?'1':'0')"><span>Compartir mis precios de forma anónima con otros usuarios <span class="mu">(producto, precio, local y fecha; nunca tu nombre ni tu email). Se aplica a los tickets que cargues desde ahora.</span></span></label></div>
  <div class="card"><h2 style="margin-top:0">Google Maps (opcional)</h2><p class="mu">Con una clave con Maps JavaScript API, Places API (New) y Geocoding API activadas, podés buscar el local con sugerencias, ver los más cercanos y confirmar la ubicación con un pin. Sin clave se muestra un mapa simple.</p><input id="mk" type="password" placeholder="Clave de Google Maps" value="${esc(localStorage.getItem('mk')||'')}"><p><button onclick="localStorage.setItem('mk',$('#mk').value.trim());toast('Clave guardada')">Guardar clave</button></p></div>
  <div class="card"><h2 style="margin-top:0">Ayuda</h2><p class="mu" style="margin-top:0">Guía de uso y recorrido guiado de la app.</p><div class="mact" style="margin-top:8px"><button onclick="go('help')">❓ Guía de uso</button><button class="ghost" onclick="tourStart(true)">▶ Ver el recorrido guiado</button></div></div>
  ${installCard()}
  <div class="card"><h2 style="margin-top:0">Comentarios</h2><p class="mu" style="margin-top:0">¿Encontraste un error o tenés una idea? Contanos y te damos un número de ticket.</p><div class="mact" style="margin-top:8px"><button onclick="openFeedback()">💬 Enviar comentarios</button></div><div id="fbl"></div></div>
  <div class="card"><div class="mu">${esc(user.email)}</div><p><button class="ghost" onclick="window._manualOut=true;clearBk();sb.auth.signOut().then(boot)">Cerrar sesión</button></p></div>`);
  fbList();
}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* ---------- Refresco silencioso y auto-actualización ---------- */
const APP_VER=document.querySelector('meta[name=app-version]').content;
function refresh(){
  if(document.hidden||!user||draft||!safe())return;
  if(view==='home')home(true);else if(view==='history')history(true);
}
async function checkUpdate(){
  try{
    const t=await (await fetch(location.pathname,{cache:'no-store'})).text();
    const m=/name="app-version" content="([^"]+)"/.exec(t);
    if(m&&m[1]!==APP_VER)pendingReload=true;
  }catch(e){}
}
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden)return;
  checkSession();
  await checkUpdate();
  if(pendingReload&&!draft&&view!=='scan'&&safe()){sessionStorage.setItem('goto',view);location.reload();return}
  refresh();
});
addEventListener('focus',refresh);
setInterval(refresh,30000);
setInterval(checkUpdate,300000);
boot();checkUpdate();
</script>
