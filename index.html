async function loadSharedSearchVotes(force){
  if(!force&&window._sharedSearchVotes.loadedAt&&Date.now()-window._sharedSearchVotes.loadedAt<15000){
    return window._sharedSearchVotes;
  }
  let counts={}, myVotes={}, pairs=[], loadedViaApi=false;
  try{
    const uid=user?.id?encodeURIComponent(user.id):'';
    const r=await fetch(`/api/canasta/search-votes${uid?`?userId=${uid}`:''}`);
    if(r.ok){
      const j=await r.json();
      if(j&&typeof j.counts==='object'){
        counts=j.counts||{};
        myVotes=j.myVotes||{};
        pairs=Array.isArray(j.pairs)?j.pairs:[];
        loadedViaApi=true;
      }
    }
  }catch(_){}
  if(!loadedViaApi&&sb){
    try{
      const {data}=await sb.from('feedback')
        .select('id,user_id,screen,status,message,diagnostics,created_at')
        .in('screen',['prices_thumb_up','prices_mismatch'])
        .order('created_at',{ascending:false})
        .limit(500);
      const seenUserPair=new Set();
      const pairMeta={};
      for(const row of (Array.isArray(data)?data:[])){
        const d=row?.diagnostics||{};
        const qRaw=String(d.query||'').trim(), pRaw=String(d.product||'').trim();
        const qN=nk(qRaw), pN=nk(pRaw);
        if(!qN||!pN)continue;
        const pairKey=`${qN}|||${pN}`;
        const isUp=row.screen==='prices_thumb_up'||d.is_accurate===true;
        const voteType=isUp?'up':'down';
        const voterKey=`${row.user_id||row.id}::${pairKey}`;
        if(!pairMeta[pairKey]){
          pairMeta[pairKey]={key:pairKey,query:qRaw,product:pRaw,up:0,down:0,stores:new Set(),notes:[],lastAt:row.created_at||'',unresolvedIds:[]};
        }
        if(d.store)pairMeta[pairKey].stores.add(String(d.store));
        if(d.note&&!pairMeta[pairKey].notes.includes(String(d.note)))pairMeta[pairKey].notes.push(String(d.note));
        if(!isUp&&row.status!=='resuelto'&&row.id)pairMeta[pairKey].unresolvedIds.push(row.id);
        if(seenUserPair.has(voterKey))continue;
        seenUserPair.add(voterKey);
        if(!counts[pairKey])counts[pairKey]={up:0,down:0};
        if(isUp){counts[pairKey].up++;pairMeta[pairKey].up++;}
        else{counts[pairKey].down++;pairMeta[pairKey].down++;}
        if(user?.id&&row.user_id&&String(row.user_id)===String(user.id))myVotes[pairKey]=voteType;
      }
      pairs=Object.values(pairMeta)
        .filter(x=>x.down>0||x.unresolvedIds.length>0)
        .map(x=>({...x,stores:Array.from(x.stores),resolved:x.unresolvedIds.length===0}))
        .sort((a,b)=>(b.down-a.down)||(b.unresolvedIds.length-a.unresolvedIds.length));
    }catch(_){}
  }
  window._sharedSearchVotes={counts,myVotes,pairs,loadedAt:Date.now()};
  return window._sharedSearchVotes;
}
function getResultVoteStats(q,prod){
  const pairKey=`${nk(q||'')}|||${nk(prod||'')}`;
  const serverCounts=(window._sharedSearchVotes?.counts||{})[pairKey]||{up:0,down:0};
  const serverMyVote=(window._sharedSearchVotes?.myVotes||{})[pairKey]||null;
  const localMyVote=getSearchResultVotes()[pairKey]||null;
  let up=Number(serverCounts.up)||0;
  let down=Number(serverCounts.down)||0;
  if(localMyVote&&localMyVote!==serverMyVote){
    if(serverMyVote==='up')up=Math.max(0,up-1);
    else if(serverMyVote==='down')down=Math.max(0,down-1);
    if(localMyVote==='up')up++;
    else if(localMyVote==='down')down++;
  }
  return {up,down,myVote:localMyVote||serverMyVote||''};
}

const SEARCH_STOPWORDS=new Set(['de','del','la','el','los','las','en','y','o','a','al','con','sin','por','para','un','una','unos','unas','x']);
const HARDWARE_FERRETERIA_TERMS=['bujia','bujias','calef','calefon','emege','cable encendido','encendido','chispero','capuchon','aislante','terminal','sanitario','ferreteria','repuesto','herramienta'];
function significantQueryWords(qNorm){
  const raw=nk(qNorm||'').split(/\s+/).filter(w=>w.length>=2);
  const clean=raw.filter(w=>!SEARCH_STOPWORDS.has(w));
  return clean.length?clean:raw;
}
window.SEARCH_STOPWORDS=SEARCH_STOPWORDS;
window.significantQueryWords=significantQueryWords;

function getQuerySynonyms(qNorm){
  const syns=new Set();
  const eq=getAdminEquivsMap();
  const ac=getAdminAcronymsMap();
  const addSyns=(term)=>{
    if(!term||SEARCH_STOPWORDS.has(term))return;
    if(SUPERMARKET_SYNONYMS[term])SUPERMARKET_SYNONYMS[term].forEach(s=>syns.add(nk(s)));
    if(SUPERMARKET_ACRONYMS[term])SUPERMARKET_ACRONYMS[term].forEach(s=>syns.add(nk(s)));
    if(eq[term])eq[term].forEach(s=>syns.add(nk(s)));
    if(ac[term])ac[term].forEach(s=>syns.add(nk(s)));
    for(const [k,list] of Object.entries(eq)){
      if(list.includes(term))syns.add(k);
    }
    for(const [k,list] of Object.entries(ac)){
      if(list.includes(term))syns.add(k);
    }
  };
  addSyns(qNorm);
  const words=significantQueryWords(qNorm);
  for(const w of words)addSyns(w);
  return Array.from(syns);
}

function getExclusionReason(qNorm,p){
  const pName=nk(p.product||p.product_name||'');
  const pCat=nk(p.category||'');
  const pSub=nk(p.subcategory||'');
  const adminEx=getAdminExclusionsMap();
  const checkList=(list)=>{
    if(!list)return false;
    for(const exc of list){
      if(exc&&!qNorm.includes(exc)&&(pName.includes(exc)||pSub.includes(exc)))return true;
    }
    return false;
  };
  if(checkList(adminEx[qNorm]))return 'Excluido por Admin';
  const qWords=significantQueryWords(qNorm);
  for(const w of qWords){
    if(checkList(adminEx[w]))return 'Excluido por Admin';
    const excList=UNRELATED_TERM_EXCLUSIONS[w];
    if(excList){
      for(const exc of excList){
        if(!qNorm.includes(exc)){
          if(pName.includes(exc)||pSub.includes(exc))return 'Producto no relacionado';
        }
      }
      if(w==='leche'&&!qNorm.includes('golosina')&&!qNorm.includes('chocolate')){
        if(pCat==='golosinas'||pCat==='limpieza'||pName.includes('golosina')||pName.includes('wafer')||pName.includes('turron')||pName.includes('biscuit')||pName.includes('shampoo')||pName.includes('nugaton'))return 'Producto no relacionado';
      }
    }
  }
  const isHardwareQuery=HARDWARE_FERRETERIA_TERMS.some(hw=>qNorm.includes(hw));
  if(!isHardwareQuery&&(pSub==='bazar y ferreteria'||HARDWARE_FERRETERIA_TERMS.some(hw=>pName.includes(hw)||pSub.includes(hw)))){
    return 'Producto no relacionado (ferretería)';
  }
  for(const grp of PRODUCT_EXCLUSIVE_VARIANTS){
    const hasQ=grp.filter(v=>qNorm.includes(v));
    const hasP=grp.filter(v=>pName.includes(v)||pSub.includes(v));
    if(hasQ.length&&hasP.length&&!hasQ.some(v=>hasP.includes(v))){
      return `Variante distinta (${hasP[0]})`;
    }
  }
  return '';
}

function smartSearchPrices(rawRows,q,opts={}){
  const qNorm=nk(q);
  if(!qNorm)return [];
  const includeExcluded=!!(opts&&opts.includeExcluded);
  const qWords=significantQueryWords(qNorm);
  const synonyms=getQuerySynonyms(qNorm);
  const eq=getAdminEquivsMap();
  const ac=getAdminAcronymsMap();
  const aliases=getAdminProductAliases();
  const adminTargets=new Set([...(eq[qNorm]||[]),...(ac[qNorm]||[])]);
  for(const w of qWords){
    if(eq[w])eq[w].forEach(t=>adminTargets.add(t));
    if(ac[w])ac[w].forEach(t=>adminTargets.add(t));
  }
  for(const [k,list] of Object.entries(ac)){
    if(list.some(v=>qNorm.includes(v)||v.includes(qNorm)))adminTargets.add(k);
  }

  const scored=[];
  for(const origP of rawRows){
    const p={...origP};
    const rawTitle=p.product||p.product_name||'';
    const pName=nk(rawTitle);
    const alias=aliases[pName];
    const meta=parseDescriptionKeyMeta(p.description_key);
    const structured=parseStructuredProductText(rawTitle,{
      brand:p.brand||alias?.brand,
      variant:p.variant||alias?.variant,
      size_value:p.size_value!=null&&p.size_value!==''?p.size_value:alias?.size_value,
      size_unit:p.size_unit||alias?.size_unit,
      package_type:p.package_type||alias?.package_type||meta.packageType,
      pack_count:p.pack_count||meta.packCount,
      base_name:p.base_name||meta.baseName
    });
    p.base_name=structured.base_name;
    p.brand=p.brand||alias?.brand||structured.brand||'';
    p.variant=p.variant||alias?.variant||structured.variant||'';
    p.size_value=p.size_value!=null&&p.size_value!==''?Number(p.size_value):structured.size_value;
    p.size_unit=normalizeSizeUnit(p.size_unit)||structured.size_unit||'';
    p.package_type=p.package_type||alias?.package_type||meta.packageType||structured.package_type||'';
    p.pack_count=Math.max(1,Number(p.pack_count)||meta.packCount||structured.pack_count||1);

    const resolvedH=resolveItemHierarchy({
      ...p,
      category:alias?.category||p.category,
      subcategory:alias?.subcategory||p.subcategory,
      store_category:alias?.storeCategory||p.store_category||meta.storeCategory
    });
    p.category=alias?.category||resolvedH.category||'otros';
    p.subcategory=alias?.subcategory||resolvedH.subcategory||'';
    p.store_category=normalizeStoreCategory(alias?.storeCategory||resolvedH.rubro)||meta.storeCategory||inferStoreCategory(p.store,[p]);
    p.rubro=p.store_category;
    p.sub_tags=getTagsForSubcategory(p.category,p.subcategory);

    const pNormName=alias?.normalizedName?nk(alias.normalizedName):'';
    const pAliasTags=alias?.tags?nk(alias.tags):'';
    const pSub=nk(p.subcategory||'');
    const pCat=nk(p.category||'');
    const pStoreCat=nk(p.store_category||'');
    const pSubTags=p.sub_tags.join(' ');
    const pDesc=nk(p.description||'');
    const pDescClean=nk(meta.cleanText||'');
    const pBrand=nk(p.brand||'');
    const pVariant=nk(p.variant||'');
    const pBase=nk(p.base_name||'');
    const pSizeTok=(p.size_value&&p.size_unit)?nk(`${p.size_value}${p.size_unit} ${p.size_value} ${p.size_unit}`):'';
    const pPkg=nk(p.package_type||'');
    const pTags=Array.isArray(p.tags)?p.tags.map(nk).join(' '):nk(p.tags||'');

    const pExpandedTokens=[];
    for(const pw of `${pName} ${pBase}`.split(/\s+/).filter(Boolean)){
      if(ac[pw])ac[pw].forEach(t=>pExpandedTokens.push(t));
      if(SUPERMARKET_ACRONYMS[pw])SUPERMARKET_ACRONYMS[pw].forEach(t=>pExpandedTokens.push(nk(t)));
    }
    const fullText=`${pName} ${pBase} ${pNormName} ${pAliasTags} ${pSubTags} ${pBrand} ${pVariant} ${pSizeTok} ${pPkg} ${pSub} ${pCat} ${pStoreCat} ${pDesc} ${pDescClean} ${pTags} ${pExpandedTokens.join(' ')}`;
    const pMult=Math.max(extractPackMultiplier(pName),p.pack_count||1);

    p.pack_multiplier=pMult;
    p.comparable_price=computeComparableUnitPrice({
      unit_price:p.unit_price,
      size_value:p.size_value,
      size_unit:p.size_unit,
      pack_count:p.pack_count,
      category:p.category,
      product_name:rawTitle
    });
    if(alias?.normalizedName)p.normalized_label=alias.normalizedName;
    if(alias?.tags)p.custom_tags=alias.tags;

    const exclReason=getExclusionReason(qNorm,p);
    if(exclReason&&!includeExcluded)continue;

    const qIntentCat=getQueryCategoryIntent(qNorm);
    const qHasUnit=qWords.some(w=>/^\d+(?:[.,]\d+)?(?:l|lt|ml|cc|g|gr|kg|k)$/.test(w));

    let score=0;
    let confidence='baja';
    let matchType='';

    if(pName.includes(qNorm)||(pNormName&&pNormName.includes(qNorm))){
      score=100;
      confidence='alta';
      matchType='exacto';
    }else if(qWords.length>0&&qWords.every(qw=>fullText.includes(qw))){
      score=88;
      confidence='alta';
      matchType='tokens_completos';
    }else if(Array.from(adminTargets).some(t=>t&&fullText.includes(t))){
      score=86;
      confidence='alta';
      matchType='regla_admin';
    }else if(synonyms.some(syn=>fullText.includes(syn))){
      score=80;
      confidence='alta';
      matchType='sinonimo';
    }else{
      const pWords=fullText.split(/\s+/).filter(w=>w.length>=3&&!SEARCH_STOPWORDS.has(w));
      let matchedCount=0;
      let hasFuzzy=false;
      let fuzzyMatchedWord='';

      for(const qw of qWords){
        const qwPhon=phoneticNk(qw);
        if(pWords.some(pw=>pw.includes(qw)||qw.includes(pw))){
          matchedCount++;
        }else if(qw.length>=3){
          const fWord=pWords.find(pw=>{
            const pwPhon=phoneticNk(pw);
            if(qwPhon===pwPhon)return true;
            const maxDist=qw.length<=4?1:2;
            if(Math.abs(pw.length-qw.length)<=maxDist&&levenshteinDistance(qw,pw)<=maxDist)return true;
            if(qwPhon.length>=4&&pwPhon.length>=4&&Math.abs(pwPhon.length-qwPhon.length)<=1&&levenshteinDistance(qwPhon,pwPhon)<=1)return true;
            return false;
          });
          if(fWord){
            matchedCount++;
            hasFuzzy=true;
            if(!fuzzyMatchedWord)fuzzyMatchedWord=fWord;
          }
        }
      }

      const matchRatio=qWords.length?(matchedCount/qWords.length):0;
      if(matchRatio>=0.75){
        score=hasFuzzy?72:75;
        confidence='alta';
        matchType=hasFuzzy?'fuzzy':'parcial_alto';
      }else if(matchRatio>=0.5){
        score=55;
        confidence='media';
        matchType='parcial_medio';
      }else{
        score=25;
        confidence='baja';
        matchType='debil';
      }
      if(hasFuzzy&&fuzzyMatchedWord)p.fuzzy_matched_word=fuzzyMatchedWord;
    }

    if(score>=40){
      if(qIntentCat&&pCat===qIntentCat)score=Math.min(100,score+4);
      if(qHasUnit&&pSizeTok&&qWords.some(w=>pSizeTok.includes(w)))score=Math.min(100,score+3);
    }

    if(exclReason){
      p.is_exact=false;
      p.is_excluded=true;
      p.exclude_reason=exclReason;
      p.search_score=score;
      p.search_confidence='baja';
      p.search_match_type='excluido';
      if(includeExcluded)scored.push(p);
      continue;
    }

    if(score>=40){
      p.is_exact=score>=80;
      p.is_excluded=false;
      p.exclude_reason='';
      p.search_score=score;
      p.search_confidence=confidence;
      p.search_match_type=matchType;
      p.fuzzy_match=matchType==='fuzzy';
      scored.push(p);
    }else if(includeExcluded&&score>=25){
      p.is_exact=false;
      p.is_excluded=true;
      p.exclude_reason='Coincidencia débil';
      p.search_score=score;
      p.search_confidence='baja';
      p.search_match_type=matchType;
      scored.push(p);
    }
  }

  scored.sort((a,b)=>{
    if(!!a.is_excluded!==!!b.is_excluded)return a.is_excluded?1:-1;
    if(b.search_score!==a.search_score)return b.search_score-a.search_score;
    return (a.unit_price||0)-(b.unit_price||0);
  });

  return scored;
}

function filterRowsByPrFacets(list,facets=prFacets){

      else if(bNorm!==facets.brand)return false;

    if(facets.store){
      if(nk(item.store||'')!==facets.store)return false;

    if(facets.sizeBucket){
      if(getSizeBucketForItem(item)!==facets.sizeBucket)return false;
    }
    if(facets.freshDays){
      const d=days(item.purchased_at);
      if(!Number.isFinite(d)||d>Number(facets.freshDays))return false;

    }
    return true;
  });

    if(maxP>minP*1.25){
      const p33=Math.round(pricePool[Math.floor((pricePool.length-1)*0.33)]/50)*50||minP;
      const p66=Math.round(pricePool[Math.floor((pricePool.length-1)*0.66)]/50)*50||maxP;
      if(p33>minP)priceBands.push({label:`Hasta $${p33.toLocaleString('es-AR')}`,min:'',max:String(p33)});
      if(p66>p33)priceBands.push({label:`$${p33.toLocaleString('es-AR')} – $${p66.toLocaleString('es-AR')}`,min:String(p33),max:String(p66)});
      if(maxP>p66)priceBands.push({label:`Más de $${p66.toLocaleString('es-AR')}`,min:String(p66),max:''});
    }
  }

  return {base,rubroCounts,validCats,catCounts,subCounts,tagCounts,brandList,storeList,sizeCounts,freshCounts,priceBands};
}

function highlightSearchTerms(text,q){
  const raw=String(text||'');
  const words=significantQueryWords(nk(q||'')).filter(w=>w.length>=2);
  if(!words.length)return esc(raw);
  const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const pat=new RegExp('('+words.map(escRe).join('|')+')','ig');
  const parts=raw.split(pat);
  const lowerSet=new Set(words.map(w=>w.toLowerCase()));
  return parts.map(part=>lowerSet.has(nk(part))?`<mark class="hl">${esc(part)}</mark>`:esc(part)).join('');
}

function renderLiveSuggestions(q){
  const box=$('#pr-live-list');
  if(!box)return;
  const qNorm=nk(q||'');
  if(qNorm.length<2){box.innerHTML='';return;}
  const pool=getLiveCatalogPool();
  let matches=smartSearchPrices(pool,qNorm,{includeExcluded:false});
  matches=filterRowsByPrFacets(matches,prFacets);

  // Hybrid department/category shortcuts (Amazon/ML style)
  const deptMap=new Map();
  matches.forEach(m=>{
    const h=resolveItemHierarchy(m);
    if(!h.category)return;
    const key=`${h.category}|||${h.subcategory||''}`;
    const prev=deptMap.get(key)||{cat:h.category,sub:h.subcategory||'',count:0};
    prev.count++;
    deptMap.set(key,prev);
  });
  const deptShortcuts=[...deptMap.values()].sort((a,b)=>b.count-a.count).slice(0,2);

  const unique=[];
  const seenProd=new Set();
  for(const m of matches){
    const key=nk(m.product||'');
    if(!key||seenProd.has(key))continue;
    seenProd.add(key);
    unique.push(m);
    if(unique.length>=6)break;
  }
  if(!unique.length){box.innerHTML='';return;}
  box.innerHTML=`
    <div class="live-sugg">
      <div style="font-size:.72rem;font-weight:800;color:#15803d;margin-bottom:4px;display:flex;justify-content:space-between">
        <span>⚡ Productos disponibles que coinciden</span>
        <span class="mu">${matches.length} precio${matches.length===1?'':'s'}</span>
      </div>
      ${deptShortcuts.map(d=>`
        <div class="live-sugg-cat" onclick="selectLiveCategoryShortcut('${esc(q)}','${esc(d.cat)}','${esc(d.sub)}')">
          <span>🔍 Buscar <b>"${esc(q)}"</b> en <b>${CAT[d.cat]||'🛒'} ${esc(d.cat)}${d.sub?' › '+esc(d.sub):''}</b></span>
          <span class="mu num">(${d.count})</span>
        </div>
      `).join('')}
      ${unique.map(m=>{
        const scInfo=getStoreCatInfo(m.store_category);
        const hPath=[`${scInfo.icon} ${scInfo.label}`,m.category,m.subcategory].filter(Boolean).join(' › ');
        const comp=m.comparable_price||computeComparableUnitPrice({unit_price:m.unit_price,size_value:m.size_value,size_unit:m.size_unit,pack_count:m.pack_count,category:m.category,product_name:m.product});
        return `<div class="live-sugg-item" onclick="selectLiveProduct('${encodeURIComponent(m.product)}')">
          <div style="min-width:0;flex:1">
            <div title="${esc(m.product)}" style="font-size:.83rem;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${highlightSearchTerms(m.product,q)}</div>
            <div class="mu" style="font-size:.7rem">${esc(hPath)} · ${esc(m.store)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <b class="num" style="font-size:.86rem;color:#15803d;display:block">${money(+m.unit_price,m.currency||'ARS')}</b>
            ${comp&&comp.perKgOrL&&comp.unitLabel?`<span class="mu num" style="font-size:.66rem">${money(comp.perKgOrL,m.currency||'ARS')}/${comp.unitLabel}</span>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

async function pGo(save){
  const q=nk($('#pq').value),tok=++pTok,b=$('#pbody');
  updatePrClearBtn();

    const mapRawRows=(raw,t)=>{
      return (raw||[]).map(p=>{
        const dkm=(pos&&p.lat!=null)?hav(pos,{lat:p.lat,lng:p.lng}):null;
        const meta=parseDescriptionKeyMeta(p.description_key);
        const baseObj={
          product:p.product||p.product_name||'',
          unit_price:p.unit_price,
          currency:p.currency||'ARS',
          store:p.store,
          store_address:p.store_address,
          lat:p.lat,
          lng:p.lng,
          category:p.category,
          subcategory:p.subcategory,
          description:p.description,
          description_key:p.description_key,
          brand:p.brand||'',
          variant:p.variant||'',

          size_unit:p.size_unit||'',

          pack_count:meta.packCount||1,
          base_name:meta.baseName||'',
          store_category:p.store_category||meta.storeCategory||inferStoreCategory(p.store,[p]),
          purchased_at:p.purchased_at,
          is_exact:t?nk(p.product_key||p.product||p.product_name).includes(nk(t)):true,
          distance_km:dkm!=null?dkm:(p.distance_km??null),
          tags:p.tags||p.description_key
        };
        const h=resolveItemHierarchy(baseObj);
        return {...baseObj,category:h.category,subcategory:h.subcategory,store_category:h.rubro,rubro:h.rubro,sub_tags:h.subTags};
      });
    };
    const rpcQ=async(t,c)=>{
      let collected=[];
      const seenRows=new Set();
      const pushRows=(list)=>{
        for(const item of list||[]){
          const k=pk(item)+'|'+(item.unit_price||0);
          if(seenRows.has(k))continue;
          seenRows.add(k);
          collected.push(item);
        }
      };
      if(t&&t.length>=2){
        try{
          const res=await T(sb.rpc('search_prices',{q:t,user_lat:pos?pos.lat:null,user_lng:pos?pos.lng:null,radius_km:useR?r:null,cat:c||null}),9000);
          if(!res.error&&Array.isArray(res.data)){
            pushRows(res.data);
            if(collected.length>=8)return {data:collected,error:null};
          }
        }catch(e){}
      }
      try{
        if(typeof fetch==='function'&&!/github\.io$/i.test(location?.hostname||'')){
          const qs=new URLSearchParams({q:t||'',cat:c||prFacets.category||''});
          if(prFacets.rubro)qs.set('rubro',prFacets.rubro);
          if(prFacets.subcategory)qs.set('sub',prFacets.subcategory);
          if(pos){qs.set('lat',String(pos.lat));qs.set('lng',String(pos.lng));}
          if(useR&&r>0)qs.set('radiusKm',String(r));
          const apiRes=await fetch('/api/canasta/search-prices?'+qs.toString());
          if(apiRes.ok){
            const j=await apiRes.json();
            if(Array.isArray(j?.data)&&j.data.length){
              pushRows(mapRawRows(j.data,t));
              if(collected.length>=8)return {data:collected,error:null};
            }
          }
        }
      }catch(e){}
      try{
        let qb=sb.from('price_points').select('*');
        if(c||prFacets.category)qb=qb.eq('category',c||prFacets.category);
        else if(t&&t.length>=2){
          const tNorm=nk(t);
          const synList=getQuerySynonyms(tNorm).slice(0,4);
          const tokenPrefixes=[];
          for(const w of significantQueryWords(tNorm).slice(0,4)){
            tokenPrefixes.push(w);
            if(w.length>=4)tokenPrefixes.push(w.slice(0,3));
            const ph=phoneticNk(w);
            if(ph.length>=3&&ph!==w)tokenPrefixes.push(ph.slice(0,Math.min(4,ph.length)));
          }
          const terms=[...new Set([...tokenPrefixes,...synList].filter(tm=>tm&&!SEARCH_STOPWORDS.has(tm)))].slice(0,8);
          if(terms.length){
            const conds=terms.map(tm=>`product_key.ilike.*${tm}*,subcategory.ilike.*${tm}*,product_name.ilike.*${tm}*,description_key.ilike.*${tm}*,brand.ilike.*${tm}*,variant.ilike.*${tm}*`).join(',');
            qb=qb.or(conds);
          }
        }
        const {data:raw,error:err2}=await T(qb.order('unit_price',{ascending:true}).limit(90),9000);
        if(!err2&&Array.isArray(raw))pushRows(mapRawRows(raw,t));
      }catch(e){}
      if(!c&&collected.length<8){
        try{
          const {data:recentRaw,error:err3}=await T(sb.from('price_points').select('*').order('purchased_at',{ascending:false}).limit(150),9000);
          if(!err3&&Array.isArray(recentRaw))pushRows(mapRawRows(recentRaw,t));
        }catch(e){}
      }
      return {data:collected,error:null};
    };

    if(q.length<2&&facetActive){
      await loadLiveCatalogPool();
      const catRows=getLiveCatalogPool();
      const rawFetched=(catRows.length?catRows:(await rpcQ('',prFacets.category)).data)||[];
      if(tok!==pTok)return;
      prRows=rawFetched.map(x=>{
        const h=resolveItemHierarchy(x);
        return {...x,category:h.category,subcategory:h.subcategory,store_category:h.rubro,rubro:h.rubro,sub_tags:h.subTags,is_exact:true,is_excluded:false,exclude_reason:'',search_confidence:'alta',search_score:90};
      });

    }

    const cat=catOf(q),was=prCat;prCat=!!cat;if(prCat!==was)psort=prCat?(pos?'near':'recent'):'price';
    const aiOn=!cat&&!!gemKey()&&localStorage.getItem('ai')!=='0';
    prAI=aiOn?'loading':(cat||gemKey()?'off':'nokey');prTerms=[];
    const exP=aiOn?expand(q).catch(()=>[]):null;
    const cleanStem=significantQueryWords(q).map(stemW).join(' ')||stemQ(q);

    if(tok!==pTok)return;
    if(error){b.innerHTML=`<div class="card">No se pudo buscar: ${esc(error.message)}</div>`;return}

    const cleanRows=smartSearchPrices(data||[],q,{includeExcluded:true});

    if(save&&prRows.some(x=>!x.is_excluded))localStorage.setItem('rs',JSON.stringify([q,...recents().filter(x=>x!==q)].slice(0,6)));
    renderPreciosFacets(prRows);
    pRender(q,r,useR);
    if(!exP)return;
    const terms=await exP;
    if(tok!==pTok)return;
    if(!terms.length){prAI='done';pRender(q,r,useR);return}
    const res=await Promise.all(terms.map(t=>rpcQ(stemQ(t)).then(x=>{
      const tNorm=nk(t);
      const tWords=significantQueryWords(tNorm).filter(w=>w.length>=3);
      const rows=(x.data||[]).map(y=>{
        const exclR=getExclusionReason(q,y)||getExclusionReason(tNorm,y);
        const pName=nk(y.product||y.product_name||'');
        const pSub=nk(y.subcategory||'');
        if(!pName)return null;
        const matchesTerm=tWords.length>0&&tWords.every(tw=>pName.includes(tw)||pSub.includes(tw));
        if(!matchesTerm&&!exclR)return null;
        return {y,exclR};
      }).filter(Boolean);
      return {t,rows};
    },()=>({t,rows:[]}))) );
    if(tok!==pTok)return;
    const seen=new Set(prRows.map(pk));
    res.forEach(({t,rows})=>{let hit=false;rows.forEach(({y:x,exclR})=>{const k=pk(x);if(seen.has(k))return;seen.add(k);const meta=parseDescriptionKeyMeta(x.description_key);const st=parseStructuredProductText(x.product||x.product_name||'',{brand:x.brand,variant:x.variant,size_value:x.size_value,size_unit:x.size_unit,package_type:meta.packageType,pack_count:meta.packCount,base_name:meta.baseName});const h=resolveItemHierarchy(x);const isExcl=!!exclR;if(!isExcl)hit=true;prRows.push({...x,...st,category:h.category,subcategory:h.subcategory,store_category:h.rubro,rubro:h.rubro,sub_tags:h.subTags,is_exact:false,is_excluded:isExcl,exclude_reason:exclR||'',rel:isExcl?null:t})});if(hit)prTerms.push(t)});
    prAI='done';
    renderPreciosFacets(prRows);
    pRender(q,r,useR);
  }catch(err){
    console.error('Error en búsqueda de precios:',err);
    if(tok===pTok)b.innerHTML='<div class="empty">No se pudo completar la búsqueda. Probá de nuevo.</div>';
  }
}

function getComparableSortValue(x){
  if(!x)return null;
  const st=parseStructuredProductText(x.normalized_label||x.product||x.product_name||'',{
    size_value:x.size_value,size_unit:x.size_unit,pack_count:x.pack_count
  });
  const comp=x.comparable_price||computeComparableUnitPrice({
    unit_price:x._p!=null?x._p:x.unit_price,
    size_value:st.size_value,
    size_unit:st.size_unit,
    pack_count:st.pack_count,
    category:x.category,
    product_name:x.product||x.product_name
  });
  return (comp&&comp.perKgOrL)?comp.perKgOrL:(comp&&comp.perPackUnit?comp.perPackUnit:null);
}
function getRelevanceScore(x){
  if(!x)return 0;
  let score=Number(x.search_score||(x.is_exact!==false?85:55));
  const d=days(x.purchased_at);
  if(Number.isFinite(d)){
    if(d<=7)score+=6;
    else if(d<=30)score+=3;
  }
  const vs=getResultVoteStats(prCurrentQ||'',x.product||'');
  score+=Math.min(8,(vs.up||0)*2)-Math.min(12,(vs.down||0)*3);
  return score;
}
function sortPriceList(arr){
  if(psort==='near')arr.sort((a,c)=>(a.distance_km??1e9)-(c.distance_km??1e9)||((a._p??1e18)-(c._p??1e18)));
  else if(psort==='recent')arr.sort((a,c)=>String(c.purchased_at||'').localeCompare(String(a.purchased_at||''))||((a._p??1e18)-(c._p??1e18)));
  else if(psort==='unit')arr.sort((a,c)=>{
    const ua=getComparableSortValue(a), uc=getComparableSortValue(c);
    if((ua!=null)!==(uc!=null))return ua!=null?-1:1;
    if(ua!=null&&uc!=null&&ua!==uc)return ua-uc;
    return (a._p??1e18)-(c._p??1e18);
  });
  else if(psort==='rel')arr.sort((a,c)=>(getRelevanceScore(c)-getRelevanceScore(a))||((a._p??1e18)-(c._p??1e18)));
  else arr.sort((a,c)=>(c.is_exact-a.is_exact)||((a._p??1e18)-(c._p??1e18)));
}

function detectQueryIntentHints(qNorm){
  if(!qNorm)return [];
  const hints=[];
  const parsed=parseSizeAndUnit(qNorm);
  if(parsed.size_value&&parsed.size_unit){
    hints.push(`Tamaño: ${parsed.size_value} ${parsed.size_unit==='l'?'L':parsed.size_unit}`);
  }
  ['entera','descremada','deslactosada','sin azucar','zero','integral','sin palo','con palo','sin gas','con gas'].forEach(v=>{
    if(qNorm.includes(v))hints.push(`Variante: ${v}`);
  });
  return hints;
}

      if(activeOpt&&activeOpt.match)return list.filter(x=>activeOpt.match(x.product));
    }
    return list;
  };
  const applyRadius=(list)=>(useR&&r>0)?list.filter(x=>x.distance_km==null||x.distance_km<=r):list;

  let rows=applyRadius(filterRowsByPrFacets(applyDisambig([...prRows]),prFacets));

      if(noAttr.length){
        relaxed=noAttr;
        relaxTitle='No encontramos coincidencias exactas con los filtros de marca, comercio o precio.';
        relaxBtn=`<button type="button" class="ghost" onclick="prFacets.brand='';prFacets.store='';prFacets.sizeBucket='';prFacets.freshDays='';prFacets.priceMin='';prFacets.priceMax='';renderPreciosFacets();pRender('${esc(q)}',${r},${useR})" style="font-size:.76rem;padding:4px 10px;background:#fff">Quitar filtros de atributos</button>`;
      }
    }
    if(!relaxed.length&&(prFacets.tag||prFacets.subcategory)){
      const noSub=applyRadius(filterRowsByPrFacets(disRows,{...prFacets,subcategory:'',tag:'',brand:'',store:'',sizeBucket:'',freshDays:'',priceMin:'',priceMax:''}));
      if(noSub.length){
        relaxed=noSub;
        relaxTitle=`No encontramos resultados en "${esc(prFacets.tag||prFacets.subcategory)}".`;
        relaxBtn=`<button type="button" class="ghost" onclick="jumpToPrCrumbLevel('${prFacets.category?'category':'root'}')" style="font-size:.76rem;padding:4px 10px;background:#fff">Ampliar jerarquía</button>`;
      }
    }
    if(!relaxed.length&&useR&&r>0){
      const allDistPool=prRows.length?prRows:(qNorm.length>=2?smartSearchPrices(getLiveCatalogPool(),qNorm,{includeExcluded:false}):getLiveCatalogPool());
      const noRad=filterRowsByPrFacets(applyDisambig(allDistPool),prFacets);
      if(noRad.length){
        relaxed=noRad;
        isRadiusRelaxed=true;
        relaxTitle=`No encontramos resultados a menos de ${r} km.`;
        relaxBtn=`<button type="button" class="ghost" onclick="setRad(0)" style="font-size:.76rem;padding:4px 10px;background:#fff">Ampliar a Todo</button>`;
      }
    }
    if(relaxed.length){
      rows=relaxed;
      recoveryNoteHtml=`
        <div class="pr-recover">
          <div><b>🔄 ${relaxTitle}</b> Te mostramos <b>${relaxed.length}</b> opcion${relaxed.length===1?'':'es'} ampliando la búsqueda:</div>
          <div>${relaxBtn}</div>
        </div>`;
    }
  }

  let disambigHtml='';
  if(disambigOpts.length){
    disambigHtml=`
      <div class="card" style="background:#f0f7ff;border:1.5px solid #93c5fd;border-radius:12px;padding:12px;margin-bottom:12px;text-align:left">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:1.15rem">🔍</span>
            <b style="font-size:.88rem;color:#1e40af">¿Qué producto bajo "${esc(q)}" estás buscando?</b>
          </div>
          ${prActiveFilter?`<button type="button" class="ghost" onclick="clearPrFilter()" style="font-size:.74rem;padding:2px 8px;height:auto">✕ Ver todos</button>`:''}
        </div>
        <p class="mu" style="font-size:.76rem;margin:0 0 8px">Elegí una opción para acotar la búsqueda y comparar modelos exactos:</p>
        <div class="chips" style="flex-wrap:wrap;gap:6px">
          ${disambigOpts.map(opt=>{
            const isSel=prActiveFilter===opt.label||(!prActiveFilter&&opt.label.includes('Todas'));
            return `<button type="button" class="chip ${isSel?'on':''}" onclick="setPrFilter('${opt.label}')" style="font-size:.8rem;padding:5px 10px">${opt.label}</button>`;
          }).join('')}
        </div>
      </div>
    `;
  }

  // Navigable Breadcrumb (Item 3)
  const crumbParts=[`<button type="button" class="pr-crumb-btn" onclick="jumpToPrCrumbLevel('root')">Todos</button>`];
  if(prFacets.rubro){
    const sc=getStoreCatInfo(prFacets.rubro);
    crumbParts.push(`› <button type="button" class="pr-crumb-btn" onclick="jumpToPrCrumbLevel('rubro')">${sc.icon} ${esc(sc.label)}</button>`);
  }
  if(prFacets.category){
    crumbParts.push(`› <button type="button" class="pr-crumb-btn" onclick="jumpToPrCrumbLevel('category')">${CAT[prFacets.category]||'🛒'} ${esc(prFacets.category)}</button>`);
  }
  if(prFacets.subcategory){
    crumbParts.push(`› <button type="button" class="pr-crumb-btn" onclick="jumpToPrCrumbLevel('subcategory')">${esc(prFacets.subcategory)}</button>`);
  }
  if(prFacets.tag){
    crumbParts.push(`› <b>🏷️ ${esc(prFacets.tag)}</b>`);
  }
  const activeCatInfo=prFacets.rubro?getStoreCatInfo(prFacets.rubro):null;
  const activeCatNote=hasActivePrFacets()?`<div class="pr-crumb"><div class="pr-crumb-links"><span>Ruta:</span> ${crumbParts.join(' ')}</div><button type="button" class="ghost" onclick="clearPrFacets()" style="font-size:.72rem;padding:3px 8px;min-height:28px">Ver todos</button></div>`:'';

  const activePathText=[prFacets.rubro?getStoreCatInfo(prFacets.rubro).label:'',prFacets.category,prFacets.subcategory,prFacets.tag].filter(Boolean).join(' › ');
  const displayLabel=prActiveFilter||q||activePathText||'esta selección';
  if(!rows.length){
    if(prAI==='loading'){b.innerHTML=`${disambigHtml}${activeCatNote}<p class="mu">✨ Buscando productos relacionados…</p>`;return}
    const nx=r===0?null:RADS[RADS.indexOf(r)+1];
    b.innerHTML=`${disambigHtml}${activeCatNote}<div class="empty">Todavía no hay precios de "${esc(displayLabel)}" ${useR?`a menos de ${r} km`:'registrados'}.<br><br>${hasActivePrFacets()?`<button onclick="clearPrFacets()">Limpiar filtros de jerarquía</button><br><br>`:''}${prActiveFilter?`<button onclick="clearPrFilter()">Ver todas las opciones de ${esc(q)}</button><br><br>`:''}${nx!=null?`<button onclick="setRad(${nx})">Ampliar a ${nx?nx+' km':'todos los locales'}</button>`:'Podés ser el primero: escaneá un ticket con ese producto.'}</div>`;
    return;
  }

  const disp=dispCur();
  rows.forEach(x=>{x._p=conv(+x.unit_price,x.currency||'ARS',disp)});

  const acceptedRows=rows.filter(x=>!x.is_excluded);
  const directRows=acceptedRows.filter(x=>x.is_exact!==false&&!x.rel&&x.search_confidence!=='media');
  const relatedRows=acceptedRows.filter(x=>x.rel||x.is_exact===false||x.search_confidence==='media');

  const ex=acceptedRows.some(x=>x.is_exact);
  const nonRelatedRows=directRows.filter(x=>x._p!=null);
  const cand=(nonRelatedRows.length?nonRelatedRows:(acceptedRows.some(x=>x.is_exact)?acceptedRows.filter(x=>x.is_exact&&x._p!=null):acceptedRows.filter(x=>x._p!=null))).map(x=>x._p);
  const min=cand.length?Math.min(...cand):0;
  const max=cand.length?Math.max(...cand):0;
  const avg=cand.length?Math.round(cand.reduce((a,b)=>a+b,0)/cand.length):0;
  const spread=min>0?Math.round(((max-min)/min)*100):0;

  // Did you mean / Intent hints (Item 5)
  let dymHtml='';
  const dymPool=directRows.length?directRows:acceptedRows;
  if(qNorm&&dymPool.length&&dymPool.every(x=>(x.search_score||0)<88)&&dymPool.some(x=>x.fuzzy_match||x.search_match_type==='fuzzy')){
    const topFuzzy=dymPool.find(x=>x.fuzzy_match||x.search_match_type==='fuzzy')||dymPool[0];
    dymHtml=`<div class="pr-dym">💡 Mostrando resultados similares para <b>"${esc(q)}"</b> (coincidencia aproximada con <b>"${esc(topFuzzy.product)}"</b>).</div>`;
  }
  const intentHints=detectQueryIntentHints(qNorm);
  const intentHtml=intentHints.length?`<div class="pr-intent"><span>🎯 Detectado en tu búsqueda: <b>${esc(intentHints.join(' · '))}</b></span></div>`:'';

  // Calculate inflation ONLY for exact same accepted product
  let infHtml='';
  const qWords=significantQueryWords(qNorm);
  const exactCandidates=acceptedRows.filter(x=>{
    if(x.rel||x.is_exact===false||x._p==null||x._p<=0)return false;
    const pName=nk(x.product||''), pSub=nk(x.subcategory||'');
    return qWords.length>0&&qWords.every(qw=>pName.includes(qw)||pSub.includes(qw));
  });
  const exactGroups=[];
  exactCandidates.forEach(x=>{
    let grp=exactGroups.find(g=>isSameExactProduct(g.product,x.product));
    if(!grp){grp={product:x.product,items:[]};exactGroups.push(grp);}
    grp.items.push(x);
  });

  let bestInf=null;
  for(const grp of exactGroups){
    if(grp.items.length<2)continue;
    grp.items.sort((a,b)=>a.purchased_at.localeCompare(b.purchased_at));
    const oldest=grp.items[0], newest=grp.items[grp.items.length-1];
    if(oldest.purchased_at!==newest.purchased_at&&oldest._p>0){
      if(!bestInf||grp.items.length>bestInf.items.length)bestInf={product:grp.product,oldest,newest,items:grp.items};
    }
  }
  if(bestInf){
    const {product:pName,oldest,newest}=bestInf;
    const inf=Math.round(((newest._p/oldest._p)-1)*100);
    const dDays=Math.max(1,Math.round((new Date(newest.purchased_at)-new Date(oldest.purchased_at))/86400000));
    const dtOld=new Date(oldest.purchased_at+'T00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'});
    const dtNew=new Date(newest.purchased_at+'T00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'});
    const col=inf>0?'#b91c1c':inf<0?'#15803d':'#64748b';
    const icon=inf>0?'📈 ▲':inf<0?'📉 ▼':'=';
    const storeInfo=oldest.store===newest.store?`en ${esc(newest.store)}`:`de ${esc(oldest.store)} a ${esc(newest.store)}`;
    const isPerKg=/\b(kg|kilo|kilos)\b/i.test(pName)||['frutas','verduras','carnes'].includes(oldest.category)||['frutas','verduras','carnes'].includes(newest.category);
    const uLabel=isPerKg?'/kg':'';
    infHtml=`<div style="background:#fff;border:1px solid #fed7aa;border-radius:10px;padding:8px 10px;margin-top:8px"><div style="font-size:.82rem;font-weight:700;color:${col}">${icon} ${inf>0?`+${inf}% de aumento (inflación)`:inf<0?`${inf}% de baja`:'Precio estable'} en ${dDays} días</div><div style="font-size:.76rem;color:#1e293b;font-weight:600;margin-top:2px">Mismo producto: <b>${esc(pName)}</b></div><div class="mu" style="font-size:.72rem;margin-top:2px">De ${money(oldest._p,disp)}${uLabel} (${dtOld}) a ${money(newest._p,disp)}${uLabel} (${dtNew}) ${storeInfo}${isPerKg?' (comparado por kilo)':''}</div></div>`;
  }

  const bestStore=(acceptedRows.find(x=>x._p===min)||{}).store||'';
  const benchHtml=(min>0)?`<div class="card" style="background:#fcfbf8;border:1.5px solid var(--ln);padding:12px;margin:8px 0 12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:.92rem;color:#1e293b">📊 Comparativa en tu zona: "${esc(displayLabel)}"${activeCatInfo?` (${esc(activeCatInfo.label)})`:''}</b><span class="tag" style="background:#e8f5e9;color:#2e7d32;font-size:.7rem">${cand.length} ticket${cand.length===1?'':'s'} reportados</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin:6px 0"><div style="background:#fff;border:1px solid var(--ln);border-radius:8px;padding:6px 4px"><div class="mu" style="font-size:.68rem">MÁS BARATO</div><b class="num" style="color:#2e7d32;font-size:.98rem">${money(min,disp)}</b><div class="mu" style="font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(bestStore)}</div></div><div style="background:#fff;border:1px solid var(--ln);border-radius:8px;padding:6px 4px"><div class="mu" style="font-size:.68rem">PROMEDIO ZONA</div><b class="num" style="font-size:.98rem">${money(avg,disp)}</b><div class="mu" style="font-size:.65rem">${cand.length} registros</div></div><div style="background:#fff;border:1px solid var(--ln);border-radius:8px;padding:6px 4px"><div class="mu" style="font-size:.68rem">MÁS CARO</div><b class="num" style="color:#c62828;font-size:.98rem">${money(max,disp)}</b><div class="mu" style="font-size:.65rem">${spread>0?`+${spread}% brecha`:'único'}</div></div></div>${infHtml}</div>`:'';

  sortPriceList(directRows);
  sortPriceList(relatedRows);

  const showRank=(psort==='price'||psort==='unit'||psort==='rel'||!psort);
  const renderOfferSection=(list,rankOffset=0)=>{
    if(!list.length)return '';
    if(!prGroupByProduct){
      return list.map((x,idx)=>prCard(min,avg,ex,showRank?rankOffset+idx+1:null,{excluded:false})(x)).join('');
    }
    const groups=[];
    const map=new Map();
    list.forEach(item=>{
      const gk=buildCanonicalGroupKey(item);
      let g=map.get(gk);
      if(!g){g={key:gk,items:[]};map.set(gk,g);groups.push(g);}
      g.items.push(item);
    });
    groups.forEach(g=>sortPriceList(g.items));
    return groups.map((g,idx)=>renderCanonicalCard(g,min,avg,ex,showRank?rankOffset+idx+1:null)).join('');
  };

  let acceptedHtml='';
  if(!acceptedRows.length){
    acceptedHtml='<div class="card empty" style="padding:18px 10px;margin:0">Sin resultados aceptados para esta búsqueda.</div>';
  }else{
    const directHtml=renderOfferSection(directRows,0);
    const relatedHtml=relatedRows.length
      ?`${directRows.length?`<div class="pr-rel-hdr"><span>✨ Productos relacionados o coincidencia aproximada (${relatedRows.length})</span><span class="mu">No incluidos en el promedio exacto</span></div>`:''}${renderOfferSection(relatedRows,directRows.length)}`
      :'';
    acceptedHtml=directHtml+relatedHtml;
  }

  const n=new Set(acceptedRows.map(x=>x.store.toLowerCase()+'|'+(x.store_address||''))).size;
  b.innerHTML=`
    ${recoveryNoteHtml}
    ${disambigHtml}
    ${activeCatNote}
    ${dymHtml}
    ${intentHtml}
    ${benchHtml}
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 6px;flex-wrap:wrap;gap:6px">
      <div class="mu" style="font-size:.82rem">
        <b>${n} local${n===1?'':'es'}</b>${useR?(isRadiusRelaxed?` (ampliando desde ${r} km)`:` a menos de ${r} km`):''} ${prCat||!min?'':` · desde <b class="num" style="color:#15803d">${money(min,disp)}</b>`}
      </div>
      <div style="font-size:.76rem;color:#475569;font-weight:700">🏆 Ranking de precios (${acceptedRows.length})</div>
    </div>
    ${prNote()}
    <div class="chips">${[['rel','Relevancia'],['unit','$/kg o L'],['price','Más barato'],['near','Más cerca'],['recent','Más reciente']].map(([k,l])=>`<button class="chip ${psort===k?'on':''}" onclick="psort='${k}';renderPreciosToolbar();pRender('${esc(q)}',${r},${useR})">${l}</button>`).join('')}</div>
    <div class="pr-cols">
      <div class="pr-col" id="pr-col-accepted">
        ${acceptedHtml}
      </div>
    </div>
  `;
}

/* ---------- History ---------- */
let histQ = '';
let allReceipts = [];
let allReceiptItems = [];

async function history(silent){
  if(!silent){if(lastH.history){app(lastH.history);curH=lastH.history}else app('<p class="mu">Cargando…</p>')}
  const {data:rs=[],error}=await sb.from('receipts').select('*').order('purchased_at',{ascending:false}).limit(100);
  if(error)return silent?0:app(`<div class="card">${esc(error.message)}</div>`);
  allReceipts = rs;

  try{
    const rids = rs.map(r=>r.id);
    if(rids.length){
      const {data:its=[]}=await sb.from('receipt_items').select('id,receipt_id,name,qty,total_price,category,subcategory,brand,variant,size_value,size_unit').in('receipt_id',rids);
      allReceiptItems = its||[];
    }else{
      allReceiptItems = [];
    }
  }catch(_){allReceiptItems=[];}

  renderHistoryView(silent);
}

function onHistSearch(v){
  histQ = String(v||'');
  renderHistoryItemsOnly();
}
window.onHistSearch = onHistSearch;

function clearHistSearch(){
  histQ = '';
  const inp = document.getElementById('histSearch');
  if(inp) { inp.value = ''; inp.focus(); }
  renderHistoryItemsOnly();
}
window.clearHistSearch = clearHistSearch;

function setHistStoreCat(catKey){
  histStoreCat = normalizeStoreCategory(catKey) || '';
  document.querySelectorAll('#histCatBar .catbtn').forEach(b=>b.classList.toggle('on',(b.dataset.cat||'')===histStoreCat));
  renderHistoryItemsOnly();
}
window.setHistStoreCat = setHistStoreCat;

function clearHistFilters(){
  histQ = '';
  histStoreCat = '';
  const inp = document.getElementById('histSearch');
  if(inp) inp.value = '';
  document.querySelectorAll('#histCatBar .catbtn').forEach(b=>b.classList.toggle('on',(b.dataset.cat||'')===''));
  renderHistoryItemsOnly();
}
window.clearHistFilters = clearHistFilters;

function renderHistoryView(silent){
  const h = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h1 style="margin:0">Mis compras</h1>
      <span class="mu" style="font-size:.85rem">${allReceipts.length} compra${allReceipts.length===1?'':'s'}</span>
    </div>
    ${allReceipts.length?`
      <div style="margin-bottom:8px;position:relative">
        <input id="histSearch" type="search" placeholder="Buscá por comercio, marca o producto…" value="${esc(histQ)}" oninput="onHistSearch(this.value)" autocomplete="off" style="padding-left:36px;padding-right:32px;font-size:15px !important;border-radius:10px;background:#fff;border:1.5px solid var(--ln);width:100%">
        <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:1rem;color:var(--mu)">🔍</span>
        ${histQ?`<button type="button" onclick="clearHistSearch()" aria-label="Limpiar búsqueda" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mu);cursor:pointer;font-size:1.1rem;padding:4px">✕</button>`:''}
      </div>
      <div class="catbar" id="histCatBar">
        <button type="button" class="catbtn ${!histStoreCat?'on':''}" data-cat="" onclick="setHistStoreCat('')">Todas</button>
        ${STORE_CATEGORIES.map(c=>`<button type="button" class="catbtn ${histStoreCat===c.key?'on':''}" data-cat="${c.key}" onclick="setHistStoreCat('${c.key}')">${c.icon} ${c.label}</button>`).join('')}
      </div>
    `:''}
    <div id="histList"></div>
  `;
  show('history', h, silent);
  renderHistoryItemsOnly();
}

function renderHistoryItemsOnly(){
  const box = document.getElementById('histList');
  if(!box) return;
  if(!allReceipts.length){
    box.innerHTML = '<div class="empty">Acá van a aparecer tus compras.</div>';
    return;
  }
  const qNorm = nk(histQ);
  const qWords = qNorm.split(' ').filter(w=>w.length>=2);

  const filtered = allReceipts.map(r=>{
    const rItems = allReceiptItems.filter(i=>i.receipt_id===r.id);
    const storeCat = resolveReceiptStoreCategory(r, rItems);
    const scInfo = getStoreCatInfo(storeCat);
    if(histStoreCat && storeCat !== histStoreCat){
      return { receipt: r, isMatch: false, matchedItems: [], storeMatch: false, storeCat, scInfo };
    }

    const storeN = nk(r.store||'');
    const addrN = nk(r.store_address||'');
    const descN = nk(r.description||'');
    const scLabelN = nk(scInfo.label||'');
    const fullStoreText = `${storeN} ${addrN} ${descN} ${scLabelN}`;

    const storeMatch = !qNorm || (qWords.length?qWords.every(w=>fullStoreText.includes(w)):fullStoreText.includes(qNorm));

    const matchedItems = qNorm ? rItems.filter(i=>{
      const iname = nk(i.name||'');
      const ibrand = nk(i.brand||'');
      const ivar = nk(i.variant||'');
      const isize = (i.size_value&&i.size_unit)?nk(`${i.size_value}${i.size_unit} ${i.size_value} ${i.size_unit}`):'';
      const isub = nk(i.subcategory||'');
      const icat = nk(i.category||'');
      const itext = `${iname} ${ibrand} ${ivar} ${isize} ${isub} ${icat}`;
      return qWords.length?qWords.every(w=>itext.includes(w)):itext.includes(qNorm);
    }) : [];

    const isMatch = storeMatch || matchedItems.length>0;
    return { receipt: r, isMatch, matchedItems, storeMatch, storeCat, scInfo };
  }).filter(x=>x.isMatch);

  if(!filtered.length){
    const catTxt = histStoreCat ? getStoreCatInfo(histStoreCat).label : '';
    box.innerHTML = `
      <div class="empty">
        No encontramos compras${qNorm?` con <b>"${esc(histQ)}"</b>`:''}${catTxt?` en <b>${esc(catTxt)}</b>`:''}.<br>
        <span class="mu" style="font-size:.85rem;display:block;margin:6px 0 14px">Probá cambiando la categoría o buscando por otro comercio, marca o producto.</span>
        <button type="button" onclick="clearHistFilters()">Ver todas mis compras</button>
      </div>
    `;
    return;
  }

  box.innerHTML = filtered.map(({receipt:r, matchedItems, scInfo})=>{
    let matchPill = '';
    if(qNorm && matchedItems.length){
      const shownItems = matchedItems.slice(0,3);
      matchPill = `
        <div style="margin-top:8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:6px 10px;text-align:left">
          <div style="font-size:.72rem;font-weight:700;color:#166534;margin-bottom:2px">🎯 Coincide producto${matchedItems.length===1?'':'s'}:</div>
          ${shownItems.map(it=>{
            const sp=[it.brand,it.variant,it.size_value&&it.size_unit?`${it.size_value}${it.size_unit}`:''].filter(Boolean).join(' · ');
            return `<div style="font-size:.78rem;color:#14532d;display:flex;justify-content:space-between;gap:8px"><span><b>${esc(it.name)}</b>${sp?` <span class="mu">(${esc(sp)})</span>`:''} <span class="mu">×${it.qty||1}</span></span><b class="num">${money(it.total_price, r.currency)}</b></div>`;
          }).join('')}
          ${matchedItems.length>3?`<div class="mu" style="font-size:.7rem;margin-top:2px">+ ${matchedItems.length-3} producto${matchedItems.length-3===1?'':'s'} más</div>`:''}
        </div>
      `;
    }

    return `
      <div class="card" id="r${r.id}" style="text-align:left">
        <div class="row" style="border:0;cursor:pointer" onclick="detail('${r.id}','${r.currency||'ARS'}')">
          <span style="flex:1;min-width:0">
            <b>${esc(r.store)}</b>${r.doc_type==='factura'?` <span class="tag">📄 Factura${r.doc_number?' '+esc(r.doc_number):''}</span>`:''}
            ${r.store_address?`<br><span class="mu" style="font-size:.85rem">📍 ${esc(r.store_address)}</span>`:''}

async function detail(id,cur){
  const box=$('#d'+id);
  if(box.innerHTML){box.innerHTML='';return}
  const {data:its=[]}=await sb.from('receipt_items').select('*').eq('receipt_id',id);
  box.innerHTML=its.map(i=>{
    const sp=[i.brand,i.variant,(i.size_value&&i.size_unit)?`${i.size_value} ${i.size_unit==='l'?'L':i.size_unit}`:''].filter(Boolean).join(' · ');
    return `<div class="row"><span>${CAT[i.category]||'🛒'} ${esc(i.name)} <span class="mu">×${i.qty}</span>${sp?`<br><span class="mu" style="font-size:.76rem">${esc(sp)}</span>`:''}</span><span class="num">${money(i.total_price,cur)}</span></div>`;
  }).join('')+`<p><button class="ghost" onclick="editR('${id}')">✏️ Editar compra</button> <button class="x" onclick="del('${id}')">Eliminar compra</button></p>`;
}
async function editR(id){
  const [{data:r},{data:its=[]},{data:pp=[]}]=await Promise.all([sb.from('receipts').select('*').eq('id',id).single(),sb.from('receipt_items').select('*').eq('receipt_id',id),sb.from('price_points').select('product_name,lat,lng,description_key').eq('receipt_id',id).limit(50)]);
  if(!r)return toast('No se pudo cargar la compra');
  mapShown=false;
  const ppByName={};
  let ppStoreCat='';
  (pp||[]).forEach(p=>{
    const m=parseDescriptionKeyMeta(p.description_key);
    if(!ppStoreCat&&m.storeCategory)ppStoreCat=m.storeCategory;
    if(p.product_name)ppByName[nk(p.product_name)]=m;
  });
  const resolvedStoreCat=ppStoreCat||resolveReceiptStoreCategory(r,its);
  draft={
    id,
    currency:r.currency||'ARS',
    docType:r.doc_type==='factura'?'factura':'ticket',
    docNumber:r.doc_number||'',
    taxId:r.store_tax_id||'',
    store:r.store,
    storeCategory:resolvedStoreCat,
    _storeCatManual:true,
    date:r.purchased_at,
    description:r.description||'',
    address:r.store_address||'',
    lat:r.store_lat!=null?r.store_lat:(pp[0]?pp[0].lat:null),
    lng:r.store_lat!=null?r.store_lng:(pp[0]?pp[0].lng:null),
    items:its.map(i=>{
      const ppMeta=ppByName[nk(i.name)]||{};
      const st=parseStructuredProductText(i.name,{
        brand:i.brand,
        variant:i.variant,
        size_value:i.size_value,
        size_unit:i.size_unit,
        package_type:ppMeta.packageType,
        pack_count:ppMeta.packCount,
        base_name:ppMeta.baseName
      });
      const catVal=i.category||'otros';
      const subVal=nk(i.subcategory||'')||inferSubcategoryFromName(i.name,catVal)||'';
      return {
        name:i.name,
        base_name:st.base_name,
        brand:st.brand,
        variant:st.variant,
        qty:Number(i.qty),
        size_value:st.size_value,
        size_unit:st.size_unit,
        package_type:st.package_type,
        pack_count:st.pack_count,
        total_price:Number(i.total_price),
        category:catVal,
        subcategory:subVal,
        is_discount:isDiscountOrObraSocialItem({name:i.name,category:catVal,total_price:i.total_price}),
        tags:subVal?getTagsForSubcategory(catVal,subVal):[]
      };
    })
  };
  renderReceiptForm();
}
async function del(id){
  if(!confirm('¿Eliminar esta compra?'))return;
  try{await sb.from('price_points').delete().eq('receipt_id',id)}catch(_){}
  try{await sb.from('receipt_items').delete().eq('receipt_id',id)}catch(_){}
  const {error}=await sb.from('receipts').delete().eq('id',id);
  if(error)return toast(error.message);
  lastH.home=lastH.history=null;history();
}

function _emailHash(s){
  let h=2166136261;
  const str=String(s||'').trim().toLowerCase();
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(16);
}
const _ADMIN_HASHES=new Set(['b61fb304','bbec4add']);
function isAdminUser(u){
  if(!u)return false;
  if(u.app_metadata?.is_admin===true||u.app_metadata?.role==='admin'||u.user_metadata?.is_admin===true)return true;
  return !!(u.email&&_ADMIN_HASHES.has(_emailHash(u.email)));
}

async function fetchAdminProductsAudit(force){
  if(!force&&window._adminAuditCache)return window._adminAuditCache;
  let pricePoints=[], eanCatalog=[], searchVotes=[];
  let loadedViaApi=false;
  try{
    const sess=sb?.auth?.getSession?await sb.auth.getSession():null;
    const token=sess?.data?.session?.access_token;
    if(token){
      const r=await fetch('/api/canasta/admin/products-audit',{headers:{Authorization:'Bearer '+token}});
      if(r.ok){
        const j=await r.json();
        pricePoints=Array.isArray(j.pricePoints)?j.pricePoints:[];
        eanCatalog=Array.isArray(j.eanCatalog)?j.eanCatalog:[];
        searchVotes=Array.isArray(j.searchVotes)?j.searchVotes:[];
        loadedViaApi=true;
      }
    }
  }catch(_){}
  if(!loadedViaApi&&sb){
    try{
      const [ppRes,eanRes,fbRes]=await Promise.all([
        sb.from('price_points').select('id,product_name,product_key,brand,variant,size_value,size_unit,category,subcategory,description_key,ean,store,purchased_at,created_at').order('created_at',{ascending:false}).limit(300),
        sb.from('ean_catalog').select('ean,brand,product,variant,size_value,size_unit').limit(500),
        sb.from('feedback').select('id,user_id,screen,status,message,diagnostics,created_at').in('screen',['prices_thumb_up','prices_mismatch']).order('created_at',{ascending:false}).limit(300)
      ]);
      pricePoints=Array.isArray(ppRes?.data)?ppRes.data:[];
      eanCatalog=Array.isArray(eanRes?.data)?eanRes.data:[];
      searchVotes=Array.isArray(fbRes?.data)?fbRes.data:[];
    }catch(_){}
  }
  window._adminAuditCache={pricePoints,eanCatalog,searchVotes};
  return window._adminAuditCache;
}
window.fetchAdminProductsAudit=fetchAdminProductsAudit;

function extractTagsFromProductRow(p,alias){
  const catVal=nk(alias?.category||p?.category||'otros')||'otros';
  const subVal=nk(alias?.subcategory||p?.subcategory||inferSubcategoryFromName(p?.product_name||p?.product||'',catVal)||'');
  const tags=new Set();
  if(subVal){
    getTagsForSubcategory(catVal,subVal).forEach(t=>tags.add(nk(t)));
  }
  const addCsv=str=>{
    String(str||'').split(/[,;|]+/).map(s=>s.trim()).filter(Boolean).forEach(t=>{
      if(!/^(?:store_cat|pkg|pack|base):/i.test(t))tags.add(nk(t));
    });
  };
  if(alias?.tags)addCsv(alias.tags);
  const meta=parseDescriptionKeyMeta(p?.description_key);
  if(meta.tagsText)meta.tagsText.split(/\s{2,}|[,;|]+/).forEach(t=>{const c=nk(t);if(c)tags.add(c)});
  if(p?.subcategory)addCsv(p.subcategory);
  return Array.from(tags).filter(Boolean);
}

async function adminPersistPricePointUpdate(payload){
  let updatedViaApi=false;
  const dbSz=toDbSizePayload(payload?.size_value,payload?.size_unit);
  const safePayload={
    ...payload,
    ...(payload?.size_value!==undefined||payload?.size_unit!==undefined?dbSz:{})
  };
  try{
    const sess=sb?.auth?.getSession?await sb.auth.getSession():null;
    const token=sess?.data?.session?.access_token;
    if(token){
      const r=await fetch('/api/canasta/admin/product-update',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify(safePayload)
      });
      if(r.ok)updatedViaApi=true;
    }
  }catch(_){}
  if(!updatedViaApi&&sb&&safePayload?.rawName){
    try{
      const patch={};
      if(safePayload.brand!==undefined)patch.brand=safePayload.brand||null;
      if(safePayload.variant!==undefined)patch.variant=safePayload.variant||null;
      if(safePayload.size_value!==undefined||safePayload.size_unit!==undefined){
        patch.size_value=dbSz.size_value;
        patch.size_unit=dbSz.size_unit;
      }
      if(safePayload.category!==undefined)patch.category=safePayload.category||'otros';
      if(safePayload.subcategory!==undefined)patch.subcategory=safePayload.subcategory||null;
      if(safePayload.description_key!==undefined)patch.description_key=safePayload.description_key||null;
      if(Object.keys(patch).length){
        await sb.from('price_points').update(patch).eq('product_name',safePayload.rawName);
      }
    }catch(_){}
  }
}

async function adminSaveProductTags(encRaw,idx){
  const rawName=decodeURIComponent(encRaw||'');
  const inp=document.getElementById('adm-tags-inp-'+idx);
  const catEl=document.getElementById('adm-cat-inp-'+idx);
  const subEl=document.getElementById('adm-sub-inp-'+idx);
  const storeCatEl=document.getElementById('adm-storecat-inp-'+idx);
  const tags=String(inp?.value||'').split(/[,;|]+/).map(s=>nk(s)).filter(Boolean).join(', ');
  const category=catEl?nk(catEl.value||''):undefined;
  const subcategory=subEl?nk(subEl.value||''):undefined;
  const storeCategory=storeCatEl?normalizeStoreCategory(storeCatEl.value||''):undefined;
  if(!rawName)return;
  if(subcategory&&tags){
    await saveSubcategoryTagsRule(category||'otros',subcategory,tags);
  }
  await saveProductAliasRule(rawName,{tags,category,subcategory,storeCategory});
  const meta=parseDescriptionKeyMeta((window._adminAuditCache?.pricePoints||[]).find(p=>nk(p.product_name)===nk(rawName))?.description_key);
  const descKeyCombined=buildDescriptionKeyMeta({
    description:meta.cleanText,
    tags:tags?tags.split(/,\s*/):[],
    storeCategory:storeCategory!==undefined?storeCategory:meta.storeCategory,
    packageType:meta.packageType,
    packCount:meta.packCount,
    baseName:meta.baseName
  });
  await adminPersistPricePointUpdate({rawName,tags,category,subcategory,storeCategory,description_key:descKeyCombined});
  toast(`✓ Jerarquía y tags guardados para "${rawName}"`);
  window._adminAuditCache=null;
  return await admin();
}
async function adminAddManualProductTags(){
  const prod=$('#adm-new-tag-prod')?.value?.trim();
  const tagsRaw=$('#adm-new-tag-val')?.value?.trim()||'';
  const category=$('#adm-new-tag-cat')?.value?.trim()||'';
  const subcategory=$('#adm-new-tag-sub')?.value?.trim()||'';
  const storeCategory=$('#adm-new-tag-storecat')?.value?.trim()||'';
  if(!prod||(!tagsRaw&&!category&&!subcategory&&!storeCategory))return toast('Completá el producto y al menos una categoría, subcategoría o tag.');
  const tags=tagsRaw.split(/[,;|]+/).map(s=>nk(s)).filter(Boolean).join(', ');
  if(subcategory&&tags){
    await saveSubcategoryTagsRule(category||findCategoryForSubcategory(subcategory)||'otros',subcategory,tags);
  }
  await saveProductAliasRule(prod,{
    tags,
    ...(category?{category}:{}),
    ...(subcategory?{subcategory}:{}),
    ...(storeCategory?{storeCategory}:{})
  });
  await adminPersistPricePointUpdate({
    rawName:prod,
    ...(tags?{tags}:{}),
    ...(category?{category}:{}),
    ...(subcategory?{subcategory}:{}),
    ...(storeCategory?{storeCategory}:{})
  });
  toast(`✓ Guardado para "${prod}"`);
  window._adminAuditCache=null;
  return await admin();
}
async function adminClearProductTags(encRaw){
  const rawName=decodeURIComponent(encRaw||'');
  if(!rawName)return;
  const al=getAdminProductAliases();
  const existing=al[nk(rawName)];
  if(existing&&existing.normalizedName){
    await saveProductAliasRule(rawName,{tags:'',category:'',subcategory:'',storeCategory:''});
  }else{
    await removeProductAliasRule(rawName);
  }
  await adminPersistPricePointUpdate({rawName,tags:''});
  toast(`Tags removidos para "${rawName}"`);
  window._adminAuditCache=null;
  return await admin();
}

async function renderAdminDownvotes(b){
  b.innerHTML='<p class="mu">Cargando ítems con manito abajo y exclusiones…</p>';
  const [shared,audit]=await Promise.all([
    loadSharedSearchVotes(true).catch(()=>({counts:{},pairs:[]})),
    fetchAdminProductsAudit(true).catch(()=>({searchVotes:[]}))
  ]);
  const exMap=getAdminExclusionsMap();
  const byPair={};

  for(const p of (shared.pairs||[])){
    const qN=nk(p.query||''), prodN=nk(p.product||'');
    if(!qN||!prodN)continue;
    const key=`${qN}|||${prodN}`;
    byPair[key]={
      key,
      query:p.query||qN,
      product:p.product||prodN,
      up:Number(p.up)||0,
      down:Number(p.down)||0,
      stores:Array.isArray(p.stores)?[...p.stores]:[],
      notes:Array.isArray(p.notes)?[...p.notes]:[],
      unresolvedIds:Array.isArray(p.unresolvedIds)?[...p.unresolvedIds]:[],
      _fromShared:true
    };
  }

  const seenAuditVoter=new Set();
  for(const v of (audit.searchVotes||[])){
    const d=v?.diagnostics||{};
    const qRaw=String(d.query||'').trim(), pRaw=String(d.product||'').trim();
    const qN=nk(qRaw), pN=nk(pRaw);
    if(!qN||!pN)continue;
    const key=`${qN}|||${pN}`;
    const isUp=v.screen==='prices_thumb_up'||d.is_accurate===true;
    if(!byPair[key]){
      byPair[key]={key,query:qRaw,product:pRaw,up:0,down:0,stores:[],notes:[],unresolvedIds:[],_fromShared:false};
    }
    if(!byPair[key]._fromShared){
      const vk=`${v.user_id||v.id||Math.random()}::${key}`;
      if(!seenAuditVoter.has(vk)){
        seenAuditVoter.add(vk);
        if(isUp)byPair[key].up++;
        else byPair[key].down++;
      }
    }
    if(d.store&&!byPair[key].stores.includes(String(d.store)))byPair[key].stores.push(String(d.store));
    if(d.note&&!byPair[key].notes.includes(String(d.note)))byPair[key].notes.push(String(d.note));
    if(!isUp&&v.status!=='resuelto'&&v.id&&!byPair[key].unresolvedIds.includes(v.id)){
      byPair[key].unresolvedIds.push(v.id);
    }
  }

  const downItems=Object.values(byPair)
    .filter(item=>item.down>0||item.unresolvedIds.length>0)
    .sort((a,b)=>(b.unresolvedIds.length-a.unresolvedIds.length)||(b.down-a.down)||a.query.localeCompare(b.query));

  const downHtml=downItems.length?downItems.map(item=>{
    const qN=nk(item.query), prodN=nk(item.product);
    const isEx=!!getExclusionReason(qN,{product:item.product})||!!(exMap[qN]&&exMap[qN].some(ex=>prodN.includes(ex)||ex===prodN));
    const isPending=item.unresolvedIds.length>0;
    const encQ=encodeURIComponent(item.query);
    const encProd=encodeURIComponent(item.product);
    const encIds=encodeURIComponent(JSON.stringify(item.unresolvedIds));
    return `<div style="border:1px solid ${isEx?'#fecaca':(isPending?'#fed7aa':'#e2e8f0')};border-radius:10px;padding:10px;margin-bottom:8px;background:#fff">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <div style="font-size:.86rem;color:#0f172a">Búsqueda: <b>"${esc(item.query)}"</b> ➔ <b>"${esc(item.product)}"</b></div>
          <div class="mu" style="font-size:.73rem;margin-top:2px">
            <span style="color:#b91c1c;font-weight:700">👎 ${item.down}</span> ·
            <span style="color:#15803d;font-weight:700">👍 ${item.up}</span>
            ${item.stores.length?` · ${esc(item.stores.slice(0,3).join(', '))}`:''}
            ${item.notes.length?` · "${esc(item.notes[0])}"`:''}
          </div>
        </div>
        <span class="tag" style="font-size:.7rem;font-weight:700;background:${isEx?'#fef2f2':(isPending?'#fff7ed':'#f0fdf4')};color:${isEx?'#b91c1c':(isPending?'#9a3412':'#15803d')}">
          ${isEx?'🚫 Excluido':(isPending?'⏳ Por revisar':'✓ Permitido')}
        </span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <button type="button" onclick="adminDecideDownvote('${encQ}','${encProd}','exclude','${encIds}')" style="font-size:.74rem;min-height:36px;padding:4px 10px;background:#b91c1c">🚫 Excluir asociación</button>
        <button type="button" class="ghost" onclick="adminDecideDownvote('${encQ}','${encProd}','allow','${encIds}')" style="font-size:.74rem;min-height:36px;padding:4px 10px;color:#15803d;border-color:#bbf7d0">✓ No excluir (Permitir)</button>
        <button type="button" class="ghost" onclick="adminDecideDownvote('${encQ}','${encProd}','synonym','${encIds}')" style="font-size:.74rem;min-height:36px;padding:4px 10px;color:#1e40af;border-color:#bfdbfe">🔤 Vincular sinónimo</button>
      </div>
    </div>`;
  }).join(''):'<div class="empty">No hay ítems con manito abajo para revisar por ahora.</div>';

  const exPairs=Object.entries(exMap).flatMap(([k,list])=>list.map(v=>({k,v})));
  const exItems=exPairs.length?exPairs.map((pair,idx)=>{
    const ek=encodeURIComponent(pair.k), ev=encodeURIComponent(pair.v);
    return `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid #f1f5f9">
      <input id="ex-edit-from-${idx}" type="text" value="${esc(pair.k)}" style="flex:1;min-width:110px;font-size:.8rem">
      <span class="mu" style="font-size:.78rem">excluye</span>
      <input id="ex-edit-to-${idx}" type="text" value="${esc(pair.v)}" style="flex:1;min-width:110px;font-size:.8rem">
      <button type="button" onclick="adminEditExclusion(${idx},'${ek}','${ev}')" style="font-size:.74rem;min-height:36px;padding:4px 10px">💾 Cambiar</button>
      <button type="button" class="ghost" onclick="adminRemoveExclusion('${ek}','${ev}')" style="font-size:.74rem;min-height:36px;padding:4px 10px;color:#b91c1c;border-color:#fecaca">🗑️ Eliminar</button>
    </div>`;
  }).join(''):'<p class="mu" style="font-size:.78rem;margin:4px 0">Sin exclusiones manuales activas.</p>';

  b.innerHTML=`
    <div class="card" style="text-align:left">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div>
          <h2 style="margin:0">Ítems con Manito Abajo (👎)</h2>
          <p class="mu" style="font-size:.8rem;margin:3px 0 0">Gestión 100% manual: ninguna asociación se excluye automáticamente por cantidad de votos. Revisá los reportes y decidí si excluir o permitir.</p>
        </div>
        <button type="button" class="ghost" onclick="loadSharedSearchVotes(true).then(()=>fetchAdminProductsAudit(true)).then(()=>admin())" style="font-size:.76rem;min-height:38px">🔄 Actualizar</button>
      </div>
      ${downHtml}
    </div>

    <div class="card" style="text-align:left">
      <h2 style="margin-top:0">🚫 Reglas de Exclusión Activas</h2>
      <p class="mu" style="font-size:.8rem">Solo se excluyen las asociaciones decididas manualmente acá por un Administrador.</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px">
        <input id="ex-from" type="text" placeholder="Al buscar (ej: leche)" style="flex:1;min-width:130px;font-size:.82rem">
        <input id="ex-to" type="text" placeholder="Excluir (ej: chocolate)" style="flex:1;min-width:130px;font-size:.82rem">
        <button type="button" class="ghost" onclick="addAdminExclusion()" style="white-space:nowrap;font-size:.8rem;min-height:40px;color:#b91c1c;border-color:#fecaca">🚫 Excluir</button>
      </div>
      <div>${exItems}</div>
    </div>
  `;
}

async function resolveFeedbackIds(ids){
  const cleanIds=Array.isArray(ids)?ids.filter(Boolean):[];
  if(!cleanIds.length)return;
  try{
    const sess=sb?.auth?.getSession?await sb.auth.getSession():null;
    const token=sess?.data?.session?.access_token;
    if(token){
      await fetch('/api/canasta/admin/feedback-resolve',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({ids:cleanIds,status:'resuelto'})
      });
      return;
    }
  }catch(_){}
  if(sb){
    for(const fid of cleanIds){
      try{await sb.from('feedback').update({status:'resuelto'}).eq('id',fid);}catch(_){}
    }
  }
}

async function adminDecideDownvote(encQ,encProd,decision,encIds){
  const q=decodeURIComponent(encQ||''), prod=decodeURIComponent(encProd||'');
  let ids=[];
  try{ids=JSON.parse(decodeURIComponent(encIds||'[]'));}catch(_){}
  if(decision==='exclude'){
    markAdminAllowedPair(q,prod,false);
    await addAdminExclusionRule(q,prod);
    toast(`🚫 Excluido "${prod}" al buscar "${q}"`);
  }else if(decision==='allow'){
    markAdminAllowedPair(q,prod,true);
    await removeAdminExclusionRule(q,prod);
    toast(`✓ Permitido "${prod}" al buscar "${q}"`);
  }else if(decision==='synonym'){
    markAdminAllowedPair(q,prod,true);
    await addAdminEquivRule(q,prod);
    toast(`🔤 Sinónimo vinculado: "${q}" ➔ "${prod}"`);
  }
  await resolveFeedbackIds(ids);
  window._adminAuditCache=null;
  window._sharedSearchVotes.loadedAt=0;
  return await admin();
}

async function saveNewPasswordSettings(){
  const p1=$('#cpw1')?.value||'', p2=$('#cpw2')?.value||'';
  if(!p1||p1.length<6)return toast('La contraseña debe tener al menos 6 caracteres.');
  if(p1!==p2)return toast('Las dos contraseñas no coinciden.');
  toast('Actualizando contraseña…');
  try{
    const {error}=await sb.auth.updateUser({password:p1});
    if(error)return toast(explainAuth(error));
    closeModal();
    toast('¡Contraseña actualizada con éxito!');
  }catch(e){
    toast('Error: '+(e?.message||e));
  }
}

/* ---------- Refresco silencioso y auto-actualización ---------- */
const APP_VER=document.querySelector('meta[name=app-version]').content;
function refresh(){
  if(document.hidden||!user||draft||!safe())return;
  if(view==='home')home(true);else if(view==='history')history(true);
}
async function checkUpdate(){
  try{
    const t=await (await fetch(location.pathname,{cache:'no-store'})).text();
    const m=/name="app-version" content="([^"]+)"/.exec(t);
    if(m&&m[1]!==APP_VER)pendingReload=true;
  }catch(e){}
}
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden)return;
  checkSession();
  await checkUpdate();
  if(pendingReload&&!draft&&view!=='scan'&&safe()){sessionStorage.setItem('goto',view);location.reload();return}
  refresh();
});
addEventListener('focus',refresh);
setInterval(refresh,30000);
setInterval(checkUpdate,300000);
boot();checkUpdate();
</script>
