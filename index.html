<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E8E5A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#FAF7F0;--card:#fff;--g:#3E8E5A;--gd:#2f7048;--r:#D9534F;--tx:#23312A;--mu:#6b7a70;--ln:#ebe5d6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 Nunito,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 16px;font-weight:800}
h2{font-size:1.1rem;margin:20px 0 8px;font-weight:800}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(35,49,42,.08)}
.big{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.mu{color:var(--mu);font-size:.9rem}
.up{color:var(--r);font-weight:700}.down{color:var(--g);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;background:var(--g);color:#fff;cursor:pointer;display:inline-block}
button:hover,.btn:hover{background:var(--gd)}
button.ghost{background:transparent;color:var(--g);border:2px solid var(--g)}
button.x{background:transparent;color:var(--r);padding:6px 10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9fd3b0;outline-offset:2px}
input,select,textarea{font:inherit;resize:vertical;width:100%;padding:10px 12px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;color:var(--tx)}
.it{display:grid;grid-template-columns:1fr 56px 90px 36px;gap:6px;margin-bottom:6px}
.fields{display:grid;gap:8px;margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;color:var(--mu);padding:6px 8px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--g)}
nav button.scan{background:var(--g);color:#fff;border-radius:50%;width:60px;height:60px;margin-top:-28px;font-size:1.6rem;justify-content:center;box-shadow:0 4px 12px rgba(62,142,90,.4)}
.empty{text-align:center;padding:32px 8px;color:var(--mu)}
#map{height:280px;border-radius:14px;overflow:hidden;margin:8px 0;background:#e8e2d3}#map iframe{width:100%;height:100%;border:0}
.sb{position:sticky;top:0;background:var(--bg);padding:4px 0 8px;z-index:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{background:#fff;color:var(--tx);border:1.5px solid var(--ln);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.chip:hover{background:#eef6f0;color:var(--tx)}.chip.on,.chip.on:hover{background:var(--g);color:#fff;border-color:var(--g)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{background:#f3efe4;border-radius:999px;padding:3px 10px;font-size:.82rem}
.tag.best{background:var(--g);color:#fff;font-weight:800}.tag.up{background:#fbe6e5;color:var(--r);font-weight:700}.tag.dn{background:#e3f2e8;color:var(--g);font-weight:700}
.pp{text-align:right}.p2{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.sim{font-size:.75rem;background:#fff3cd;border-radius:6px;padding:1px 6px;margin-left:6px}
a.btn.sm{padding:8px 14px;font-size:.9rem;text-decoration:none}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9;max-width:90%}
@media(min-width:900px){nav{max-width:420px;left:50%;transform:translateX(-50%);border-radius:20px 20px 0 0}}
</style>
</head>
<body>
<div id="toast"></div>
<main id="app"></main>
<nav id="nav" hidden>
  <button data-v="home">🏠<span>Inicio</span></button>
  <button data-v="prices">🔎<span>Precios</span></button>
  <button class="scan" data-v="scan" aria-label="Escanear ticket">📷</button>
  <button data-v="history">🧾<span>Compras</span></button>
  <button data-v="settings">⚙️<span>Ajustes</span></button>
</nav>
<script>
// 1) Pegá acá los datos de tu proyecto de Supabase (Settings > API)
const SB_URL='https://ddzklkweeftwqqbaozty.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkemtsa3dlZWZ0d3FxYmFvenR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMjA0OTEsImV4cCI6MjEwNjg5NjQ5MX0.Ma79cMLtflb7cA2nCbj_NwwFDmLR2QC-2ElunLy9D6E';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const CAT={lacteos:'🥛',carnes:'🥩',panaderia:'🍞',verduras:'🥬',frutas:'🍎',bebidas:'🥤',limpieza:'🧴',almacen:'🥫',otros:'🛒'};
const today=()=>new Date().toISOString().slice(0,10);
let user=null,view='home',draft=null,pendB64='',pendData=null,mapShown=false,pos=null,psort='price',pTok=0,prRows=[];

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function app(h){$('#app').innerHTML=h}

/* ---------- Auth ---------- */
function login(){
  $('#nav').hidden=true;
  app(`<h1>🧺 Canasta</h1><div class="card"><p>Registrá tus compras del súper y mirá cómo cambian los precios.</p>
  <div class="fields"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Contraseña (mín. 6)" autocomplete="current-password"></div>
  <button onclick="auth('in')">Entrar</button> <button class="ghost" onclick="auth('up')">Crear cuenta</button></div>`);
}
async function auth(k){
  const email=$('#em').value.trim(),password=$('#pw').value;
  const {error}=k==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
  if(error)return toast(error.message);
  boot();
}
async function boot(){
  const {data}=await sb.auth.getSession();
  user=data.session?.user||null;
  if(!user)return login();
  $('#nav').hidden=false;go('home');
}

/* ---------- Navigation ---------- */
function go(v){
  view=v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ({home,prices,scan,history,settings})[v]();
}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};

/* ---------- Home ---------- */
async function home(){
  app('<p class="mu">Cargando…</p>');
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const ms=(yy,mm)=>new Date(yy,mm,1).toLocaleDateString('sv').slice(0,10);
  const m0=ms(y,m),m1=ms(y,m-1);
  const {data:rs=[],error}=await sb.from('receipts').select('*').gte('purchased_at',m1).order('purchased_at',{ascending:false});
  if(error)return app(`<div class="card">No se pudo cargar: ${esc(error.message)}</div>`);
  const cur=rs.filter(r=>r.purchased_at>=m0),prev=rs.filter(r=>r.purchased_at<m0);
  const sum=a=>a.reduce((s,r)=>s+Number(r.total),0),c=sum(cur),p=sum(prev);
  const d=p?((c-p)/p*100):null;
  let top='';
  if(cur.length){
    const {data:its=[]}=await sb.from('receipt_items').select('name,total_price,category').in('receipt_id',cur.map(r=>r.id));
    const agg={};its.forEach(i=>{const k=i.name.toLowerCase();agg[k]=agg[k]||{n:i.name,c:i.category,t:0,q:0};agg[k].t+=Number(i.total_price);agg[k].q++});
    const l=Object.values(agg).sort((a,b)=>b.t-a.t).slice(0,5);
    top=`<h2>Lo que más gastás</h2><div class="card">${l.map(i=>`<div class="row"><span>${CAT[i.c]||'🛒'} ${esc(i.n)} <span class="mu">×${i.q}</span></span><span class="num">${money(i.t)}</span></div>`).join('')}</div>`;
  }
  app(`<h1>Este mes</h1>
  <div class="card"><div class="mu">Gastaste en el súper</div><div class="big">${money(c)}</div>
  <div class="mu">${cur.length} compra${cur.length===1?'':'s'}${d===null?'':` · <span class="${d>0?'up':'down'}">${d>0?'+':''}${d.toFixed(1)}%</span> vs. el mes pasado`}</div></div>
  ${top}
  ${rs.length?'':`<div class="empty">Todavía no cargaste compras.<br><br><button onclick="go('scan')">Escanear mi primer ticket</button></div>`}`);
}

/* ---------- Scan ---------- */
function scan(){
  draft=null;mapShown=false;
  app(`<h1>Nuevo ticket</h1><div class="card"><p>Sacale una foto al ticket y revisá los datos antes de guardar.</p>
  <label class="btn" style="margin:0 6px 8px 0">📷 Sacar foto<input id="f" type="file" accept="image/*" capture="environment" hidden></label>
  <label class="btn" style="margin:0 6px 8px 0">🖼️ Elegir de la galería<input id="g" type="file" accept="image/*" hidden></label>
  <button class="ghost" onclick="manual()" style="margin-bottom:8px">Cargar a mano</button><p id="st" class="mu"></p></div>`);
  $('#f').onchange=$('#g').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    $('#st').textContent='Revisando la foto…';
    try{const r=await resize(f);pendB64=r.b64;const tips=localTips(r.q);if(tips.length)return retake(tips,'img');await run(r.b64)}catch(err){$('#st').textContent='';toast(err.message)}
  };
}
function manual(){mapShown=false;draft={store:'',date:today(),description:'',address:'',lat:null,lng:null,items:[{name:'',qty:1,total_price:0,category:'otros'}]};form()}
function quality(i){
  const k=Math.min(1,1000/Math.max(i.width,i.height)),w=Math.round(i.width*k),h=Math.round(i.height*k),c=document.createElement('canvas');
  c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(i,0,0,w,h);
  const d=cx.getImageData(0,0,w,h).data,g=new Float32Array(w*h);let sum=0;
  for(let p=0;p<w*h;p++){g[p]=.299*d[p*4]+.587*d[p*4+1]+.114*d[p*4+2];sum+=g[p]}
  let m=0,m2=0,n=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x,l=4*g[p]-g[p-1]-g[p+1]-g[p-w]-g[p+w];m+=l;m2+=l*l;n++}
  return{blur:m2/n-(m/n)**2,bright:sum/(w*h),min:Math.min(i.width,i.height)};
}
function localTips(q){
  const t=[];
  if(q.min<700)t.push('La foto es muy chica: acercate al ticket o usá la cámara trasera.');
  if(q.bright<70)t.push('Hay poca luz: buscá un lugar más iluminado.');
  if(q.bright>235)t.push('Hay reflejo o exceso de luz: evitá el flash y la luz directa sobre el papel.');
  if(q.blur<25)t.push('Se ve borrosa: mantené quieto el celular y esperá a que enfoque antes de sacar.');
  return t;
}
function retake(tips,mode){
  const use=mode==='img'?'run(pendB64)':mode==='data'?'draft=norm(pendData);form()':'';
  app(`<h1>Mejor sacá otra foto</h1><div class="card"><p><b>No se lee bien el ticket:</b></p><ul>${tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  <p class="mu">Consejos: apoyá el ticket sobre una superficie plana y oscura, alisalo bien, encuadralo completo y de frente, con buena luz y sin flash. Si es muy largo, sacalo en partes y cargá lo que falte con "+ Agregar producto".</p></div>
  <button onclick="scan()">📷 Sacar otra foto</button> ${use?`<button class="ghost" onclick="${use}">Usar igual</button>`:''} <button class="ghost" onclick="manual()">Cargar a mano</button>`);
}
async function run(b64){
  app('<h1>Nuevo ticket</h1><p class="mu">Leyendo el ticket…</p>');
  try{
    const d=await extract(b64),n=(d.items||[]).length,bad=d.quality&&d.quality.legible===false;
    if(bad||!n){pendData=d;const tips=((d.quality&&d.quality.issues)||[]).filter(Boolean);return retake(tips.length?tips:['No pude identificar productos en la foto.'],n?'data':'')}
    draft=norm(d);form();
  }catch(err){scan();toast(err.message)}
}
const resize=f=>new Promise((ok,no)=>{const i=new Image();i.onerror=()=>no(Error('No se pudo abrir la imagen'));i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok({b64:c.toDataURL('image/jpeg',.8).split(',')[1],q:quality(i)})};i.src=URL.createObjectURL(f)});
async function extract(b64){
  const key=localStorage.getItem('gk');
  if(!key)throw Error('Falta la clave de Gemini en Ajustes');
  const prompt=`Extraé los datos de este ticket de supermercado argentino. Respondé solo JSON: {"store":string,"store_address":string,"description":string,"quality":{"legible":boolean,"issues":[string]},"date":"YYYY-MM-DD","items":[{"name":string,"qty":number,"total_price":number,"category":"lacteos|carnes|panaderia|verduras|frutas|bebidas|limpieza|almacen|otros"}]}. Los precios son números en pesos (punto decimal, sin símbolo). total_price es el total de la línea. Ignorá subtotales, descuentos globales y medios de pago. En description poné, como texto libre, los comentarios, notas, leyendas, promociones o anotaciones manuscritas que aparezcan en el ticket (no los productos); si no hay, dejalo vacío. En quality.legible poné false si el ticket está borroso, cortado, con reflejos, muy oscuro o ilegible; en issues describí en español, en frases cortas, qué problema tiene la foto y cómo mejorarla. En store_address poné la dirección del local tal como figura impresa en el ticket (calle, número y localidad); si no aparece, dejalo vacío.`;
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json'}})});
  const j=await r.json();
  if(!r.ok)throw Error(j.error?.message||'Error al leer el ticket');
  return JSON.parse(j.candidates[0].content.parts[0].text);
}
const norm=d=>({lat:null,lng:null,address:String(d.store_address||'').trim(),description:String(d.description||'').trim(),store:d.store||'',date:/^\d{4}-\d{2}-\d{2}$/.test(d.date)?d.date:today(),items:(d.items||[]).map(i=>({name:i.name||'',qty:Number(i.qty)||1,total_price:Number(i.total_price)||0,category:CAT[i.category]?i.category:'otros'}))});

function form(){
  const t=draft.items.reduce((s,i)=>s+i.total_price,0);
  app(`<h1>Revisá el ticket</h1>
  <div class="fields"><input id="store" placeholder="Supermercado" value="${esc(draft.store)}" oninput="draft.store=this.value"><input type="date" value="${draft.date}" oninput="draft.date=this.value"><textarea rows="2" placeholder="Descripción (opcional): ocasión, notas, promo…" oninput="draft.description=this.value">${esc(draft.description)}</textarea><input id="addr" placeholder="Dirección del local" value="${esc(draft.address)}" oninput="draft.address=this.value;draft.lat=draft.lng=null"><button class="ghost" type="button" onclick="mapOpen()">📍 Elegir en Google Maps</button><div id="mapbox" hidden><input id="msearch" placeholder="Buscá el local y tocá Enter" hidden><div id="map"></div><p id="mmsg" class="mu"></p></div></div>
  <div class="mu it"><span>Producto</span><span>Cant.</span><span>Total</span><span></span></div>
  ${draft.items.map((i,k)=>`<div class="it"><input value="${esc(i.name)}" oninput="draft.items[${k}].name=this.value" aria-label="Producto"><input type="number" min="0" step="any" value="${i.qty}" oninput="draft.items[${k}].qty=+this.value" aria-label="Cantidad"><input type="number" min="0" step="any" value="${i.total_price}" onchange="draft.items[${k}].total_price=+this.value;form()" aria-label="Total"><button class="x" onclick="draft.items.splice(${k},1);form()" aria-label="Quitar">✕</button></div>`).join('')}
  <p><button class="ghost" onclick="draft.items.push({name:'',qty:1,total_price:0,category:'otros'});form()">+ Agregar producto</button></p>
  <div class="card row"><b>Total</b><b class="num">${money(t)}</b></div>
  ${localStorage.getItem('share')!=='0'?`<p class="mu">🔒 Tus precios se comparten de forma anónima.${draft.lat!=null?'':' Elegí el local en el mapa para que aparezcan en búsquedas por zona.'} Podés cambiarlo en Ajustes.</p>`:''}
  <button onclick="save()">Guardar compra</button>`);
  if(mapShown)mapOpen();
}
async function save(){
  const items=draft.items.filter(i=>i.name.trim());
  if(!draft.store.trim())return toast('Poné el nombre del supermercado');
  if(!items.length)return toast('Agregá al menos un producto');
  const total=items.reduce((s,i)=>s+i.total_price,0);
  const {data:r,error}=await sb.from('receipts').insert({store:draft.store.trim(),purchased_at:draft.date,description:draft.description.trim()||null,store_address:draft.address.trim()||null,total}).select().single();
  if(error)return toast(error.message);
  const {error:e2}=await sb.from('receipt_items').insert(items.map(i=>({receipt_id:r.id,name:i.name.trim(),qty:i.qty||1,unit_price:i.total_price/(i.qty||1),total_price:i.total_price,category:i.category})));
  if(e2){await sb.from('receipts').delete().eq('id',r.id);return toast(e2.message)}
  let note='Compra guardada';
  if(localStorage.getItem('share')!=='0'){
    const pp=items.filter(i=>i.total_price>0).map(i=>({receipt_id:r.id,store:draft.store.trim(),store_address:draft.address.trim()||null,lat:draft.lat,lng:draft.lng,product_name:i.name.trim(),product_key:nk(i.name),qty:i.qty||1,unit_price:i.total_price/(i.qty||1),total_price:i.total_price,purchased_at:draft.date}));
    if(pp.length){const {error:e3}=await sb.from('price_points').insert(pp);if(e3)note+=' (no se pudieron compartir los precios)'}
  }
  toast(note);go('home');
}

/* ---------- Asistente de Google Maps ---------- */
function getPos(){return new Promise(ok=>{if(pos||!navigator.geolocation)return ok(pos);navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};ok(pos)},()=>ok(null),{timeout:10000,maximumAge:600000})})}
async function mapOpen(){
  mapShown=true;$('#mapbox').hidden=false;
  const c=await getPos(),key=localStorage.getItem('mk'),q=draft.store.trim();
  $('#msearch').hidden=!key;
  if(!c)$('#mmsg').textContent='No pude usar tu ubicación. Permitila en el navegador para que el mapa se abra donde estás.';
  if(key)return mapJs(key,c,q);
  const src=`https://maps.google.com/maps?output=embed&z=15&hl=es&q=${encodeURIComponent(q||'supermercado')}${c?`&ll=${c.lat},${c.lng}`:''}`;
  $('#map').innerHTML=`<iframe src="${src}" loading="lazy" title="Mapa"></iframe>`;
  $('#mmsg').innerHTML=`Buscá tu local y copiá la dirección. <a href="https://www.google.com/maps/search/${encodeURIComponent(q||'supermercado')}${c?`/@${c.lat},${c.lng},15z`:''}" target="_blank" rel="noopener">Abrir en Google Maps</a>. Con una clave de Maps en Ajustes la dirección se completa sola.`;
}
function loadMaps(key){return window.google&&google.maps&&google.maps.importLibrary?Promise.resolve():new Promise((ok,no)=>{window.__mi=ok;const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&loading=async&language=es&callback=__mi`;s.onerror=()=>no(Error('No se pudo cargar Google Maps'));document.head.appendChild(s)})}
async function mapJs(key,c,q){
  try{await loadMaps(key);const {Place}=await google.maps.importLibrary('places');
    const center=c||{lat:-34.6037,lng:-58.3816},map=new google.maps.Map($('#map'),{center,zoom:c?16:11,mapTypeControl:false,streetViewControl:false,fullscreenControl:false}),mk=new google.maps.Marker({map});
    if(c)new google.maps.Marker({map,position:c,title:'Vos',icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:'#4285F4',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
    const fill=(name,addr,loc)=>{draft.address=addr||'';draft.lat=loc?loc.lat():null;draft.lng=loc?loc.lng():null;$('#addr').value=draft.address;if(name&&!draft.store.trim()){draft.store=name;$('#store').value=name}if(loc){mk.setPosition(loc);map.panTo(loc)}$('#mmsg').textContent='Dirección cargada: revisala y guardá.'};
    map.addListener('click',async e=>{if(!e.placeId)return;e.stop();try{const p=new Place({id:e.placeId,requestedLanguage:'es'});await p.fetchFields({fields:['displayName','formattedAddress','location']});fill(p.displayName,p.formattedAddress,p.location)}catch(err){$('#mmsg').textContent='No pude leer ese lugar: '+err.message}});
    $('#msearch').onkeydown=async e=>{if(e.key!=='Enter')return;e.preventDefault();const t=e.target.value.trim();if(!t)return;try{const r=await Place.searchByText({textQuery:t,fields:['displayName','formattedAddress','location'],locationBias:c?{center:c,radius:5000}:undefined,maxResultCount:1,language:'es'});if(!r.places.length)return $('#mmsg').textContent='No encontré ese local cerca.';const p=r.places[0];map.setZoom(17);fill(p.displayName,p.formattedAddress,p.location)}catch(err){$('#mmsg').textContent='Error de búsqueda: '+err.message}};
    if(q&&!$('#msearch').value)$('#msearch').value=q;
    $('#mmsg').textContent='Tocá el local en el mapa, o buscalo arriba y tocá Enter.';
  }catch(err){$('#mmsg').textContent='Maps: '+err.message}
}

/* ---------- Precios ---------- */
const nk=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const RADS=[1,3,5,10,25,0];
const rad=()=>{const v=localStorage.getItem('rad');return v===null?5:+v};
const recents=()=>{try{return JSON.parse(localStorage.getItem('rs')||'[]')}catch(e){return []}};
const fmtD=k=>k<1?`${Math.round(k*1000)} m`:`${k.toFixed(1).replace('.',',')} km`;
const days=d=>Math.floor((new Date(today())-new Date(d))/864e5);
function ago(d){const n=days(d),m=Math.floor(n/30),y=Math.floor(n/365);return n<=0?'hoy':n===1?'ayer':n<30?`hace ${n} días`:n<365?`hace ${m} ${m===1?'mes':'meses'}`:`hace ${y} ${y===1?'año':'años'}`}
const prHome=rs=>`<div class="empty"><div style="font-size:2.4rem">🔎</div>Buscá un producto y mirá dónde está más barato cerca tuyo.<br><span class="mu">Los precios vienen de tickets de otras personas, de forma anónima.</span></div>${rs.length?`<h2>Búsquedas recientes</h2><div class="chips" style="flex-wrap:wrap">${rs.map(t=>`<button class="chip" onclick="pSet('${nk(t)}')">🕘 ${esc(nk(t))}</button>`).join('')}</div>`:''}`;
function prices(){
  app(`<h1>Precios</h1>
  <div class="sb"><input id="pq" type="search" placeholder="Buscá un producto (ej: leche entera 1L)" autocomplete="off" oninput="clearTimeout(window._pd);window._pd=setTimeout(()=>pGo(),400)" onkeydown="if(event.key==='Enter')pGo(true)"></div>
  <div class="mu" style="margin:0 0 4px">Distancia máxima</div>
  <div class="chips" id="prad">${RADS.map(r=>`<button class="chip ${r===rad()?'on':''}" onclick="setRad(${r})">${r?r+' km':'Todo'}</button>`).join('')}</div>
  <div id="ploc" class="mu" style="margin-bottom:8px"></div>
  <div id="pbody">${prHome(recents())}</div>`);
  getPos().then(pLoc);
}
function pLoc(){const e=$('#ploc');if(e)e.innerHTML=pos?'📍 Usando tu ubicación actual':'⚠️ No tengo tu ubicación: permitila en el navegador para filtrar por distancia. <button class="chip" onclick="getPos().then(pLoc)">Reintentar</button>'}
function pSet(t){$('#pq').value=t;pGo(true)}
function setRad(r){localStorage.setItem('rad',r);document.querySelectorAll('#prad .chip').forEach((b,i)=>b.classList.toggle('on',RADS[i]===r));if(nk($('#pq').value).length>=2)pGo()}
async function pGo(save){
  const q=nk($('#pq').value),tok=++pTok,b=$('#pbody');
  if(q.length<2){b.innerHTML=prHome(recents());return}
  b.innerHTML='<p class="mu">Buscando…</p>';
  await getPos();pLoc();
  const r=rad(),useR=r>0&&!!pos;
  const {data,error}=await sb.rpc('search_prices',{q,user_lat:pos?pos.lat:null,user_lng:pos?pos.lng:null,radius_km:useR?r:null});
  if(tok!==pTok)return;
  if(error){b.innerHTML=`<div class="card">No se pudo buscar: ${esc(error.message)}</div>`;return}
  prRows=data||[];
  if(save&&prRows.length)localStorage.setItem('rs',JSON.stringify([q,...recents().filter(x=>x!==q)].slice(0,6)));
  pRender(q,r,useR);
}
const prCard=(min,anyExact)=>x=>{
  const up=+x.unit_price,best=up===min&&(x.is_exact||!anyExact),diff=min>0?Math.round((up/min-1)*100):0,
    tr=x.prev_price?Math.round((up/+x.prev_price-1)*100):0,
    dest=x.lat!=null?`${x.lat},${x.lng}`:encodeURIComponent(x.store_address||x.store),
    dt=new Date(x.purchased_at+'T00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'});
  return `<div class="card"><div class="row" style="border:0;align-items:flex-start;padding-top:0"><div><b>${esc(x.store)}</b><div class="mu">${esc(x.store_address||'Sin dirección')}</div></div><div class="pp"><div class="p2">${money(up)}</div><div class="mu">por unidad</div></div></div>
  <div class="mu">${esc(x.product)}${x.is_exact?'':'<span class="sim">similar</span>'}</div>
  <div class="tags">${best?'<span class="tag best">Más barato</span>':diff>0?`<span class="tag">+${diff}% vs. el más barato</span>`:''}${x.distance_km!=null?`<span class="tag">📍 ${fmtD(x.distance_km)}</span>`:''}<span class="tag">🕒 ${ago(x.purchased_at)} · ${dt}</span>${tr?`<span class="tag ${tr>0?'up':'dn'}">${tr>0?'▲':'▼'} ${Math.abs(tr)}% vs. antes</span>`:''}${days(x.purchased_at)>30?'<span class="tag">⚠️ puede haber cambiado</span>':''}${x.reports>1?`<span class="tag">${x.reports} registros</span>`:''}</div>
  <a class="btn sm" href="https://www.google.com/maps/dir/?api=1&destination=${dest}" target="_blank" rel="noopener">Cómo llegar</a></div>`;
};
function pRender(q,r,useR){
  const b=$('#pbody');
  if(!prRows.length){
    const nx=r===0?null:RADS[RADS.indexOf(r)+1];
    b.innerHTML=`<div class="empty">Todavía no hay precios de "${esc(q)}" ${useR?`a menos de ${r} km`:'registrados'}.<br><br>${nx!=null?`<button onclick="setRad(${nx})">Ampliar a ${nx?nx+' km':'todos los locales'}</button>`:'Podés ser el primero: escaneá un ticket con ese producto.'}</div>`;
    return;
  }
  const rows=[...prRows],ex=rows.some(x=>x.is_exact),min=Math.min(...rows.filter(x=>!ex||x.is_exact).map(x=>+x.unit_price));
  rows.sort({price:(a,c)=>(c.is_exact-a.is_exact)||(a.unit_price-c.unit_price),near:(a,c)=>(a.distance_km??1e9)-(c.distance_km??1e9),recent:(a,c)=>c.purchased_at.localeCompare(a.purchased_at)}[psort]);
  const n=new Set(rows.map(x=>x.store.toLowerCase()+'|'+(x.store_address||''))).size;
  b.innerHTML=`<div class="mu" style="margin:4px 0 8px">${n} local${n===1?'':'es'}${useR?` a menos de ${r} km`:''} · desde <b class="num">${money(min)}</b></div>
  <div class="chips">${[['price','Más barato'],['near','Más cerca'],['recent','Más reciente']].map(([k,l])=>`<button class="chip ${psort===k?'on':''}" onclick="psort='${k}';pRender('${q}',${r},${useR})">${l}</button>`).join('')}</div>${rows.map(prCard(min,ex)).join('')}`;
}

/* ---------- History ---------- */
async function history(){
  app('<p class="mu">Cargando…</p>');
  const {data:rs=[],error}=await sb.from('receipts').select('*').order('purchased_at',{ascending:false}).limit(100);
  if(error)return app(`<div class="card">${esc(error.message)}</div>`);
  app(`<h1>Mis compras</h1>${rs.length?rs.map(r=>`<div class="card" id="r${r.id}"><div class="row" style="border:0;cursor:pointer" onclick="detail('${r.id}')"><span><b>${esc(r.store)}</b>${r.store_address?`<br><span class="mu">${esc(r.store_address)}</span>`:''}<br><span class="mu">${r.purchased_at}</span>${r.description?`<br><span class="mu">${esc(r.description)}</span>`:''}</span><b class="num">${money(r.total)}</b></div><div id="d${r.id}"></div></div>`).join(''):'<div class="empty">Acá van a aparecer tus compras.</div>'}`);
}
async function detail(id){
  const box=$('#d'+id);
  if(box.innerHTML){box.innerHTML='';return}
  const {data:its=[]}=await sb.from('receipt_items').select('*').eq('receipt_id',id);
  box.innerHTML=its.map(i=>`<div class="row"><span>${CAT[i.category]||'🛒'} ${esc(i.name)} <span class="mu">×${i.qty}</span></span><span class="num">${money(i.total_price)}</span></div>`).join('')+`<p><button class="x" onclick="del('${id}')">Eliminar compra</button></p>`;
}
async function del(id){
  if(!confirm('¿Eliminar esta compra?'))return;
  const {error}=await sb.from('receipts').delete().eq('id',id);
  if(error)return toast(error.message);
  history();
}

/* ---------- Settings ---------- */
function settings(){
  app(`<h1>Ajustes</h1><div class="card"><h2 style="margin-top:0">Lectura de tickets</h2>
  <p class="mu">Clave de Gemini (se guarda solo en este dispositivo).</p>
  <input id="gk" type="password" placeholder="Clave de Gemini" value="${esc(localStorage.getItem('gk')||'')}"><p><button onclick="localStorage.setItem('gk',$('#gk').value.trim());toast('Clave guardada')">Guardar clave</button></p></div>
  <div class="card"><h2 style="margin-top:0">Precios compartidos</h2><label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" style="width:auto;margin-top:4px" ${localStorage.getItem('share')!=='0'?'checked':''} onchange="localStorage.setItem('share',this.checked?'1':'0')"><span>Compartir mis precios de forma anónima con otros usuarios <span class="mu">(producto, precio, local y fecha; nunca tu nombre ni tu email). Se aplica a los tickets que cargues desde ahora.</span></span></label></div>
  <div class="card"><h2 style="margin-top:0">Google Maps (opcional)</h2><p class="mu">Con una clave de Maps JavaScript API y Places API (New), el mapa se abre en tu ubicación y la dirección se completa al tocar el local. Sin clave se muestra un mapa simple.</p><input id="mk" type="password" placeholder="Clave de Google Maps" value="${esc(localStorage.getItem('mk')||'')}"><p><button onclick="localStorage.setItem('mk',$('#mk').value.trim());toast('Clave guardada')">Guardar clave</button></p></div>
  <div class="card"><div class="mu">${esc(user.email)}</div><p><button class="ghost" onclick="sb.auth.signOut().then(boot)">Cerrar sesión</button></p></div>`);
}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
